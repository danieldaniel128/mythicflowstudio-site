<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Twinkle Tether</title>
<style>
html,body{margin:0;height:100%;background:#070b1c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
#err{position:fixed;left:8px;right:8px;bottom:8px;color:#fff;background:rgba(150,30,70,.9);font:14px sans-serif;padding:8px 10px;border-radius:8px;display:none;z-index:9}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err"></div>
<script>
(() => {
'use strict';
const DEMO = /[?&]demo=1(&|$)/.test(location.search);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const errEl = document.getElementById('err');

// ---------- constants ----------
const VW = 360, VH = 640, CX = 180, CY = 350, FR = 11, TAU = Math.PI * 2;
const PINK = '#ff7eb6', GOLD = '#ffd45e', PINK_RGB = '255,126,182', GOLD_RGB = '255,212,94';
const NOTES = [523.3, 587.3, 659.3, 784, 880, 1046.5];
const RBX = 326, RBY = 56; // restart button
const STICK_T = 1.0;   // seconds a sticky pad holds the gold twin
const AI_SPD = 150;    // demo drag speed, px/s (also converts hold time to drag length in sims)
const STICK_PX = 130;  // hold length in px of pink travel, used by the level builder
const HINTS = {
  1: ['Drag anywhere to fly pink', 'The gold twin mirrors you'],
  2: ['Green pads stop the gold twin', 'Push straight up into one'],
  3: ['Wrapped pads catch the twin', 'Slide pink while it is held'],
  4: ['Slide the gold ring', 'onto the pink pad']
};
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const easeOutBack = x => { const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);

// ---------- screen scaling ----------
let W = 0, H = 0, DPR = 1, SC = 1, OX = 0, OY = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  SC = Math.min(W / VW, H / VH);
  OX = (W - VW * SC) / 2; OY = (H - VH * SC) / 2;
}
window.addEventListener('resize', resize);
resize();

// ---------- audio (only after a user gesture, never in demo) ----------
let actx = null;
function initAudio() {
  if (DEMO) return;
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type, vol, delay, slide) {
  if (!actx) return;
  const t0 = actx.currentTime + (delay || 0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.1, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
function chime(f, vol, delay) { tone(f, 0.6, 'sine', vol, delay); tone(f * 2.01, 0.3, 'sine', vol * 0.35, delay); }

// ---------- RNG ----------
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- movement / collision ----------
// Mirror is left<->right across the pond's centre line: up/down moves both the same way,
// left/right moves them opposite. Only green pads (and the pond edge) block the gold twin.
// Sticky green pads also catch the twin: it stays put for a beat while pink flies on freely,
// which shifts the mirror offset in any direction. st = { sim, p, left, dis, used, just }:
// p = pad holding the twin, left = hold left (seconds live, px of pink travel in sims),
// dis = pad just released (re-arms once the twin drifts clear of it).
function resolveB(b, R, live, pads, st) {
  for (const p of pads) {
    if (!p.alive || p.kind !== 'N' || p.pop < 0.5) continue;
    const dx = b.x - p.x, dy = b.y - p.y, d = Math.hypot(dx, dy), m = p.r + FR;
    if (d < m) {
      const nx = d > 1e-3 ? dx / d : 1, ny = d > 1e-3 ? dy / d : 0;
      b.x = p.x + nx * m; b.y = p.y + ny * m;
      if (live) { p.hit = true; p.nx = nx; p.ny = ny; }
      if (st && p.sticky && !st.p && st.dis !== p) {
        st.p = p; st.left = st.sim ? STICK_PX : STICK_T; st.used = true;
        if (live) st.just = p;
      }
    }
  }
  if (st && st.dis && (!st.dis.alive || dist(b, st.dis) > st.dis.r + FR + 4)) st.dis = null;
  const lim = R - FR, ex = b.x - CX, ey = b.y - CY, d = Math.hypot(ex, ey);
  if (d > lim) { b.x = CX + ex / d * lim; b.y = CY + ey / d * lim; }
}
function movePair(a, b, dx, dy, R, live, pads, st) {
  const n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 3)), sx = dx / n, sy = dy / n, lim = R - FR;
  for (let i = 0; i < n; i++) {
    let nx = a.x + sx, ny = a.y + sy;
    const ex = nx - CX, ey = ny - CY, d = Math.hypot(ex, ey);
    if (d > lim) { nx = CX + ex / d * lim; ny = CY + ey / d * lim; }
    const mx = nx - a.x, my = ny - a.y;
    a.x = nx; a.y = ny;
    if (st && st.p) { // twin is held: pink moves alone
      if (!st.sim) continue; // live holds are timed in update()
      st.left -= Math.hypot(mx, my);
      if (st.left > 0) continue;
      st.dis = st.p; st.p = null;
    }
    b.x -= mx; b.y += my;
    resolveB(b, R, live, pads, st);
  }
}

// ---------- level generation ----------
let noteIdx = 0;
function pad(x, y, r, kind, sticky) {
  return { x, y, r, kind, sticky: !!sticky, ang: Math.random() * TAU, wob: 0, alive: true, sink: 0, touch: false, hit: false, nx: 0, ny: 0, pop: 1, cd: 0, note: (noteIdx++) % NOTES.length };
}
function makeLevel(n) {
  const lv = { R0: 158, shrink: Math.min(2.1, 0.9 + 0.12 * n), pads: [], a: null };
  if (n === 1) { // goals are exact mirrors: just drag
    lv.shrink = 1.0;
    lv.a = { x: CX - 60, y: CY + 85 };
    lv.pads.push(pad(CX - 75, CY - 45, 24, 'A'), pad(CX + 75, CY - 45, 24, 'B'),
      pad(CX - 115, CY + 15, 16, 'N'), pad(CX, CY + 115, 18, 'N'), pad(CX + 15, CY - 110, 16, 'N'));
    return lv;
  }
  if (n === 2) { // one straight push: the green pad holds the twin on gold while pink flies on
    lv.shrink = 1.1;
    lv.a = { x: CX - 60, y: CY + 105 };
    lv.pads.push(pad(CX - 60, CY - 45, 24, 'A'), pad(CX + 60, CY + 68, 24, 'B'),
      pad(CX + 60, CY + 20, 22, 'N'), pad(CX - 10, CY - 110, 16, 'N'), pad(CX - 120, CY + 20, 16, 'N'));
    return lv;
  }
  if (n === 3) { // sticky tutorial: push up into the wrapped pad, keep flying up while gold waits, then slide
    lv.shrink = 1.1;
    lv.a = { x: CX - 50, y: CY + 45 };
    lv.pads.push(pad(CX - 85, CY - 34, 23, 'A'), pad(CX + 85, CY + 26, 23, 'B'),
      pad(CX + 50, CY - 30, 20, 'N', true), pad(CX - 120, CY + 55, 16, 'N'), pad(CX + 5, CY + 115, 16, 'N'));
    return lv;
  }
  // Built backwards from a real solution, so every level is solvable.
  // Sticky pads only add options (pink can always undo what it did during a hold), so the
  // builder's route through them is one valid solution among several multi-stroke plans.
  const r = mulberry(n * 7919 + 13);
  const rp = (a, b) => { const an = r() * TAU, d = a + (b - a) * Math.sqrt(r()); return { x: CX + Math.cos(an) * d, y: CY + Math.sin(an) * d }; };
  const minNeed = Math.min(35 + n * 5, 100);
  const nb = Math.min(6, 2 + Math.floor(n * 0.5));
  const nSticky = n >= 7 ? 2 : 1;
  for (let tries = 0; tries < 600; tries++) {
    const a = rp(40, 105), b = { x: 2 * CX - a.x, y: a.y };
    const greens = [];
    for (let k = 0; greens.length < nb && k < 200; k++) {
      const p = rp(20, 100), pr = 16 + r() * 7; // stays inside the pond as long as the goals do
      if (dist(p, b) < pr + FR + 8 || dist(p, a) < pr + 6) continue;
      let ok = true;
      for (const q of greens) if (dist(p, q) < pr + q.r + 2 * FR + 6) { ok = false; break; }
      if (ok) greens.push(pad(p.x, p.y, pr, 'N', greens.length < nSticky));
    }
    const sa = { x: a.x, y: a.y }, sb = { x: b.x, y: b.y };
    const st = { sim: true, p: null, left: 0, dis: null, used: false };
    const strokes = 2 + (r() < 0.4 ? 1 : 0);
    let inside = true;
    for (let s = 0; s < strokes; s++) {
      let an = r() * TAU, l = 50 + r() * 110;
      if (s === 0 && greens.length && r() < 0.7) { // aim the twin into the sticky pad, then fly on while held
        const q = greens[0], bx = q.x - sb.x, by = q.y - sb.y, bd = Math.hypot(bx, by);
        an = Math.atan2(by, -bx) + (r() - 0.5) * 0.5;
        l = Math.max(20, bd - q.r - FR) + 20 + r() * 100;
      }
      movePair(sa, sb, Math.cos(an) * l, Math.sin(an) * l, 1000, false, greens, st);
      if (Math.hypot(sa.x - CX, sa.y - CY) > 105 || Math.hypot(sb.x - CX, sb.y - CY) > 105) { inside = false; break; }
    }
    if (!inside) continue;
    if (!st.used && tries < 450) continue; // prefer routes that really use a sticky pad
    const gA = { x: sa.x, y: sa.y }, gB = { x: sb.x, y: sb.y };
    for (const q of greens) { // ease the gold pad off a green pad so both read clearly
      const d = dist(gB, q), m = q.r + 14;
      if (d < m && d > 0) { gB.x = q.x + (gB.x - q.x) / d * m; gB.y = q.y + (gB.y - q.y) / d * m; }
    }
    if (dist(gB, sb) > 12) continue;
    const need = Math.hypot(gB.x - (2 * CX - gA.x), gB.y - gA.y);
    if (need < minNeed) continue;
    if (Math.hypot(gA.x - CX, gA.y - CY) > 100 || Math.hypot(gB.x - CX, gB.y - CY) > 100) continue;
    if (dist(a, gA) < 60 || dist(b, gB) < 60 || dist(gA, gB) < 50) continue;
    let clash = false;
    for (const q of greens) if (dist(gA, q) < q.r + 18) { clash = true; break; }
    if (clash) continue;
    lv.pads = [pad(gA.x, gA.y, 23, 'A'), pad(gB.x, gB.y, 23, 'B')].concat(greens);
    lv.a = a;
    return lv;
  }
  return makeLevel(2);
}

// ---------- state ----------
let level = DEMO ? 3 : 1, L = null, state = 'play', stateT = 0, elapsed = 0, started = false, t = 0, holdT = 0;
let onA = false, onB = false, aligned = false, border = 158, danger = 0, shake = 0, flashA = 0, flashRGB = '255,255,255';
let hintA = 0, best = 1, ghostNear = 0, ghostPh = 0, misT = 0;
try { best = +(localStorage.getItem('twinkleBest') || 1); } catch (e) {}
const A = { x: 0, y: 0, kx: 0, ky: 0 }, B = { x: 0, y: 0, kx: 0, ky: 0, sq: 0 };
const ghost = { x: 0, y: 0 };
const pend = { x: 0, y: 0 };
// live sticky-pad state (see resolveB); wrap/wp drive the tether-wrap visual
const ST = { sim: false, p: null, left: 0, dis: null, used: false, just: null, wrap: 0, wp: null };
const parts = [], rings = [];
const motes = [];
for (let i = 0; i < 28; i++) motes.push({ x: Math.random() * VW, y: Math.random() * VH, s: 1 + Math.random() * 2, ph: Math.random() * TAU, v: 4 + Math.random() * 8 });
const ai = { think: 0, rx: 0, ry: 0, plan: null, drag: false };

// Where pink must go so the twin lands on gold (given the twin's current shift).
function updGhost() {
  const gA = L.pads[0], gB = L.pads[1];
  ghost.x = A.x + B.x - gB.x; ghost.y = gB.y - B.y + A.y;
  const d = dist(ghost, gA);
  ghostNear = clamp(1 - (d - 18) / 140, 0, 1); // 0 = far off, 1 = on the pink pad
  return d < 18;
}
function startLevel() {
  L = makeLevel(level);
  A.x = L.a.x; A.y = L.a.y;
  B.x = 2 * CX - A.x; B.y = A.y; B.kx = B.ky = 0; B.sq = 0;
  L.pads.forEach((p, i) => { p.pop = -i * 0.07; });
  state = 'play'; stateT = 0; elapsed = 0; holdT = 0; started = DEMO;
  onA = onB = false; pend.x = pend.y = 0;
  ST.p = ST.dis = ST.just = ST.wp = null; ST.left = ST.wrap = 0; ST.used = false;
  aligned = updGhost(); misT = 0;
  hintA = !DEMO && HINTS[level] ? 1 : 0;
  ai.think = 0.7; ai.rx = ai.ry = 0; ai.plan = null;
  border = borderR();
}
function borderR() {
  const base = L.R0 - (started ? L.shrink * elapsed : 0);
  return base + 6 * Math.sin(t * TAU / 3.2);
}

// ---------- juice ----------
function burst(x, y, col, n, sp, life) {
  for (let i = 0; i < n && parts.length < 450; i++) {
    const a = Math.random() * TAU, s = sp * (0.3 + Math.random() * 0.7);
    const l = life * (0.6 + Math.random() * 0.4);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l, m: l, c: col, s: 1.5 + Math.random() * 2.5 });
  }
}
function ring(x, y, col, vr, life, w) { rings.push({ x, y, r: 4, vr, l: life, m: life, c: col, w: w || 3 }); }

function bounce(p, speed) {
  if (p.cd > 0 || speed < 25) return;
  p.cd = 0.18;
  B.kx = p.nx * 7; B.ky = p.ny * 7; // visual hop only: position stays precise
  p.wob = 1; B.sq = 1;
  const cx = p.x + p.nx * p.r, cy = p.y + p.ny * p.r;
  burst(cx, cy, '#c8ffe6', 10, 110, 0.5);
  ring(cx, cy, '200,255,230', 70, 0.5, 2);
  shake = Math.max(shake, Math.min(5, 1.5 + speed / 120));
  chime(NOTES[p.note], clamp(speed / 500, 0.05, 0.13));
}
function stickFx(p) {
  p.wob = 0.8; B.sq = 0.6;
  burst(B.x, B.y, '#dfe8ff', 12, 90, 0.6);
  ring(p.x, p.y, '223,232,255', 60, 0.6, 2.5);
  shake = Math.max(shake, 2.5);
  tone(330, 0.25, 'sine', 0.08, 0, 1.5); chime(659.3, 0.07, 0.05);
}
function unstickFx(p) {
  ring(p.x, p.y, '223,232,255', 110, 0.5, 2);
  burst(p.x, p.y, '#dfe8ff', 10, 120, 0.5);
  chime(880, 0.06);
}
function win() {
  state = 'win'; stateT = 0;
  burst(A.x, A.y, PINK, 34, 220, 0.9); burst(B.x, B.y, GOLD, 34, 220, 0.9);
  burst(CX, CY, '#ffffff', 16, 140, 0.7);
  ring(A.x, A.y, PINK_RGB, 160, 0.8, 4); ring(B.x, B.y, GOLD_RGB, 160, 0.8, 4);
  flashA = 0.55; flashRGB = '255,250,235'; shake = 7;
  [523.3, 659.3, 784, 1046.5].forEach((f, i) => chime(f, 0.12, i * 0.09));
  if (level + 1 > best && !DEMO) { best = level + 1; try { localStorage.setItem('twinkleBest', best); } catch (e) {} }
}
function fail(p) {
  state = 'fail'; stateT = 0;
  flashA = 0.45; flashRGB = '255,110,150'; shake = 12;
  burst(p.x, p.y, p.kind === 'A' ? PINK : GOLD, 26, 160, 0.8);
  ring(p.x, p.y, '255,255,255', 120, 0.7, 4);
  tone(392, 0.5, 'triangle', 0.12, 0, 0.6); tone(330, 0.7, 'triangle', 0.1, 0.18, 0.5);
}

// ---------- demo AI: receding-horizon search over short two-stroke drags ----------
const tA = { x: 0, y: 0 }, tB = { x: 0, y: 0 };
function cost(a, b) {
  const gA = L.pads[0], gB = L.pads[1];
  return Math.max(0, dist(a, gA) - gA.r * 0.45) + Math.max(0, dist(b, gB) - gB.r * 0.45);
}
const simSt = { sim: true, p: null, left: 0, dis: null, used: false };
function simPlan(p, R) {
  tA.x = A.x; tA.y = A.y; tB.x = B.x; tB.y = B.y;
  simSt.p = ST.p; simSt.left = ST.p ? ST.left * AI_SPD : 0; simSt.dis = ST.dis;
  movePair(tA, tB, p[0], p[1], R, false, L.pads, simSt);
  const c1 = cost(tA, tB);
  if (!p[2] && !p[3]) return c1;
  movePair(tA, tB, p[2], p[3], R, false, L.pads, simSt);
  return Math.min(c1, cost(tA, tB));
}
function aiThink() {
  const R = border - 4, gA = L.pads[0];
  let pick = null, bc = 1e9;
  const tryP = (p, bonus) => {
    const c = simPlan(p, R) + 0.03 * (Math.hypot(p[0], p[1]) + Math.hypot(p[2], p[3])) - bonus;
    if (c < bc) { bc = c; pick = p; }
  };
  tryP([0, 0, 0, 0], 0);
  tryP([gA.x - A.x, gA.y - A.y, 0, 0], 0);
  if (ST.p) { // while held: slide the gold ring onto the pink pad, then fly pink onto it
    const hx = gA.x - ghost.x, hy = gA.y - ghost.y;
    tryP([hx, hy, 0, 0], 0);
    tryP([hx, hy, ghost.x - A.x, ghost.y - A.y], 0);
  }
  if (ai.plan) tryP([ai.rx, ai.ry, ai.plan[2], ai.plan[3]], 2);
  for (let i = 0; i < 90; i++) {
    const a1 = Math.random() * TAU, l1 = 10 + Math.random() * 130;
    const a2 = Math.random() * TAU, l2 = Math.random() < 0.3 ? 0 : 10 + Math.random() * 130;
    tryP([Math.cos(a1) * l1, Math.sin(a1) * l1, Math.cos(a2) * l2, Math.sin(a2) * l2], 0);
  }
  ai.plan = pick; ai.rx = pick[0]; ai.ry = pick[1];
}
function aiUpdate(dt) {
  if (state !== 'play') { ai.plan = null; ai.drag = false; return; }
  ai.think -= dt;
  if (ai.think <= 0) { ai.think = 0.35; aiThink(); }
  let l = Math.hypot(ai.rx, ai.ry);
  if (l < 0.5 && ai.plan && (ai.plan[2] || ai.plan[3])) {
    ai.rx = ai.plan[2]; ai.ry = ai.plan[3]; ai.plan[2] = ai.plan[3] = 0; l = Math.hypot(ai.rx, ai.ry);
  }
  if (l > 0.01) {
    const k = Math.min(1, AI_SPD * dt / l), mx = ai.rx * k, my = ai.ry * k;
    pend.x += mx; pend.y += my; ai.rx -= mx; ai.ry -= my;
  }
  ai.drag = l > 0.5;
}

// ---------- update ----------
function update(dt) {
  t += dt; stateT += dt;
  if (DEMO) aiUpdate(dt);
  const R = border = borderR();

  for (const p of L.pads) {
    p.pop = Math.min(1, p.pop + dt * 3);
    p.wob *= Math.exp(-5 * dt);
    p.cd = Math.max(0, p.cd - dt);
    if (!p.alive) p.sink = Math.min(1, p.sink + dt * 2);
  }
  B.sq *= Math.exp(-8 * dt);
  const kd = Math.exp(-10 * dt); B.kx *= kd; B.ky *= kd;
  ST.wrap += ((ST.p ? 1 : 0) - ST.wrap) * (1 - Math.exp(-12 * dt));
  if (ST.p) ST.wp = ST.p; else if (ST.wrap < 0.02) ST.wp = null;

  if (state === 'play') {
    const dx = pend.x, dy = pend.y;
    pend.x = pend.y = 0;
    if (dx || dy) started = true;
    if (started) elapsed += dt;
    if (started && hintA > 0) hintA = Math.max(0.5, hintA - dt);

    const speed = Math.hypot(dx, dy) / Math.max(dt, 1e-3);
    if (ST.p && (!ST.p.alive || (ST.left -= dt) <= 0)) { // the beat is over: the tether unwraps
      const p = ST.p; ST.dis = p; ST.p = null; ST.left = 0;
      if (p.alive) unstickFx(p);
    }
    movePair(A, B, dx, dy, R, true, L.pads, ST);
    // breathing border pushes both inward (not mirrored)
    const ex = A.x - CX, ey = A.y - CY, ed = Math.hypot(ex, ey), lim = R - FR;
    if (ed > lim) { A.x = CX + ex / ed * lim; A.y = CY + ey / ed * lim; }
    resolveB(B, R, true, L.pads, ST);
    if (ST.just) { stickFx(ST.just); ST.just = null; }
    for (const p of L.pads) {
      if (p.hit && !p.touch && p !== ST.p) bounce(p, speed);
      p.touch = p.hit; p.hit = false;
    }

    const gA = L.pads[0], gB = L.pads[1];
    const al = updGhost();
    if (al && !aligned) { chime(1318.5, 0.06); ring(gA.x, gA.y, GOLD_RGB, 70, 0.5, 2); }
    aligned = al;
    misT = aligned ? 0 : misT + dt;
    ghostPh += dt * TAU * (0.8 + 3.2 * ghostNear); // pulses faster as it closes in
    const nA = dist(A, gA) < gA.r, nB = dist(B, gB) < gB.r;
    if (nA && !onA) { chime(784, 0.1); ring(gA.x, gA.y, PINK_RGB, 90, 0.6, 3); burst(A.x, A.y, PINK, 8, 80, 0.5); }
    if (nB && !onB) { chime(987.8, 0.1); ring(gB.x, gB.y, GOLD_RGB, 90, 0.6, 3); burst(B.x, B.y, GOLD, 8, 80, 0.5); }
    onA = nA; onB = nB;
    if (onA && onB) { holdT += dt; if (holdT >= 0.4) win(); }
    else holdT = Math.max(0, holdT - dt * 2);

    danger = 0;
    if (started && state === 'play') {
      for (const p of L.pads) {
        if (!p.alive) continue;
        const dc = Math.hypot(p.x - CX, p.y - CY) + p.r * 0.4;
        if (p.kind !== 'N') danger = Math.max(danger, clamp(1 - (R - dc) / 35, 0, 1));
        if (R < dc) {
          p.alive = false;
          ring(p.x, p.y, '200,220,255', 80, 0.6, 2);
          if (p.kind !== 'N') { fail(p); break; }
          tone(260, 0.18, 'sine', 0.07, 0, 0.5);
        }
      }
    }
  } else {
    pend.x = pend.y = 0;
    if (state === 'win' && stateT > 1.5) { level++; startLevel(); }
    else if (state === 'fail' && DEMO && stateT > 1.8) startLevel();
  }

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    const d = Math.exp(-3 * dt); p.vx *= d; p.vy *= d;
    if ((p.l -= dt) <= 0) parts.splice(i, 1);
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i]; r.r += r.vr * dt;
    if ((r.l -= dt) <= 0) rings.splice(i, 1);
  }
  for (const m of motes) { m.y -= m.v * dt; if (m.y < -5) { m.y = VH + 5; m.x = Math.random() * VW; } }
  shake *= Math.exp(-9 * dt); if (shake < 0.1) shake = 0;
  flashA = Math.max(0, flashA - dt * 2);
}

// ---------- drawing ----------
function drawPad(p) {
  if (p.sink >= 1 || p.pop <= 0) return;
  const s = easeOutBack(clamp(p.pop, 0, 1)) * (1 - p.sink * 0.6) * (1 + 0.15 * p.wob * Math.sin(t * 28));
  if (s <= 0.01) return;
  const occ = (p.kind === 'A' && onA) || (p.kind === 'B' && onB);
  ctx.save();
  ctx.translate(p.x, p.y + p.sink * 6); ctx.scale(s, s); ctx.globalAlpha = 1 - p.sink;
  const r = p.r, a0 = p.ang + Math.sin(t * 0.6 + p.ang) * 0.12;
  if (p.kind !== 'N') {
    const rgb = p.kind === 'A' ? PINK_RGB : GOLD_RGB;
    ctx.fillStyle = `rgba(${rgb},${occ ? 0.45 : 0.18 + 0.08 * Math.sin(t * 3)})`;
    ctx.beginPath(); ctx.arc(0, 0, r + 9 + 2 * Math.sin(t * 3), 0, TAU); ctx.fill();
  }
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, a0 + 0.32, a0 + TAU - 0.32); ctx.closePath();
  ctx.fillStyle = p.kind === 'N' ? '#2f9d78' : p.kind === 'A' ? '#9c3a72' : '#9a7424';
  ctx.fill();
  ctx.lineWidth = p.kind === 'N' ? 3 : 2.5;
  ctx.strokeStyle = p.wob > 0.3 ? '#ffffff' : p.kind === 'N' ? '#6fe3b5' : p.kind === 'A' ? PINK : GOLD;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1.2; ctx.beginPath();
  for (let i = 1; i < 5; i++) { const a = a0 + 0.32 + i * (TAU - 0.64) / 5; ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * r * 0.8, Math.sin(a) * r * 0.8); }
  ctx.stroke();
  if (p.kind !== 'N') { ctx.fillStyle = p.kind === 'A' ? PINK : GOLD; ctx.beginPath(); ctx.arc(0, 0, 4, 0, TAU); ctx.fill(); }
  if (p.sticky) { // silvery coil + dashed rim: this pad catches the twin (dim while re-arming)
    ctx.rotate(t * 0.7);
    ctx.strokeStyle = `rgba(223,232,255,${ST.dis === p ? 0.35 : 0.85})`; ctx.lineWidth = 2;
    ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(0, 0, r + 4, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    ctx.lineWidth = 1.8; ctx.beginPath();
    for (let i = 0; i <= 24; i++) {
      const a = i / 24 * TAU * 1.5, rr = 2 + i * 0.35;
      if (i) ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); else ctx.moveTo(rr, 0);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawFly(f, col, rgb, happy, phase) {
  const bob = Math.sin(t * 3 + phase) * 1.5, sad = state === 'fail';
  ctx.save();
  ctx.translate(f.x + f.kx, f.y + f.ky + bob);
  if (sad) ctx.globalAlpha = 0.6;
  const gr = 30 * (1 + 0.08 * Math.sin(t * 4 + phase)) * (happy ? 1.3 : 1);
  const gl = ctx.createRadialGradient(0, 0, 2, 0, 0, gr);
  gl.addColorStop(0, `rgba(${rgb},0.6)`); gl.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, gr, 0, TAU); ctx.fill();
  const sq = f === B ? B.sq * Math.sin(t * 40) * 0.22 : 0;
  ctx.scale(1 + sq, 1 - sq);
  const fl = Math.sin(t * (happy ? 32 : 7) + phase) * 0.4;
  ctx.fillStyle = 'rgba(235,245,255,0.75)';
  ctx.beginPath(); ctx.ellipse(-7, -9, 7, 4.5, -0.6 - fl, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(7, -9, 7, 4.5, 0.6 + fl, 0, TAU); ctx.fill();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 0, FR, 0, TAU); ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.stroke();
  ctx.strokeStyle = '#3a1838'; ctx.lineWidth = 1.7; ctx.lineCap = 'round';
  ctx.beginPath();
  if (happy) { ctx.arc(-4, 1.5, 2.6, Math.PI * 1.15, Math.PI * 1.85); ctx.moveTo(6.4, 0.5); ctx.arc(4, 1.5, 2.6, Math.PI * 1.15, Math.PI * 1.85); }
  else { ctx.arc(-4, -0.5, 2.4, 0.2 * Math.PI, 0.8 * Math.PI); ctx.moveTo(6.2, 0.4); ctx.arc(4, -0.5, 2.4, 0.2 * Math.PI, 0.8 * Math.PI); }
  ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 4, 1.6, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
  ctx.fillStyle = 'rgba(230,60,120,0.45)';
  ctx.beginPath(); ctx.arc(-7, 4, 2, 0, TAU); ctx.arc(7, 4, 2, 0, TAU); ctx.fill();
  ctx.restore();
}

function quadPt(ax, ay, cx, cy, bx, by, u) {
  const v = 1 - u;
  return [v * v * ax + 2 * v * u * cx + u * u * bx, v * v * ay + 2 * v * u * cy + u * u * by];
}

function text(s, x, y, size, col, alpha) {
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.font = `bold ${size}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(5,8,25,0.65)'; ctx.lineJoin = 'round';
  ctx.strokeText(s, x, y);
  ctx.fillStyle = col; ctx.fillText(s, x, y);
  ctx.globalAlpha = 1;
}

function dashLine(x1, y1, x2, y2, col) {
  ctx.setLineDash([6, 7]); ctx.lineDashOffset = -t * 20;
  ctx.strokeStyle = col; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.setLineDash([]); ctx.lineDashOffset = 0;
}

// short arrow from pink toward the gold ring once the twins stay misaligned for over a second
function drawNudge() {
  const a = state === 'play' ? clamp((misT - 1) / 0.35, 0, 1) : 0;
  if (a <= 0) return;
  const dx = ghost.x - A.x, dy = ghost.y - A.y, d = Math.hypot(dx, dy);
  if (d < 30) return;
  const ux = dx / d, uy = dy / d, wave = Math.sin(t * 7);
  const s0 = 20 + 4 * (0.5 + 0.5 * wave), len = Math.min(28, d - 24);
  const x0 = A.x + ux * s0, y0 = A.y + uy * s0, x1 = A.x + ux * (s0 + len), y1 = A.y + uy * (s0 + len);
  const hx = x1 - ux * 9, hy = y1 - uy * 9;
  ctx.save();
  ctx.globalAlpha = a * (0.8 + 0.2 * wave);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [c, w] of [['rgba(5,8,25,0.6)', 7.5], ['#fff6d8', 3.5]]) {
    ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath();
    ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
    ctx.moveTo(hx - uy * 8, hy + ux * 8); ctx.lineTo(x1, y1); ctx.lineTo(hx + uy * 8, hy - ux * 8);
    ctx.stroke();
  }
  ctx.restore();
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.75);
  bg.addColorStop(0, '#16224d'); bg.addColorStop(1, '#060918');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  const sx = shake ? (Math.random() - 0.5) * shake * 2 : 0, sy = shake ? (Math.random() - 0.5) * shake * 2 : 0;
  ctx.setTransform(DPR * SC, 0, 0, DPR * SC, DPR * (OX + sx * SC), DPR * (OY + sy * SC));

  for (const m of motes) {
    ctx.globalAlpha = 0.25 + 0.25 * Math.sin(t * 2 + m.ph);
    ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.arc(m.x, m.y, m.s, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // pond
  const R = border;
  ctx.setLineDash([4, 8]); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(200,220,255,0.15)';
  ctx.beginPath(); ctx.arc(CX, CY, L.R0 + 6, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(120,170,255,0.07)'; ctx.beginPath(); ctx.arc(CX, CY, R + 14, 0, TAU); ctx.fill();
  const pg = ctx.createRadialGradient(CX, CY - 40, 10, CX, CY, Math.max(R, 20));
  pg.addColorStop(0, '#1f5486'); pg.addColorStop(1, '#0f2a52');
  ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(CX, CY, Math.max(R, 1), 0, TAU); ctx.fill();
  for (let k = 0; k < 3; k++) {
    const rr = (t * 16 + k * R / 3) % R;
    ctx.strokeStyle = `rgba(200,225,255,${0.1 * (1 - rr / R)})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(CX, CY, rr, 0, TAU); ctx.stroke();
  }
  // mirror line: pink side | gold side
  const mh = Math.max(0, R - 6);
  ctx.setLineDash([3, 9]); ctx.strokeStyle = 'rgba(223,232,255,0.28)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(CX, CY - mh); ctx.lineTo(CX, CY + mh); ctx.stroke(); ctx.setLineDash([]);
  const rc = [200 + 55 * danger, 225 - 105 * danger, 255 - 95 * danger].map(Math.round).join(',');
  const pulse = danger > 0 ? 0.5 + 0.5 * Math.sin(t * 6) : 0.5;
  ctx.strokeStyle = `rgba(${rc},${0.12 + 0.15 * pulse})`; ctx.lineWidth = 12;
  ctx.beginPath(); ctx.arc(CX, CY, R, 0, TAU); ctx.stroke();
  ctx.strokeStyle = `rgba(${rc},0.95)`; ctx.lineWidth = 3.5; ctx.stroke();

  for (const p of L.pads) drawPad(p);

  // soft wrap of tether around the sticky pad holding gold, with a hold timer
  if (ST.wp && ST.wrap > 0.01) {
    const p = ST.wp, w = ST.wrap, rr = p.r + 5;
    ctx.save(); ctx.translate(p.x, p.y);
    ctx.strokeStyle = `rgba(223,232,255,${0.75 * w})`; ctx.lineWidth = 2;
    for (let k = 0; k < 3; k++) {
      ctx.beginPath(); ctx.ellipse(0, 0, rr * (0.7 + 0.3 * w), rr * 0.42 * w + 1, k * Math.PI / 3 + t * 0.9, 0, TAU); ctx.stroke();
    }
    if (ST.p === p) {
      ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, 0, p.r + 12, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(ST.left / STICK_T, 0, 1)); ctx.stroke();
    }
    ctx.restore();
  }

  // gold ring: where pink must land so the twin sits on gold
  if (state === 'play' && L.pads[1].alive && L.pads[1].pop > 0.5) {
    // closer to the pink pad = faster, bigger pulse and a shift from dim gold to bright white
    const g = L.pads[1], k = aligned ? 1 : 0, c = aligned ? 1 : ghostNear;
    const pl = 0.5 + 0.5 * Math.sin(ghostPh), rr = g.r + (1 + 4 * c) * pl;
    const col = [185 + 70 * c, 145 + 110 * c, 55 + 200 * c].map(Math.round).join(',');
    ctx.fillStyle = `rgba(${col},${0.08 + 0.14 * c * pl + 0.15 * k})`;
    ctx.beginPath(); ctx.arc(ghost.x, ghost.y, rr, 0, TAU); ctx.fill();
    ctx.setLineDash([5, 5]); ctx.lineDashOffset = -t * 12;
    ctx.strokeStyle = `rgba(${col},${0.45 + 0.5 * c})`; ctx.lineWidth = 2 + 1.5 * c + k;
    ctx.stroke(); ctx.setLineDash([]); ctx.lineDashOffset = 0;
    if (c > 0.3) { // soft echo ring breathing outward
      ctx.strokeStyle = `rgba(${col},${(c - 0.3) * 0.6 * (1 - pl)})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ghost.x, ghost.y, rr + 4 + 8 * pl, 0, TAU); ctx.stroke();
    }
  }

  // level 1 guide arrows before the first move
  if (level === 1 && !started && state === 'play') {
    const gA = L.pads[0], gB = L.pads[1], a = 0.45 + 0.35 * Math.sin(t * 4);
    dashLine(A.x, A.y, gA.x, gA.y, `rgba(${PINK_RGB},${a})`);
    dashLine(B.x, B.y, gB.x, gB.y, `rgba(${GOLD_RGB},${a})`);
  }

  // silvery tether between the twins
  const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, dx = B.x - A.x, dy = B.y - A.y, dl = Math.hypot(dx, dy) || 1;
  const sway = Math.sin(t * 1.8) * 8;
  let qx = (mx + CX) / 2 - dy / dl * sway, qy = (my + CY) / 2 + dx / dl * sway;
  if (ST.wp) { qx += (ST.wp.x - qx) * ST.wrap; qy += (ST.wp.y - qy) * ST.wrap; } // tether hugs the sticky pad
  const tglow = state === 'win' ? 1 : holdT * 2.5;
  ctx.strokeStyle = `rgba(223,232,255,${0.45 + 0.5 * tglow})`; ctx.lineWidth = 1.6 + 1.5 * tglow;
  ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.quadraticCurveTo(qx, qy, B.x + B.kx, B.y + B.ky); ctx.stroke();
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < 4; i++) {
    const u = (t * 0.35 + i / 4) % 1, pt = quadPt(A.x, A.y, qx, qy, B.x, B.y, u);
    ctx.globalAlpha = Math.sin(u * Math.PI) * 0.8;
    ctx.beginPath(); ctx.arc(pt[0], pt[1], 1.8, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // drag rings: you hold pink, gold is linked
  if ((dragging || ai.drag) && state === 'play') {
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.arc(A.x, A.y, 20 + 2 * Math.sin(t * 8), 0, TAU); ctx.stroke();
    if (!ST.p) { // gold is linked unless a sticky pad holds it
      ctx.strokeStyle = `rgba(${GOLD_RGB},0.4)`;
      ctx.beginPath(); ctx.arc(B.x, B.y, 20 + 2 * Math.sin(t * 8), 0, TAU); ctx.stroke();
    }
  }
  drawFly(B, GOLD, GOLD_RGB, onB || state === 'win', 1.5);
  drawFly(A, PINK, PINK_RGB, onA || state === 'win', 0);
  drawNudge();

  if (holdT > 0 && state === 'play') {
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
    for (const f of [A, B]) { ctx.beginPath(); ctx.arc(f.x, f.y, 18, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(holdT / 0.4, 0, 1)); ctx.stroke(); }
  }

  for (const r of rings) {
    ctx.strokeStyle = `rgba(${r.c},${r.l / r.m})`; ctx.lineWidth = r.w;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
  }
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.l / p.m, 0, 1); ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // HUD
  text('Level ' + level, CX, 56, 28, '#ffffff');
  if (!DEMO && best > 1) text('Best ' + best, CX, 88, 16, 'rgba(223,232,255,0.7)');
  if (!DEMO) { // restart button
    ctx.fillStyle = 'rgba(223,232,255,0.12)'; ctx.beginPath(); ctx.arc(RBX, RBY, 20, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(223,232,255,0.85)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(RBX, RBY, 9, -0.3, Math.PI * 1.5); ctx.stroke();
    ctx.fillStyle = 'rgba(223,232,255,0.85)'; ctx.beginPath();
    ctx.moveTo(RBX + 1, RBY - 14); ctx.lineTo(RBX + 7, RBY - 9); ctx.lineTo(RBX + 1, RBY - 4); ctx.closePath(); ctx.fill();
  }
  if (state === 'win') {
    const s = easeOutBack(clamp(stateT / 0.4, 0, 1));
    ctx.save(); ctx.translate(CX, 140); ctx.scale(s, s); text('Lovely!', 0, 0, 44, '#fff6d8'); ctx.restore();
  } else if (state === 'fail') {
    const s = easeOutCubic(clamp(stateT / 0.35, 0, 1));
    text('The pond closed in', CX, 140, 28, '#ffd0e0', s);
    if (!DEMO) text('Tap to retry', CX, 572, 24, '#ffffff', s * (0.65 + 0.35 * Math.sin(t * 5)));
  } else if (hintA > 0 && HINTS[level]) {
    text(HINTS[level][0], CX, 560, 20, '#ffffff', hintA);
    text(HINTS[level][1], CX, 590, 20, '#ffffff', hintA);
  }

  if (flashA > 0) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = `rgba(${flashRGB},${flashA})`; ctx.fillRect(0, 0, W, H);
  }
}

// ---------- input (Pointer Events, relative drag anywhere) ----------
let dragging = false, dragId = -1, lastX = 0, lastY = 0;
const toLogical = e => [(e.clientX - OX) / SC, (e.clientY - OY) / SC];
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (DEMO) return;
  initAudio();
  const [x, y] = toLogical(e);
  if (Math.hypot(x - RBX, y - RBY) < 30) { tone(440, 0.15, 'sine', 0.06, 0, 0.7); startLevel(); return; }
  if (state === 'fail') { if (stateT > 0.3) startLevel(); return; }
  dragging = true; dragId = e.pointerId;
  lastX = x; lastY = y;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
}, { passive: false });
cv.addEventListener('pointermove', e => {
  e.preventDefault();
  if (!dragging || e.pointerId !== dragId) return;
  const [x, y] = toLogical(e);
  if (state === 'play') { pend.x += x - lastX; pend.y += y - lastY; }
  lastX = x; lastY = y;
}, { passive: false });
const endDrag = e => { if (e.pointerId === dragId) { dragging = false; dragId = -1; } };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

// ---------- main loop with error guard ----------
let lastT = performance.now(), errShown = false;
function frame(now) {
  try {
    const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
    lastT = now;
    update(dt);
    draw();
  } catch (e) {
    if (!errShown) { errShown = true; errEl.style.display = 'block'; errEl.textContent = 'Oops: ' + (e && e.message ? e.message : e); }
  }
  requestAnimationFrame(frame);
}
startLevel();
requestAnimationFrame(frame);
})();
</script>
