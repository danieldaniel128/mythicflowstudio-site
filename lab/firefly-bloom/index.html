<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Firefly Bloom Idle</title>
<style>
html,body{margin:0;height:100%;background:#050a18;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;touch-action:none}
#err{position:fixed;left:8px;right:8px;bottom:8px;padding:8px 10px;background:rgba(160,20,50,.92);color:#fff;font:bold 14px/1.3 sans-serif;border-radius:8px;display:none;z-index:9;white-space:pre-wrap}
</style>

<body>
<canvas id="c"></canvas>
<div id="err"></div>
<script>
(function(){
'use strict';
const W=360,H=640;
const DEMO=/[?&]demo=1(&|$)/.test(location.search);
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const errEl=document.getElementById('err');
function showErr(e){errEl.style.display='block';errEl.textContent='Oops: '+((e&&e.message)||e);}
window.addEventListener('error',e=>showErr(e.message||e));

// ---------- layout ----------
const BX0=16,BX1=344,BY0=102,BY1=460;        // garden bed
const BAR_Y=482;                              // seed / breeze timers
const TAB_Y=494,TAB_H=26,TX=[12,182],TW=166;  // UPGRADES / CRITTERS tabs
const UY=526,UH=98,UW=108,UX=[12,126,240];   // shop buttons
const RX=334,RY=30,HX=334,HY=76;              // restart + help buttons
const THRESH=16,SAVE_KEY='ffbloom_idle_v4',OLD_KEY='ffbloom_idle_v3',TUT_KEY='ffbloom_tut_v1',AWAY_CAP=8*3600,AWAY_RATE=0.5;
const CHAIN_WIN=7,CHAIN_STEP=0.35,CHAIN_EXT=0.8; // burst chain: window (s), mult per bloom, time added by a hand merge
const REGEN=4,BOOST_MAX=5,BOOST_R=1.5,BOOST_T=1.25; // caught fireflies return after REGEN s; tapping boosts glow x1.5, timers x1.25
const CRX=288,CRY=40;                         // chain readout, right of the glow counter
const HELP_BY=432;                            // "replay tutorial" button in the help card
const C={gold:'#ffd75e',petal:'#ff8fb8',leaf:'#3fbf74',white:'#f4f7ff'};
const PX0=BX0-8,PY0=BY0-8,PW=BX1-BX0+16,PH=BY1-BY0+16;

// ---------- quality: steps down automatically when frames run long ----------
let Q=2,perfEma=1/60,perfBad=0,upT=0;
const DPR_CAP=[1,1.5,2],PART_CAP=[110,200,320],FX=[0.4,0.7,1],AMB_CAP=[16,30,48],BUG_CAP=[24,40,64],RING_CAP=[14,24,36],TEXT_CAP=[10,16,24];
const fxN=n=>Math.max(1,Math.round(n*FX[Q]));

// ---------- helpers ----------
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const frac=v=>v-Math.floor(v);
const hash=i=>frac(Math.sin(i*127.1+311.7)*43758.5453);
const easeIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOutBack=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
function rr(x,y,w,h,r,c){c=c||ctx;r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2);}
const UNITS=['K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n,dec){
  n=Math.max(0,n||0);
  if(n<1000)return dec&&n<100?String(Math.floor(n*10)/10):String(Math.floor(n));
  let i=-1;while(n>=1000&&i<UNITS.length-1){n/=1000;i++;}
  return (n<10?(Math.floor(n*100)/100).toFixed(2):n<100?(Math.floor(n*10)/10).toFixed(1):String(Math.floor(n)))+UNITS[i];
}

// ---------- pre-rendered sprites (one drawImage instead of gradients/paths/text every frame) ----------
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}
function makeGlow(r,g,b,size){
  const c=mk(size,size),x=c.getContext('2d'),s=size/2;
  const gr=x.createRadialGradient(s,s,0,s,s,s);
  gr.addColorStop(0,`rgba(${r},${g},${b},1)`);gr.addColorStop(0.2,`rgba(${r},${g},${b},0.6)`);
  gr.addColorStop(0.5,`rgba(${r},${g},${b},0.15)`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);
  x.fillStyle=gr;x.fillRect(0,0,size,size);return c;
}
const GLOW=makeGlow(255,215,94,64),PGLOW=makeGlow(255,143,184,64),MGLOW=makeGlow(190,210,255,64);
const RIM=[0,1,2,3,4].map(l=>{const t=l/4;return `rgb(${Math.round(lerp(63,255,t))},${Math.round(lerp(191,215,t))},${Math.round(lerp(116,94,t))})`;});
const podR=v=>19+4.5*Math.log2(v);
const prod=v=>0.4*Math.pow(v,1.25);          // glow/s per pod: merging always raises output
const FFS=(()=>{const c=mk(48,48),x=c.getContext('2d');x.drawImage(GLOW,0,0,48,48);x.fillStyle='#fffbe0';x.beginPath();x.arc(24,24,4.4,0,Math.PI*2);x.fill();return c;})();
const PET=(()=>{const c=mk(32,16),x=c.getContext('2d');x.fillStyle=C.petal;x.beginPath();x.ellipse(16,8,15.5,7.5,0,0,Math.PI*2);x.fill();return c;})();
const VIG=(()=>{const c=mk(180,320),x=c.getContext('2d'),g=x.createRadialGradient(90,150,55,90,150,215);
  g.addColorStop(0,'rgba(255,143,184,0.04)');g.addColorStop(1,'rgba(255,143,184,0.42)');x.fillStyle=g;x.fillRect(0,0,180,320);return c;})();
function flowerSprite(col){
  const S=128,c=mk(S,S),x=c.getContext('2d'),u=S/4.4;x.translate(S/2,S/2);
  x.globalAlpha=0.5;x.drawImage(col===C.gold?GLOW:PGLOW,-S/2,-S/2,S,S);x.globalAlpha=1;x.fillStyle=col;
  for(let i=0;i<5;i++){const a=i*1.2566;x.beginPath();x.ellipse(Math.cos(a)*u*0.55,Math.sin(a)*u*0.55,u*0.55,u*0.3,a,0,Math.PI*2);x.fill();}
  x.fillStyle=col===C.gold?'#fff4c0':C.gold;x.beginPath();x.arc(0,0,u*0.28,0,Math.PI*2);x.fill();return c;
}
const FLW=[flowerSprite(C.petal),flowerSprite(C.gold)];

let dpr=1,scale=1,ox=0,oy=0,K=1,PODS=[],BG=null,BED=null,bgKey=-1,bedKey=-1;
function buildSprites(){                          // pod bodies + numbers, at the current pixel density
  K=Math.min(4,Math.max(1,dpr*scale));PODS=[];
  for(let l=0;l<=4;l++){
    const v=1<<l,r=podR(v),E=r+3,S=Math.ceil(E*2*K*1.2),f=S/(E*2);
    const body=mk(S,S),b=body.getContext('2d');b.setTransform(f,0,0,f,S/2,S/2);
    const g=b.createRadialGradient(-r*.35,-r*.4,r*.1,0,0,r);g.addColorStop(0,'#2f8a57');g.addColorStop(1,'#123b2a');
    b.fillStyle=g;b.beginPath();b.arc(0,0,r,0,Math.PI*2);b.fill();
    b.strokeStyle='rgba(130,235,170,0.28)';b.lineWidth=1.5;b.beginPath();b.moveTo(-r*.15,-r*.88);b.quadraticCurveTo(r*.3,0,-r*.1,r*.88);b.stroke();
    b.lineWidth=3;b.strokeStyle=RIM[l];b.beginPath();b.arc(0,0,r,0,Math.PI*2);b.stroke();
    const num=mk(S,S),n=num.getContext('2d');n.setTransform(f,0,0,f,S/2,S/2);
    n.font='bold '+Math.round(r*0.75)+'px sans-serif';n.textAlign='center';n.textBaseline='middle';n.lineJoin='round';
    n.lineWidth=4;n.strokeStyle='rgba(5,15,12,0.85)';n.strokeText(v,0,1);n.fillStyle='#fff';n.fillText(v,0,1);
    PODS.push({body,num,E,r});
  }
}
function buildBg(grow){                           // sky gradient + aura, rebuilt only when the garden grows a step
  if(!BG)BG=document.createElement('canvas');
  BG.width=cv.width;BG.height=cv.height;const x=BG.getContext('2d');
  const g=x.createLinearGradient(0,0,0,BG.height);g.addColorStop(0,'#0e1d44');g.addColorStop(1,'#03070f');
  x.fillStyle=g;x.fillRect(0,0,BG.width,BG.height);
  x.setTransform(dpr*scale,0,0,dpr*scale,dpr*ox,dpr*oy);x.globalAlpha=0.06+grow*0.2;x.drawImage(GLOW,-80,40,520,520);
}

// ---------- decor ----------
const STARS=[];for(let i=0;i<90;i++)STARS.push({x:Math.random()*W,y:Math.random()*H*0.95,s:rnd(.8,2),p:rnd(0,6.28)});
const GRASS=[];for(let i=0;i<34;i++)GRASS.push({x:BX0-4+i*(BX1-BX0+8)/33,h:rnd(10,26),p:rnd(0,6.28)});
const AMB=[];for(let i=0;i<48;i++)AMB.push({x:rnd(10,350),y:rnd(20,620),a:rnd(0,6.28),b:rnd(0,6.28),s1:rnd(.2,.6),s2:rnd(.2,.6),f:rnd(0,6.28)});
// the bed rim: leaves grow along it with upgrades, flowers with every bloom
function perim(t){
  let d=frac(t)*2*(PW+PH);
  if(d<PW)return {x:PX0+d,y:PY0,a:-Math.PI/2};d-=PW;
  if(d<PH)return {x:PX0+PW,y:PY0+d,a:0};d-=PH;
  if(d<PW)return {x:PX0+PW-d,y:PY0+PH,a:Math.PI/2};d-=PW;
  return {x:PX0,y:PY0+PH-d,a:Math.PI};
}
function perimU(t){                              // left, top and right sides only
  let d=frac(t)*(PW+2*PH);
  if(d<PH)return {x:PX0,y:PY0+PH-d,a:Math.PI};d-=PH;
  if(d<PW)return {x:PX0+d,y:PY0,a:-Math.PI/2};d-=PW;
  return {x:PX0+PW,y:PY0+d,a:0};
}
const LEAVES=[];for(let i=0;i<120;i++){const p=perim(i*0.381966+0.02);LEAVES.push({x:p.x,y:p.y,a:p.a+(hash(i+3)-0.5)*1.6,l:5+hash(i+7)*4});}
const FLOWERS=[];for(let i=0;i<48;i++){const p=perimU(i*0.618034+0.07);FLOWERS.push({x:p.x+Math.cos(p.a)*hash(i+5)*4,y:p.y+Math.sin(p.a)*hash(i+5)*4,s:7+hash(i+11)*5,g:i%3===2?1:0,ph:hash(i+99)*6.28});}
function buildBed(nl){                            // bed panel + leafy rim baked into one image
  const m=16,w=PW+m*2,h=PH+m*2,kb=Math.min(K,2.5);
  if(!BED)BED=document.createElement('canvas');
  BED.width=Math.ceil(w*kb);BED.height=Math.ceil(h*kb);
  const x=BED.getContext('2d');x.setTransform(BED.width/w,0,0,BED.height/h,(m-PX0)*BED.width/w,(m-PY0)*BED.height/h);
  rr(PX0,PY0,PW,PH,22,x);x.fillStyle='rgba(10,30,32,0.82)';x.fill();x.strokeStyle='rgba(63,191,116,0.4)';x.lineWidth=2;x.stroke();
  x.fillStyle='#2f9a5c';x.beginPath();
  for(let i=0;i<nl;i++){const L=LEAVES[i],a=L.a,cx=L.x+Math.cos(a)*L.l*0.7,cy=L.y+Math.sin(a)*L.l*0.7;x.moveTo(cx+Math.cos(a)*L.l,cy+Math.sin(a)*L.l);x.ellipse(cx,cy,L.l,L.l*0.42,a,0,Math.PI*2);}
  x.fill();
}

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,DPR_CAP[Q]);
  const vw=window.innerWidth,vh=window.innerHeight;
  cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);
  cv.style.width=vw+'px';cv.style.height=vh+'px';
  scale=Math.min(vw/W,vh/H);ox=(vw-W*scale)/2;oy=(vh-H*scale)/2;
  buildSprites();bgKey=bedKey=-1;
}
window.addEventListener('resize',resize);resize();

// ---------- audio (only after a user gesture, never in demo) ----------
let AC=null,MG=null,NB=null;
function initAudio(){
  if(DEMO)return;
  try{
    if(!AC){
      const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
      AC=new A();MG=AC.createGain();MG.gain.value=0.55;MG.connect(AC.destination);
      NB=AC.createBuffer(1,Math.floor(AC.sampleRate*0.6),AC.sampleRate);
      const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }
    if(AC.state==='suspended')AC.resume();
  }catch(e){AC=null;}
}
function tone(f,dur,type,vol,slide,delay){
  if(!AC)return;
  try{
    const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(slide&&slide!==1)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(MG);o.start(t);o.stop(t+dur+0.03);
  }catch(e){}
}
function noise(dur,vol,freq){
  if(!AC)return;
  try{
    const t=AC.currentTime,s=AC.createBufferSource(),bp=AC.createBiquadFilter(),g=AC.createGain();
    s.buffer=NB;bp.type='bandpass';bp.frequency.setValueAtTime(freq,t);bp.frequency.exponentialRampToValueAtTime(freq*3,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(bp);bp.connect(g);g.connect(MG);s.start(t);s.stop(t+dur);
  }catch(e){}
}
const PENTA=[0,2,4,7,9,12,14,16,19,21,24];
const semi=(b,s)=>b*Math.pow(2,s/12);
const lastS={};
function thr(k,g){if(lastS[k]!=null&&clock-lastS[k]<g)return false;lastS[k]=clock;return true;}
const sPick=()=>tone(600,0.07,'sine',0.1,1.3);
const sDrop=()=>tone(240,0.09,'sine',0.1,0.8);
const sPlant=()=>{if(thr('p',0.3))tone(200,0.1,'sine',0.04,1.8);};
const sDeny=()=>tone(130,0.15,'square',0.05,0.9);
const sCharge=()=>tone(300,0.45,'sine',0.12,3);
const sTap=c=>tone(semi(523,PENTA[c%PENTA.length]),0.09,'sine',0.1,1.2);
function sBuy(l){[0,4,7,12].forEach((s,i)=>tone(semi(392,s+Math.min(12,l)),0.18,'triangle',0.11,1,i*0.05));}
function sMerge(v){const f=semi(392,PENTA[Math.min(10,Math.log2(v)*2-1)]);tone(f,0.2,'triangle',0.15);tone(f*2,0.14,'sine',0.05,1,0.03);}
function sBurst(n){                              // each bloom in a chain climbs higher, with a rising sweep
  const up=Math.min(12,(n-1)*2);noise(0.5,0.35,700);
  [0,4,7,12].forEach((s,i)=>tone(semi(523,s+up),0.5,'triangle',0.11,1,i*0.05));
  if(n>1)tone(semi(262,up),0.8,'sawtooth',0.045,4);
}
function sChainMerge(v,n){const f=semi(392,PENTA[Math.min(10,Math.log2(v)*2-1)]+Math.min(12,n*2));tone(f,0.24,'triangle',0.14,1.5);tone(f*1.5,0.2,'sine',0.06,1.5,0.05);}
const sTick=k=>tone(semi(880,k),0.05,'square',0.03,1);
function sChainEnd(){[12,7,4,0].forEach((s,i)=>tone(semi(392,s),0.2,'sine',0.07,0.9,i*0.06));}
function sWelcome(){[0,4,7,12,16,19].forEach((s,i)=>tone(semi(523,s),0.35,'triangle',0.12,1,i*0.09));}
function sStep(){[0,7,12].forEach((s,i)=>tone(semi(659,s),0.16,'triangle',0.09,1,i*0.07));}
const sCroak=()=>{tone(170,0.12,'square',0.05,0.6);tone(130,0.16,'square',0.04,0.7,0.12);};
const sLick=()=>{if(thr('l',0.1))tone(900,0.07,'sine',0.05,0.5);};
const sGulp=n=>{if(thr('g',0.1))tone(semi(262,PENTA[Math.min(10,n)]),0.1,'triangle',0.08,0.7);};
function sFrogPop(){noise(0.7,0.45,400);tone(110,0.7,'sawtooth',0.06,4);[0,4,7,12,16,19,24].forEach((s,i)=>tone(semi(392,s),0.3,'triangle',0.1,1,i*0.05));}
function sMoth(){[0,7,12,19,24].forEach((s,i)=>tone(semi(784,s),0.22,'sine',0.08,1.1,i*0.05));}
function sStar(){[0,5,9,12,17,21].forEach((s,i)=>tone(semi(659,s),0.3,'triangle',0.09,1,i*0.06));}

// ---------- economy (slower curve: costs outpace multipliers, blooms and chains pay less) ----------
const ffMult=l=>Math.pow(1.35,l);
// seeds and breeze: many more levels, each a smaller step, bottoming out far faster than before
const seedI=l=>0.25+3.95*Math.pow(0.9,l);
const mergeI=l=>0.3+6.7*Math.pow(0.88,l);
const RARE_LV=6,RARE8_LV=10;                  // SEEDS tier 2: plant the rarest value (up to 4, then up to 8)
const seedTop=l=>l>=RARE8_LV?8:4;
const UPS=[
  {name:'FIREFLIES',base:15,g:1.85,max:200,col:C.gold,desc:l=>'x'+fmt(ffMult(l),1)+' glow'},
  {name:'SEEDS',base:30,g:1.45,max:40,col:C.leaf,desc:l=>(l>=RARE_LV?'rare ':'seed ')+seedI(l).toFixed(2)+'s'},
  {name:'BREEZE',base:45,g:1.5,max:40,col:C.white,desc:l=>'tidy '+mergeI(l).toFixed(2)+'s'},
];
const DEMO_BOOST=DEMO?3:1;
// critters: unlocked and levelled with glow; each one only pays if you tap it in time
const FROG_NEED=DEMO?6:12,FROG_FULL=8;
const frogI=l=>Math.max(12,45*Math.pow(0.95,l-1));       // seconds between frog visits
const frogEat=l=>DEMO?0.25:Math.max(0.3,0.9*Math.pow(0.96,l-1));
const frogSec=l=>20+5*(l-1);                              // a pop pays this many seconds of income
const mothI=l=>Math.max(18,60*Math.pow(0.96,l-1));
const frenzyM=l=>3+0.25*(l-1),frenzyD=l=>10+0.5*(l-1);
const starI=l=>Math.max(20,75*Math.pow(0.96,l-1));
const starSec=l=>15+4*(l-1);
const CRIT=[
  {name:'GOLD FROG',unlock:800,base:2500,g:1.55,max:30,col:C.gold,lock:'eats fireflies',desc:l=>'pop: '+frogSec(l)+'s glow'},
  {name:'LUNA MOTH',unlock:20000,base:40000,g:1.6,max:30,col:C.petal,lock:'tap: frenzy',desc:l=>'x'+frenzyM(l).toFixed(2)+' '+Math.round(frenzyD(l))+'s'},
  {name:'WISH STAR',unlock:300000,base:600000,g:1.65,max:30,col:C.white,lock:'tap: twin 8s',desc:l=>'wish: '+starSec(l)+'s glow'},
];

// ---------- state ----------
let st=null,pods=[],parts=[],rings=[],texts=[],seeds=[],merges=[],bugs=[],drag=null,press=null,pid=0,clock=0,pointerId=null,hudX=150;
const ai={phase:0,t:0,wait:0.5,px:180,py:420,sx:180,sy:420,act:null,lastBuy:0,tap:0,first:true};

const cost=i=>Math.ceil(UPS[i].base*Math.pow(UPS[i].g,st.lv[i]));
const critCost=i=>{const u=CRIT[i],l=st.cr[i];return l?Math.ceil(u.base*Math.pow(u.g,l-1)):u.unlock;};
const lvlSum=()=>st.lv[0]+st.lv[1]+st.lv[2]+st.cr[0]+st.cr[1]+st.cr[2];
const bloomMult=()=>1+0.2*Math.sqrt(st.blooms);   // diminishing: early blooms matter, late ones don't run away
const cap=()=>10+Math.min(8,Math.floor(st.blooms/3));
const frenzyNow=()=>st.frenzy>0?st.frenzyM:1;
const mults=()=>ffMult(st.lv[0])*bloomMult()*DEMO_BOOST*frenzyNow();
const chainMult=()=>1+CHAIN_STEP*st.chain;       // applies to merges and blooms while a chain runs
function baseRate(){let s=0;for(const p of pods)if(!p.dead)s+=prod(p.v);return s*mults();}
const rate=()=>baseRate()*(st.boost>0?BOOST_R:1);
function addGlow(g){st.glow+=g;st.total+=g;}

// every pod visibly holds exactly v fireflies; tapping catches one, which flies to the counter and later returns
function setFF(p){const n=Math.min(p.v,THRESH);if(p.ff.length>n)p.ff.length=n;while(p.ff.length<n)p.ff.push({a:rnd(0,6.28),b:rnd(0,6.28),s1:rnd(.6,1.6),s2:rnd(.6,1.6),f:rnd(0,6.28),cd:0,back:0});}
function ffPos(p,f,r){return {x:p.x+Math.sin(clock*f.s1+f.a)*r*.6,y:p.y+Math.cos(clock*f.s2+f.b)*r*.6};}
const ready=p=>{let n=0;for(const f of p.ff)if(f.cd<=0)n++;return n;};
const catchV=p=>Math.max(1,prod(p.v)/Math.min(p.v,THRESH)*2.5*mults());   // tap income stays proportional to passive income
function makePod(v,x,y){const p={v,x,y,vx:0,vy:0,r:podR(v),dr:podR(v),born:0,pop:0,id:++pid,busy:false,dead:false,burstT:-1,ff:[]};setFF(p);pods.push(p);return p;}
const livePods=()=>pods.reduce((n,p)=>n+(p.dead?0:1),0);
function freeSpot(r,near){                       // open ground; with `near`, prefer a spot beside that pod
  let bestS=null,bs=-1e9;
  for(let i=0;i<24;i++){
    const x=rnd(BX0+r,BX1-r),y=rnd(BY0+r,BY1-r);let md=1e9;
    for(const p of pods){if(p.dead)continue;const d=Math.hypot(p.x-x,p.y-y)-p.r;if(d<md)md=d;}
    const s=near?Math.min(md,r+14)-0.35*Math.hypot(near.x-x,near.y-y):md;
    if(s>bs){bs=s;bestS={x,y};}
  }
  return bestS;
}

function blankState(){
  return {glow:0,total:0,blooms:0,lv:[0,0,0],spawnT:0,mergeT:0,boost:0,shake:0,flash:0,pulse:0,combo:0,comboT:0,
          resetArm:0,welcome:null,saveT:0,bugAcc:0,btnP:[0,0,0],btnS:[0,0,0],flowerT:1,
          chain:0,chainT:0,chainG:0,chainPop:0,chainEnd:0,chainLast:1,tint:0,
          tut:-1,tutT:0,tf:{},tp:null,tpod:null,help:false,banner:null,
          cr:[0,0,0],tab:0,frog:null,moth:null,star:null,frogT:4,mothT:8,starT:8,frenzy:0,frenzyM:1,frenzyD:1};
}
function save(){
  if(DEMO||!st)return;
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({g:st.glow,tot:st.total,b:st.blooms,lv:st.lv,c:st.cr,
    p:pods.filter(p=>!p.dead).map(p=>[p.v,Math.round(p.x),Math.round(p.y)]),t:Date.now()}));}catch(e){}
}
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');return d&&Array.isArray(d.p)?d:null;}catch(e){return null;}}
function tutSeen(){try{return !!(localStorage.getItem(TUT_KEY)||localStorage.getItem(OLD_KEY));}catch(e){return false;}}
function tutSave(){try{localStorage.setItem(TUT_KEY,'1');}catch(e){}}

function newGame(fresh){
  pods=[];parts=[];rings=[];texts=[];seeds=[];merges=[];bugs=[];drag=null;press=null;
  st=blankState();
  if(DEMO){
    st.lv=[3,RARE_LV,4];st.blooms=6;st.glow=40;st.total=400;
    st.cr=[5,0,0];st.frogT=1.2;                   // the golden frog hops in, eats her fill, and the AI pops her
    // four 8s: the AI drags them together for two blooms that start a chain, then the 4s and 2s feed it higher
    const L=[[8,110,290],[8,200,290],[8,280,400],[8,80,400],[4,90,180],[4,260,180],[4,180,390],[2,55,320],[2,300,300],[2,175,440],[1,180,160],[1,310,250],[1,40,240]];
    for(const a of L)makePod(a[0],a[1],a[2]).born=1;
  }else{
    const d=fresh?null:load();
    if(d){
      st.glow=Math.max(0,+d.g||0);st.total=Math.max(st.glow,+d.tot||0);st.blooms=Math.max(0,d.b|0);
      if(Array.isArray(d.lv))for(let i=0;i<3;i++)st.lv[i]=clamp(d.lv[i]|0,0,UPS[i].max);
      if(Array.isArray(d.c))for(let i=0;i<3;i++)st.cr[i]=clamp(d.c[i]|0,0,CRIT[i].max);
      for(const a of d.p.slice(0,40)){
        if(!Array.isArray(a))continue;
        const v=Math.pow(2,clamp(Math.round(Math.log2(+a[0]||1)),0,4));
        const p=makePod(v,clamp(+a[1]||180,BX0+20,BX1-20),clamp(+a[2]||300,BY0+20,BY1-20));p.born=1;
        if(v>=THRESH){p.busy=true;p.burstT=0;}
      }
      if(d.t)awardAway((Date.now()-d.t)/1000);
    }
    if(!pods.length)for(const v of [1,1,2,1]){const s=freeSpot(podR(v));makePod(v,s.x,s.y);}
    st.tut=tutSeen()?-1:0;
  }
  ai.phase=0;ai.t=0;ai.wait=0.5;ai.act=null;ai.lastBuy=0;ai.first=true;
}
function awardAway(sec){
  if(DEMO||!(sec>=5))return;
  const s=Math.min(sec,AWAY_CAP),g=baseRate()/frenzyNow()*s*AWAY_RATE;
  if(g<1)return;
  addGlow(g);st.welcome={t:0,g};
  for(let i=0;i<fxN(30);i++)petal(rnd(40,320),rnd(200,420));
  sWelcome();
}

// ---------- effects (all capped by the quality level) ----------
function spark(x,y,sp){if(parts.length>=PART_CAP[Q])return;const a=rnd(0,6.28);parts.push({k:0,x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(.4,.9),t:0,s:rnd(6,14)});}
function petal(x,y){if(parts.length>=PART_CAP[Q])return;const a=rnd(0,6.28),sp=rnd(80,300);parts.push({k:1,x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,life:rnd(.9,1.6),t:0,s:rnd(5,9),rot:rnd(0,6.28),vr:rnd(-8,8)});}
function addText(x,y,s,c,size,life){if(texts.length<TEXT_CAP[Q])texts.push({x,y,s,c,size:size||20,t:0,life:life||0.9});}
function ring(x,y,max,w,col){if(rings.length<RING_CAP[Q])rings.push({x,y,t:0,max,w,col});}
function banner(s,c,life){st.banner={s,c,t:0,life:life||1.8};}
function spawnBug(p){if(bugs.length<Math.min(20,BUG_CAP[Q]))bugs.push({x0:p.x+rnd(-8,8),y0:p.y+rnd(-8,8),t:0,dur:rnd(0.9,1.4),bend:rnd(-90,90),g:0});}
// caught fireflies carry their glow: it lands in the counter when they arrive (instantly if the sky is too busy)
function sendFly(x,y,g,dur,bend){if(bugs.length>=BUG_CAP[Q]){addGlow(g);st.pulse=Math.min(1,st.pulse+0.3);return;}bugs.push({x0:x,y0:y,t:0,dur,bend,g});}
function bugPos(b,t){
  const u=Math.pow(clamp(t,0,1),1.6),v=1-u,tx=hudX,ty=38,cx=(b.x0+tx)/2+b.bend,cy=(b.y0+ty)/2-40;
  return {x:v*v*b.x0+2*v*u*cx+u*u*tx,y:v*v*b.y0+2*v*u*cy+u*u*ty};
}
function ripple(b,v){
  ring(b.x,b.y,70+v*7,4,st.chain?'255,143,184':'255,215,94');
  const R=150;
  for(const q of pods){
    if(q===b||q.dead||q.busy||(drag&&drag.p===q))continue;
    const dx=b.x-q.x,dy=b.y-q.y,d=Math.hypot(dx,dy)||1;
    if(d<R){const f=(1-d/R)*(60+v*4);q.vx+=dx/d*f;q.vy+=dy/d*f;q.pop=Math.max(q.pop,0.25*(1-d/R));}
  }
}

// ---------- core rules ----------
function findTarget(ex,x,y,v,r){
  let b=null,bd=1e9;
  for(const q of pods){if(q===ex||q.dead||q.busy||q.v!==v)continue;const d=Math.hypot(q.x-x,q.y-y);if(d<q.r+r*0.9&&d<bd){bd=d;b=q;}}
  return b;
}
function startMerge(a,b,dur){a.busy=b.busy=true;merges.push({a,b,t:0,dur,ax:a.x,ay:a.y,auto:dur>0.2});}
function finishMerge(m){
  const a=m.a,b=m.b;a.dead=true;b.busy=false;b.v*=2;b.r=podR(b.v);b.ff=b.ff.concat(a.ff);setFF(b);b.pop=1;
  const g=prod(b.v)*2*mults()*chainMult();addGlow(g);
  if(!m.auto)st.tf.merge=true;
  if(st.chain){                                   // mid-chain merges pay the multiplier; hand merges keep it alive
    st.chainG+=g;st.chainPop=Math.max(st.chainPop,0.5);
    if(!m.auto)st.chainT=Math.min(CHAIN_WIN,st.chainT+CHAIN_EXT);
    addText(b.x,b.y-b.r-8,'+'+fmt(g)+' x'+chainMult().toFixed(2),C.petal,20,0.9);
  }else addText(b.x,b.y-b.r-8,'+'+fmt(g),C.white,18,0.8);
  ripple(b,b.v);
  for(let i=fxN(6+b.v);i>0;i--)spark(b.x,b.y,rnd(40,140+b.v*6));
  if(thr('m',0.08)){if(st.chain)sChainMerge(b.v,st.chain);else sMerge(b.v);}
  st.shake=Math.max(st.shake,1+Math.log2(b.v)*0.8);
  if(b.v>=THRESH){b.busy=true;b.burstT=0;sCharge();}
}
function autoMerge(){                             // the breeze tidies the smallest pair; big merges and blooms are left to the player
  const dp=drag&&drag.p,pp=press&&press.p;
  const L=pods.filter(p=>!p.dead&&!p.busy&&p!==dp&&p!==pp);
  let best=null,bs=-1e9;
  for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){
    const a=L[i],b=L[j];if(a.v!==b.v)continue;
    const s=-a.v*1000-Math.hypot(a.x-b.x,a.y-b.y);if(s>bs){bs=s;best=[a,b];}
  }
  if(!best)return false;
  startMerge(best[0],best[1],0.4);
  ring(best[0].x,best[0].y,40,3,'244,247,255');
  return true;
}
function doBurst(p){
  p.dead=true;st.blooms++;st.tf.bloom=true;
  const cm=chainMult(),was=st.chain>0;           // a bloom inside a running chain pays the current multiplier
  const g=Math.max(20*bloomMult(),baseRate()*6)*cm;
  // the whole swarm breaks free and streams up to the counter, each firefly carrying a share of the bloom
  const n=p.ff.length||1;
  for(const f of p.ff){const q=ffPos(p,f,p.dr*1.4);sendFly(q.x,q.y,g/n,rnd(0.9,1.6),rnd(-170,170));}
  if(!p.ff.length)addGlow(g);
  if(!was)st.chainG=0;
  st.chain++;st.chainT=Math.max(3.5,CHAIN_WIN-0.7*(st.chain-1));   // each link gives a shorter window
  st.chainG+=g;st.chainPop=1;st.chainEnd=0;
  addText(clamp(p.x,140,220),p.y-44,was?'CHAIN x'+cm.toFixed(2)+'!':n+' FIREFLIES FREE!',was?C.petal:C.gold,was?34:26,1.4);
  addText(p.x,p.y-8,'+'+fmt(g),C.white,24,1.3);
  banner(was?'Chain now x'+chainMult().toFixed(2):'Glow bonus x'+bloomMult().toFixed(2),C.petal,1.8);
  st.shake=Math.max(st.shake,Math.min(16,9+(was?st.chain*2:0)));st.flash=0.45;st.flowerT=0;
  ring(p.x,p.y,200,10,'255,143,184');
  if(was)ring(CRX,CRY,60,6,'255,143,184');
  for(let i=fxN(28);i>0;i--)petal(p.x,p.y);
  for(let i=fxN(18);i>0;i--)spark(p.x,p.y,rnd(100,320));
  ripple(p,32);sBurst(st.chain);
  [1,1,2].forEach((sv,i)=>{const f=freeSpot(podR(sv));seeds.push({x0:p.x,y0:p.y,x1:f.x,y1:f.y,v:sv,t:-i*0.1,dur:0.55,pink:true});});
}
function endChain(){
  if(st.chain>=2)banner('CHAIN x'+chainMult().toFixed(2)+'  +'+fmt(st.chainG),C.petal,2);
  st.chainLast=chainMult();st.chain=0;st.chainT=0;st.chainEnd=0.4;sChainEnd();
}
// tier 2 seeds count every value on the bed (pods, merges about to land, seeds in flight) and plant the rarest one,
// preferring a value whose pod has no twin yet; ties go to the bigger value
function rareValue(){
  const cnt={},top=seedTop(st.lv[1]),add=v=>{if(v<=top)cnt[v]=(cnt[v]||0)+1;};
  for(const p of pods)if(!p.dead&&!p.busy)add(p.v);
  for(const m of merges)add(m.b.v*2);
  for(const s of seeds)add(s.v);
  let best=1,bk=1e9;
  for(const k in cnt){const v=+k,c=cnt[k],s=(c%2?0:1000)+c*10-Math.log2(v);if(s<bk){bk=s;best=v;}}
  return best;
}
function plantSeed(){
  const rare=st.lv[1]>=RARE_LV,v=rare?rareValue():1;
  let tw=null;
  if(rare)for(const p of pods)if(!p.dead&&!p.busy&&p.v===v&&(!tw||p.id<tw.id))tw=p;
  const f=freeSpot(podR(v),tw);
  seeds.push({x0:36,y0:BAR_Y,x1:f.x,y1:f.y,v,t:0,dur:0.5,pink:false,rare,tw});
}
function boostTap(){st.boost=Math.min(BOOST_MAX,st.boost+0.2);st.combo++;st.comboT=0.8;}
function tapPod(p){                               // catch one firefly: it flies to the counter carrying its glow
  if(p.dead)return false;
  const f=p.ff.find(f=>f.cd<=0);
  if(!f){
    p.pop=Math.max(p.pop,0.3);ring(p.x,p.y,p.r+14,2,'244,247,255');
    if(thr('e',0.3)){addText(p.x,p.y-p.r-6,'resting...',C.white,15,0.7);sDeny();}
    return false;
  }
  st.tf.catch=true;
  const g=catchV(p),q=ffPos(p,f,p.dr);f.cd=REGEN;
  sendFly(q.x,q.y,g,rnd(0.55,0.8),rnd(-60,60));boostTap();
  p.pop=1;addText(q.x,q.y-18,'+'+fmt(g),C.gold,20,0.8);
  for(let i=fxN(8);i>0;i--)spark(q.x,q.y,rnd(60,160));
  ring(q.x,q.y,34,3,'255,215,94');
  st.shake=Math.max(st.shake,1.5);sTap(st.combo);
  return true;
}
function tapEmpty(x,y){                           // a soft pulse that draws nearby pods together (no free glow)
  ripple({x,y},1);
  for(let i=fxN(5);i>0;i--)spark(x,y,rnd(40,100));
  tone(330,0.14,'sine',0.06,1.4);
}
function buy(i){
  const u=UPS[i];st.btnP[i]=1;
  if(st.lv[i]>=u.max||st.glow<cost(i)){sDeny();st.btnS[i]=1;return;}
  st.glow-=cost(i);st.lv[i]++;sBuy(st.lv[i]);st.tf.buy=true;
  const bx=UX[i]+UW/2;
  addText(bx,UY-16,'Lv '+st.lv[i]+'!',u.col,22,1);
  if(i===1&&(st.lv[1]===RARE_LV||st.lv[1]===RARE8_LV))
    banner(st.lv[1]===RARE_LV?'RARE SEEDS: twins for loners!':'RARE SEEDS now reach 8!',C.gold,2.4);
  for(let k=fxN(14);k>0;k--)spark(bx,UY+30,rnd(60,180));
  ring(bx,UY+30,70,5,'255,215,94');
  st.flash=Math.max(st.flash,0.1);st.shake=Math.max(st.shake,3);
  save();
}
function resetTap(){
  if(st.resetArm>0){try{localStorage.removeItem(SAVE_KEY);}catch(e){}newGame(true);st.flash=0.4;sBuy(0);save();}
  else{st.resetArm=2.5;sPick();}
}
function buyCrit(i){
  const u=CRIT[i],l=st.cr[i];st.btnP[i]=1;
  if(l>=u.max||st.glow<critCost(i)){sDeny();st.btnS[i]=1;return;}
  st.glow-=critCost(i);st.cr[i]++;sBuy(st.cr[i]+4);st.tf.buy=true;
  const bx=UX[i]+UW/2;
  if(l===0){                                      // first unlock: the critter shows up soon
    banner(['GOLD FROG unlocked! Watch the bed','LUNA MOTH unlocked! Tap it','WISH STAR unlocked! Tap it'][i],u.col,2.6);
    if(i===0)st.frogT=Math.min(st.frogT,3);else if(i===1)st.mothT=Math.min(st.mothT,6);else st.starT=Math.min(st.starT,6);
    for(let k=fxN(24);k>0;k--)petal(bx,UY);
  }else addText(bx,UY-16,'Lv '+st.cr[i]+'!',u.col,22,1);
  for(let k=fxN(14);k>0;k--)spark(bx,UY+30,rnd(60,180));
  ring(bx,UY+30,70,5,'255,143,184');
  st.flash=Math.max(st.flash,0.12);st.shake=Math.max(st.shake,3);
  save();
}

// ---------- critters: a golden frog, a luna moth and a wishing star (all need a tap at the right time) ----------
function frogSpot(){                              // near the pod with the most fireflies home
  let b=null,bs=0;for(const p of pods){if(p.dead||p.busy)continue;const s=ready(p)+Math.random();if(s>bs){bs=s;b=p;}}
  const a=rnd(0,6.28),d=rnd(55,85),x=b?b.x+Math.cos(a)*d:rnd(BX0+40,BX1-40),y=b?b.y+Math.sin(a)*d:rnd(BY0+60,BY1-40);
  return {x:clamp(x,BX0+26,BX1-26),y:clamp(y,BY0+44,BY1-22)};
}
function frogHop(x,y,d){const f=st.frog;f.x0=f.x;f.y0=f.y;f.x1=x;f.y1=y;f.hop=0;f.hd=d;f.face=x>=f.x?1:-1;tone(220,0.12,'sine',0.05,1.8);}
function frogIn(){
  const left=Math.random()<0.5,sp=frogSpot();
  st.frog={x:left?-30:W+30,y:sp.y,x0:0,y0:0,x1:0,y1:0,hop:-1,hd:0.5,s:'eat',food:0,need:FROG_NEED,bank:0,eatT:0.4,idle:0,fullT:0,tg:null,pop:0,gulp:0,face:1};
  frogHop(sp.x,sp.y,0.7);sCroak();
  addText(sp.x,sp.y-44,'GOLD FROG!',C.gold,20,1.2);
}
function frogStep(dt){
  const f=st.frog;f.pop=Math.max(0,f.pop-dt*3);f.gulp=Math.max(0,f.gulp-dt*3);
  if(f.hop>=0){
    f.hop+=dt/f.hd;const k=Math.min(1,f.hop);f.x=lerp(f.x0,f.x1,k);f.y=lerp(f.y0,f.y1,k);
    if(f.hop>=1){f.hop=-1;if(f.s==='out'){st.frog=null;st.frogT=frogI(st.cr[0]);return;}ring(f.x,f.y+10,40,3,'255,215,94');}
    return;
  }
  if(f.s==='full'){                               // she waits for a tap... but not forever
    f.fullT-=dt;
    if(f.fullT<=0){f.s='out';frogHop(f.x<180?-40:W+40,f.y,0.6);banner('The frog hopped away...',C.white,2);sCroak();}
    return;
  }
  if(f.tg){                                       // tongue out: grab the firefly and reel it in
    const g=f.tg;g.t+=dt;
    if(!g.p.dead){const q=ffPos(g.p,g.f,g.p.dr);g.x=q.x;g.y=q.y;}
    if(g.t>=0.32){
      f.tg=null;f.food++;f.bank+=catchV(g.p)*3;f.gulp=1;f.eatT=frogEat(st.cr[0]);sGulp(f.food);
      for(let i=fxN(4);i>0;i--)spark(f.x,f.y,rnd(30,80));
      if(f.food>=f.need){
        f.s='full';f.fullT=FROG_FULL;sCharge();ring(f.x,f.y,90,6,'255,215,94');
        banner("She's FULL! TAP the frog to POP her!",C.gold,2.6);
      }
    }
    return;
  }
  f.eatT-=dt;f.idle+=dt;if(f.eatT>0)return;
  let bp=null,bd=150;
  for(const p of pods){if(p.dead||p.busy||!ready(p))continue;const d=Math.hypot(p.x-f.x,p.y-f.y);if(d<bd){bd=d;bp=p;}}
  if(!bp){f.eatT=0.25;if(f.idle>1){f.idle=0;const s=frogSpot();frogHop(s.x,s.y,0.5);}return;}
  f.idle=0;const ff=bp.ff.find(x=>x.cd<=0);ff.cd=REGEN+0.3;
  const q=ffPos(bp,ff,bp.dr);f.tg={p:bp,f:ff,t:0,x:q.x,y:q.y};f.face=bp.x>=f.x?1:-1;sLick();
}
function frogPop(){                               // the golden frog bursts: every firefly she ate streams to the counter
  const f=st.frog,l=st.cr[0],g=f.bank+baseRate()*frogSec(l),n=Math.min(22,f.food+10);
  for(let i=0;i<n;i++)sendFly(f.x+rnd(-14,14),f.y+rnd(-14,14),g/n,rnd(0.8,1.5),rnd(-170,170));
  addText(clamp(f.x,120,240),f.y-50,'FROG POP!',C.gold,36,1.5);
  addText(f.x,f.y-14,'+'+fmt(g),C.white,26,1.4);
  banner('Golden frog popped  +'+fmt(g),C.gold,2.2);
  st.shake=Math.max(st.shake,18);st.flash=0.55;

function tutBtn(){let bi=0,bc=Infinity;for(let i=0;i<3;i++){if(st.lv[i]>=UPS[i].max)continue;const c=cost(i);if(c<bc){bc=c;bi=i;}}return bi;}
function tutPod(){                                // stick with one target pod while it still has fireflies home
  const p=st.tpod;if(p&&!p.dead&&!p.busy&&ready(p)>0)return p;
  let b=null,bs=-1;for(const q of pods){if(q.dead||q.busy)continue;const s=ready(q)*10+q.v;if(s>bs){bs=s;b=q;}}

function tutPair(){
  const t=st.tp;if(t&&!t[0].dead&&!t[1].dead&&!t[0].busy&&!t[1].busy&&t[0].v===t[1].v)return t;

// ---------- demo AI: taps pods, drags merges, buys upgrades ----------
function aiUpdate(dt){
  ai.t+=dt;ai.lastBuy+=dt;ai.tap=Math.max(0,ai.tap-dt);
  if(ai.phase===0){
    if(ai.t<ai.wait)return;
    let act=null;
    if(st.frog&&st.frog.s==='full'&&st.frog.hop<0)act={k:'frog'};
    if(!act&&ai.lastBuy>2.5&&!ai.first){
      let bi=-1,bc=Infinity;
      for(let i=0;i<3;i++){if(st.lv[i]>=UPS[i].max)continue;const c=cost(i);if(c<=st.glow&&c<bc){bc=c;bi=i;}}
      if(bi>=0)act={k:'buy',i:bi};
    }
    const L=pods.filter(p=>!p.dead&&!p.busy);
    if(!act&&(ai.first||Math.random()<(st.chain?0.8:0.5))){   // the AI hunts the biggest pair to trigger / feed blooms
      let pr=null,pd=-1e9;
      for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){if(L[i].v!==L[j].v)continue;const d=L[i].v*1000-Math.hypot(L[i].x-L[j].x,L[i].y-L[j].y);if(d>pd){pd=d;pr=[L[i],L[j]];}}
      if(pr)act={k:'drag',p:pr[0],b:pr[1]};
    }
    ai.first=false;
    if(!act&&L.length){L.sort((a,b)=>ready(b)-ready(a));if(ready(L[0])>0)act={k:'tap',p:L[Math.floor(Math.random()*Math.min(2,L.length))],n:3+Math.floor(Math.random()*3)};}
    if(!act){ai.t=0;ai.wait=0.3;return;}
    ai.act=act;ai.phase=1;ai.t=0;ai.sx=ai.px;ai.sy=ai.py;
  }else if(ai.phase===1){
    const a=ai.act;
    if(a.p&&(a.p.dead||a.p.busy)){ai.phase=0;ai.t=0;ai.wait=0.1;return;}
    let tx,ty;
    if(a.k==='buy'){tx=UX[a.i]+UW/2;ty=UY+UH/2;}
    else if(a.k==='frog'){const f=st.frog;if(!f||f.s!=='full'){ai.phase=0;ai.t=0;ai.wait=0.1;return;}tx=f.x;ty=f.y;}
    else{tx=a.p.x;ty=a.p.y;}
    const k=easeIO(Math.min(1,ai.t/0.3));
    ai.px=lerp(ai.sx,tx,k);ai.py=lerp(ai.sy,ty,k);
    if(ai.t>=0.3){
      ai.t=0;
      if(a.k==='buy'){buy(a.i);ai.tap=0.15;ai.lastBuy=0;ai.phase=0;ai.wait=0.35;}
      else if(a.k==='frog'){frogTap();ai.tap=0.2;ai.phase=0;ai.wait=0.5;}
      else if(a.k==='tap'){ai.phase=3;ai.t=1;}
      else if(grabPod(a.p,ai.px,ai.py,0)){ai.phase=2;ai.sx=ai.px;ai.sy=ai.py;}
      else{ai.phase=0;ai.wait=0.1;}
    }
  }else if(ai.phase===2){
    const b=ai.act.b;
    if(!drag){ai.phase=0;ai.t=0;return;}
    if(b.dead||b.busy){releaseDrag();ai.phase=0;ai.t=0;ai.wait=0.2;return;}
    const k=easeIO(Math.min(1,ai.t/0.45));ai.px=lerp(ai.sx,b.x,k);ai.py=lerp(ai.sy,b.y,k);moveDrag(ai.px,ai.py);
    if(ai.t>=0.45){releaseDrag();ai.phase=0;ai.t=0;ai.wait=0.3;}
  }else{
    const a=ai.act;
    if(a.p.dead||a.p.busy||a.n<=0){ai.phase=0;ai.t=0;ai.wait=0.2;return;}
    ai.px=a.p.x;ai.py=a.p.y;
    if(ai.t>=0.14){ai.t=0;a.n--;if(!tapPod(a.p))a.n=0;ai.tap=0.1;}
  }
}

// ---------- update ----------
function physics(dt){
  const dp=drag&&drag.p,damp=Math.exp(-3*dt);
  for(const p of pods){
    if(p.dead||p.busy||p===dp)continue;
    const k=clock*0.5+p.id*1.7;
    p.vx+=Math.sin(k)*8*dt;p.vy+=Math.cos(k*0.8+p.id)*8*dt;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=damp;p.vy*=damp;
  }
  const push=Math.min(1,dt*10);
  for(let i=0;i<pods.length;i++){
    const a=pods[i];if(a.dead||a===dp)continue;
    for(let j=i+1;j<pods.length;j++){
      const b=pods[j];if(b.dead||b===dp||(a.busy&&b.busy))continue;
      let dx=b.x-a.x,dy=b.y-a.y;const mn=(a.r+b.r)*0.8;
      if(dx>mn||dx<-mn||dy>mn||dy<-mn)continue;   // cheap reject before the sqrt
      let d=Math.hypot(dx,dy);if(d>=mn)continue;
      if(d<0.01){dx=rnd(-1,1);dy=rnd(-1,1);d=Math.hypot(dx,dy)||1;}
      const m=(mn-d)*push,nx=dx/d,ny=dy/d;
      if(a.busy){b.x+=nx*m;b.y+=ny*m;}
      else if(b.busy){a.x-=nx*m;a.y-=ny*m;}
      else{a.x-=nx*m/2;a.y-=ny*m/2;b.x+=nx*m/2;b.y+=ny*m/2;}
    }
  }
  for(const p of pods){if(p.dead||p.busy||p===dp)continue;p.x=clamp(p.x,BX0+p.r*0.8,BX1-p.r*0.8);p.y=clamp(p.y,BY0+p.r*0.8,BY1-p.r*0.8);}
}

function update(dt){
  clock+=dt;
  if(DEMO)aiUpdate(dt);
  addGlow(rate()*dt);
  const bo=st.boost>0?BOOST_T:1;
  st.boost=Math.max(0,st.boost-dt);
  st.comboT-=dt;if(st.comboT<=0)st.combo=0;
  st.resetArm=Math.max(0,st.resetArm-dt);st.pulse=Math.max(0,st.pulse-dt*4);st.flowerT=Math.min(1,st.flowerT+dt*1.2);
  for(let i=0;i<3;i++){st.btnP[i]=Math.max(0,st.btnP[i]-dt*5);st.btnS[i]=Math.max(0,st.btnS[i]-dt*3);}
  if(st.welcome){st.welcome.t+=dt;if(st.welcome.t>4.2)st.welcome=null;}
  if(st.banner){st.banner.t+=dt;if(st.banner.t>st.banner.life)st.banner=null;}
  if(st.tut>=0){st.tutT+=dt;const T=TUT[st.tut];if(T.k?(st.tf[T.k]&&st.tutT>0.5):st.tutT>6)nextTut();}
  // burst chain countdown: ticks speed up the last 2 seconds, pink embers rise while it runs
  if(st.chain){
    const prev=st.chainT;st.chainT-=dt;
    if(st.chainT<2&&st.chainT>0&&Math.floor(prev*4)!==Math.floor(st.chainT*4))sTick(Math.round((2-st.chainT)*6));
    if(st.chainT<=0)endChain();
    else if(parts.length<PART_CAP[Q]&&Math.random()<dt*(5+st.chain*3)*FX[Q])
      parts.push({k:2,x:rnd(BX0,BX1),y:BY1+6,vx:rnd(-12,12),vy:rnd(-150,-80),life:rnd(1.2,2),t:0,s:rnd(6,11)});
  }
  st.chainPop=Math.max(0,st.chainPop-dt*3);st.chainEnd=Math.max(0,st.chainEnd-dt);
  critUpdate(dt);
  st.tint+=((st.chain?Math.min(1,0.4+0.2*st.chain):0)-st.tint)*Math.min(1,dt*4);
  // seeds plant themselves, the breeze merges pairs (breeze waits while the tutorial teaches merging)
  const live=livePods();
  if(live+seeds.length<cap()){st.spawnT+=dt*bo;if(st.spawnT>=seedI(st.lv[1])){st.spawnT=0;plantSeed();}}
  if(st.tut<0||st.tut>1){const mi=mergeI(st.lv[2]);st.mergeT+=dt*bo;if(st.mergeT>=mi)st.mergeT=autoMerge()?0:mi;}
  // ambient fireflies drifting up to the counter
  st.bugAcc+=dt*Math.min(4,0.4+live*0.15)*(st.boost>0?2:1)*FX[Q];
  while(st.bugAcc>=1){st.bugAcc-=1;if(pods.length){const p=pods[Math.floor(Math.random()*pods.length)];if(!p.dead)spawnBug(p);}}
  if(drag){
    const e=Math.exp(-12*dt),p=drag.p;drag.offx*=e;drag.offy=drag.lift+(drag.offy-drag.lift)*e;
    if(p.dead||p.busy)drag=null;
    else{p.x=clamp(drag.x+drag.offx,BX0-10,BX1+10);p.y=clamp(drag.y+drag.offy,BY0-10,BY1+10);}
  }
  physics(dt);
  for(const p of pods){
    if(p.dead)continue;
    p.born=Math.min(1,p.born+dt*4);p.pop=Math.max(0,p.pop-dt*3);p.dr+=(p.r-p.dr)*Math.min(1,dt*10);
    for(const f of p.ff)if(f.cd>0){f.cd-=dt;if(f.cd<=0)f.back=0.4;}else if(f.back>0)f.back-=dt;
    if(p.burstT>=0){p.burstT+=dt;if(p.burstT>=0.45)doBurst(p);}
  }
  // lists are compacted in place (no per-frame array allocations)
  let j=0;
  for(let i=0;i<merges.length;i++){
    const m=merges[i];m.t+=dt;const k=easeIO(Math.min(1,m.t/m.dur));
    m.a.x=lerp(m.ax,m.b.x,k);m.a.y=lerp(m.ay,m.b.y,k);
    if(m.t>=m.dur)finishMerge(m);else merges[j++]=m;
  }
  merges.length=j;j=0;
  for(let i=0;i<seeds.length;i++){
    const s=seeds[i];s.t+=dt;
    if(s.t<s.dur){seeds[j++]=s;continue;}
    const r=podR(s.v),p=makePod(s.v,clamp(s.x1,BX0+r*0.8,BX1-r*0.8),clamp(s.y1,BY0+r*0.8,BY1-r*0.8));p.born=0.3;
    for(let k=fxN(6);k>0;k--)spark(p.x,p.y,rnd(30,90));
    if(s.rare&&s.v>1){                          // a rare seed flags the twin it was grown for
      ring(p.x,p.y,p.r+26,4,'255,215,94');
      if(s.tw&&!s.tw.dead&&s.tw.v===s.v){s.tw.pop=Math.max(s.tw.pop,0.6);ring(s.tw.x,s.tw.y,s.tw.r+26,4,'255,215,94');}

    ctx.globalAlpha=1-k;ctx.strokeStyle=C.gold;ctx.lineWidth=3;circ(p.x,p.y,p.r+5+k*22);ctx.stroke();
    drawFinger(p.x+p.r*0.3,p.y+p.r*0.3+(k<0.2?0:8*Math.sin((k-0.2)/0.8*Math.PI)),k<0.2);
  }else if(st.tut===1){
    if(drag)return;const pr=tutPair();if(!pr)return;
    const a=pr[0],b=pr[1],k=(clock%1.8)/1.8,m=easeIO(clamp((k-0.15)/0.55,0,1));
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d,hx=b.x-ux*(b.r+6),hy=b.y-uy*(b.r+6);
    ctx.globalAlpha=0.75;ctx.strokeStyle=C.gold;ctx.lineWidth=3;ctx.setLineDash([7,7]);ctx.lineDashOffset=-clock*30;
    ctx.beginPath();ctx.moveTo(a.x+ux*a.r,a.y+uy*a.r);ctx.lineTo(hx,hy);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=C.gold;ctx.beginPath();ctx.moveTo(hx+ux*8,hy+uy*8);ctx.lineTo(hx-ux*4-uy*7,hy-uy*4+ux*7);ctx.lineTo(hx-ux*4+uy*7,hy-uy*4-ux*7);ctx.closePath();ctx.fill();
    ctx.lineWidth=3;circ(a.x,a.y,a.r+6);ctx.stroke();circ(b.x,b.y,b.r+6);ctx.stroke();
    ctx.globalAlpha=1;if(k<0.9)drawFinger(lerp(a.x,b.x,m),lerp(a.y,b.y,m),k>0.1&&k<0.75);

}
function drawTutCard(){

function drawBanner(){

const HELP=[[C.gold,'TAP a pod to catch a firefly'],[C.leaf,'DRAG twins together to merge'],[C.petal,'16 fireflies BLOOM: +3 seeds'],
  [C.petal,'Bloom again fast for a CHAIN'],[C.leaf,'SEEDS plant, BREEZE merges'],
  [C.gold,'CRITTERS: tap FULL frog to POP'],[C.petal,'Tap moth / falling star fast'],[C.gold,'Glow keeps growing offline']];

    ctx.fillStyle=h[0];circ(50,y,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(h[1],72,y+1,252);});

function render(){
  const ls=lvlSum(),grow=Math.min(1,(st.blooms*2+ls)/60),bo=st.boost>0;
  const gk=Math.round(grow*20);if(gk!==bgKey){bgKey=gk;buildBg(grow);}
  const nl=Math.min(LEAVES.length,6+ls*4);if(nl!==bedKey){bedKey=nl;buildBed(nl);}
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.drawImage(BG,0,0);
  const sh=st.shake,sx=sh?rnd(-sh,sh)*0.6:0,sy=sh?rnd(-sh,sh)*0.6:0;
  BS=dpr*scale;BXo=dpr*(ox+sx*scale);BYo=dpr*(oy+sy*scale);baseT();
  // sky: more stars as the garden grows
  ctx.fillStyle='#fff';const ns=Math.round(40+grow*50);
  for(let i=0;i<ns;i++){const s=STARS[i];ctx.globalAlpha=0.35+0.35*Math.sin(clock*2+s.p);ctx.fillRect(s.x,s.y,s.s,s.s);}
  ctx.globalAlpha=1;
  // garden bed (panel + leaves are one cached image), swaying grass
  ctx.drawImage(BED,PX0-16,PY0-16,PW+32,PH+32);
  ctx.strokeStyle='#1d5a3a';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();
  for(const g of GRASS){const h=g.h*(1+grow*0.8);ctx.moveTo(g.x,BY1+8);ctx.quadraticCurveTo(g.x,BY1+8-h*0.6,g.x+Math.sin(clock*1.5+g.p)*5,BY1+8-h);}
  ctx.stroke();
  // flowers along the rim, one per bloom
  const nf=Math.min(FLOWERS.length,st.blooms),fBig=1+Math.min(0.6,Math.max(0,st.blooms-FLOWERS.length)*0.02);
  for(let i=0;i<nf;i++){
    const F=FLOWERS[i],k=i===nf-1&&st.blooms<=FLOWERS.length?Math.max(0.01,easeOutBack(st.flowerT)):1,z=F.s*k*fBig*4.4;
    drawRot(FLW[F.g],F.x,F.y,z,z,clock*0.3+F.ph+Math.sin(clock*1.2+F.ph)*0.2);
  }
  baseT();
  // wandering sky fireflies: more with every bloom and upgrade
  const na=Math.min(AMB_CAP[Q],8+st.blooms*3+ls*2);
  for(let i=0;i<na;i++){
    const a=AMB[i],x=a.x+Math.sin(clock*a.s1+a.a)*30,y=a.y+Math.cos(clock*a.s2+a.b)*22;
    ctx.globalAlpha=0.25+0.4*(0.5+0.5*Math.sin(clock*3+a.f));ctx.drawImage(GLOW,x-7,y-7,14,14);
  }
  // ripples
  for(const r of rings){const k=r.t/0.7;ctx.globalAlpha=(1-k)*0.8;ctx.strokeStyle=`rgb(${r.col})`;ctx.lineWidth=r.w*(1-k)+1;circ(r.x,r.y,r.max*easeIO(Math.min(1,k*1.2)));ctx.stroke();}
  ctx.globalAlpha=1;
  // breeze trails
  ctx.lineCap='round';ctx.strokeStyle=C.white;
  for(const m of merges){if(!m.auto)continue;const k=Math.min(1,m.t/m.dur);ctx.globalAlpha=0.35*(1-k);ctx.lineWidth=m.a.r*0.8;ctx.beginPath();ctx.moveTo(m.ax,m.ay);ctx.lineTo(m.a.x,m.a.y);ctx.stroke();}
  ctx.globalAlpha=1;
  // pods
  let dex=null,hov=null;
  if(drag){dex=drag.p;hov=findTarget(dex,dex.x,dex.y,dex.v,dex.r);}
  for(const p of pods){if(p!==dex)drawPod(p,dex&&!p.busy?(p.v===dex.v?(p===hov?3:2):1):0);}
  // seeds in flight
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const s of seeds){
    if(s.t<0)continue;const k=Math.min(1,s.t/s.dur);
    const x=lerp(s.x0,s.x1,k),y=lerp(s.y0,s.y1,k)-Math.sin(Math.PI*k)*80;
    ctx.drawImage(s.pink?PGLOW:GLOW,x-18,y-18,36,36);
    const sr=7+k*5+(s.rare?3:0);
    ctx.fillStyle=s.pink?C.petal:s.rare?C.gold:C.leaf;circ(x,y,sr);ctx.fill();
    if(s.rare){ctx.font='bold '+Math.round(sr*1.3)+'px sans-serif';ctx.fillStyle='#10261c';ctx.fillText(s.v,x,y+1);}
  }
  drawFrog();
  if(dex)drawPod(dex,4);
  drawTutWorld();
  // particles: glows first, then rotated petals (sprites, no paths)
  for(const p of parts){
    if(p.k===1)continue;const a=1-p.t/p.life;
    if(p.k===0){ctx.globalAlpha=a;ctx.drawImage(GLOW,p.x-p.s,p.y-p.s,p.s*2,p.s*2);}
    else{ctx.globalAlpha=a*Math.min(1,p.t*4)*0.8;ctx.drawImage(PGLOW,p.x-p.s,p.y-p.s,p.s*2,p.s*2);}
  }
  for(const p of parts){if(p.k!==1)continue;ctx.globalAlpha=1-p.t/p.life;drawRot(PET,p.x,p.y,p.s*2,p.s,p.rot);}
  baseT();
  drawMoth();drawStar();
  // fireflies flying glow up to the counter: glows + trails, then all wings in one path
  for(const b of bugs){
    const k=b.t/b.dur,q=bugPos(b,k);b.qx=q.x;b.qy=q.y;
    if(!b.g){ctx.globalAlpha=0.5;ctx.drawImage(GLOW,q.x-6,q.y-6,12,12);continue;}
    if(Q>=2)for(let i=2;i>=1;i--){const o=bugPos(b,k-i*0.06);ctx.globalAlpha=0.45-i*0.12;ctx.drawImage(GLOW,o.x-8+i*1.5,o.y-8+i*1.5,16-i*3,16-i*3);}
    ctx.globalAlpha=1;ctx.drawImage(FFS,q.x-13,q.y-13,26,26);
  }
  if(Q>=1&&bugs.length){
    ctx.globalAlpha=0.55;ctx.fillStyle='#fff';ctx.beginPath();
    for(const b of bugs){
      if(!b.g)continue;const w=Math.abs(Math.sin(clock*40+b.bend))*5+1,x=b.qx,y=b.qy;
      ctx.moveTo(x-3+4*Math.cos(-0.5),y-2+4*Math.sin(-0.5));ctx.ellipse(x-3,y-2,4,w,-0.5,0,Math.PI*2);
      ctx.moveTo(x+3+4*Math.cos(0.5),y-2+4*Math.sin(0.5));ctx.ellipse(x+3,y-2,4,w,0.5,0,Math.PI*2);
    }
    ctx.fill();
  }
  ctx.globalAlpha=1;
  // floating texts
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=4;ctx.lineJoin='round';ctx.strokeStyle='rgba(3,8,20,0.9)';
  for(const t of texts){
    const k=t.t/t.life,pop=t.t<0.15?easeOutBack(t.t/0.15):1;
    ctx.globalAlpha=k>0.7?(1-k)/0.3:1;ctx.font='bold '+Math.max(1,Math.round(t.size*pop))+'px sans-serif';
    ctx.strokeText(t.s,t.x,t.y);ctx.fillStyle=t.c;ctx.fillText(t.s,t.x,t.y);
  }
  ctx.globalAlpha=1;ctx.lineJoin='miter';
  // chain tint: a pulsing pink vignette (cached image) that deepens with every bloom in the chain

    const vx=-ox/scale-12,vy=-oy/scale-12;ctx.drawImage(VIG,vx,vy,W-2*vx,H-2*vy);ctx.globalAlpha=1;
  }
  // HUD: glow counter + rate
  const r=rate(),txt=fmt(st.glow),sc=1+st.pulse*0.08;
  ctx.save();ctx.translate(180,38);ctx.scale(sc,sc);
  ctx.font='bold 34px sans-serif';const tw=ctx.measureText(txt).width,ix=10-tw/2-18;
  hudX=180+ix*sc;
  // counter icon: a firefly, glowing brighter as the caught ones arrive
  const gs=18+st.pulse*10,wf=Math.abs(Math.sin(clock*18))*4;
  ctx.globalAlpha=0.7+st.pulse*0.3;ctx.drawImage(GLOW,ix-gs,-gs,gs*2,gs*2);
  ctx.globalAlpha=0.6;ctx.fillStyle=C.white;ctx.beginPath();ctx.ellipse(ix-5,-6,6,wf+2,-0.6,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(ix+5,-6,6,wf+2,0.6,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;ctx.fillStyle='#2a3350';ctx.beginPath();ctx.ellipse(ix,-3,3,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff6c8';circ(ix,4,4.5);ctx.fill();
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=5;ctx.lineJoin='round';ctx.strokeStyle='rgba(3,8,20,0.8)';ctx.strokeText(txt,10,1);ctx.fillStyle='#fff';ctx.fillText(txt,10,1);
  ctx.restore();
  const fz=st.frenzy>0;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 19px sans-serif';ctx.fillStyle=fz?C.white:bo?C.petal:C.gold;
  ctx.fillText('+'+fmt(r,1)+' /s'+(fz?'  FRENZY':'')+(bo?'  BOOST':''),180,70,200);
  if(bo&&fz){drawBar(120,86,58,st.boost/BOOST_MAX,C.petal);drawBar(182,86,58,st.frenzy/st.frenzyD,C.white);}
  else if(bo)drawBar(120,86,120,st.boost/BOOST_MAX,C.petal);
  else if(fz)drawBar(120,86,120,st.frenzy/st.frenzyD,C.white);
  drawChain();
  drawMoon(40,38,20,Math.min(1,0.25+st.blooms/16));
  drawRot(FLW[0],26,80,26,26,clock*0.5);baseT();
  ctx.textAlign='left';ctx.textBaseline='middle';ctx.font='bold 16px sans-serif';ctx.fillStyle=C.white;ctx.fillText(String(st.blooms),38,81);
  drawIconButtons();
  // timers row
  const full=livePods()+seeds.length>=cap(),paused=st.tut===0||st.tut===1;
  ctx.textAlign='left';ctx.font='bold 13px sans-serif';ctx.fillStyle=full?C.petal:st.lv[1]>=RARE_LV?C.gold:C.leaf;ctx.fillText(full?'FULL':st.lv[1]>=RARE_LV?'RARE':'SEED',16,BAR_Y+1);
  drawBar(58,BAR_Y,112,full?1:st.spawnT/seedI(st.lv[1]),full?'rgba(255,143,184,0.6)':C.leaf);
  ctx.fillStyle=paused?'rgba(244,247,255,0.4)':C.white;ctx.fillText('BREEZE',186,BAR_Y+1);

  drawBanner();
  if(st.resetArm>0){rr(176,100,164,30,15);ctx.fillStyle='rgba(30,6,26,0.95)';ctx.fill();ctx.strokeStyle=C.petal;ctx.lineWidth=1.5;ctx.stroke();ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=C.petal;ctx.fillText('Tap again to restart',258,116);}
  // welcome back
  if(st.welcome){
    const w=st.welcome,a=Math.max(0,Math.min(1,w.t*4,(4.2-w.t)*3)),s=Math.max(0.01,easeOutBack(Math.min(1,w.t*3)));
    ctx.save();ctx.globalAlpha=a;ctx.translate(180,290);ctx.scale(s,s);
    rr(-145,-68,290,136,22);ctx.fillStyle='rgba(8,14,34,0.93)';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=C.gold;ctx.stroke();
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='bold 26px sans-serif';ctx.fillStyle=C.gold;ctx.fillText('WELCOME BACK',0,-36);
    ctx.font='bold 16px sans-serif';ctx.fillStyle='rgba(244,247,255,0.8)';ctx.fillText('Your fireflies kept glowing',0,-6);
    ctx.globalAlpha=a*0.8;for(let i=0;i<6;i++){const ang=clock*1.5+i*1.047;ctx.drawImage(GLOW,Math.cos(ang)*130-8,Math.sin(ang)*52-8,16,16);}
    ctx.globalAlpha=a;ctx.font='bold 32px sans-serif';ctx.fillStyle='#fff';ctx.fillText('+'+fmt(w.g),0,32);
    ctx.restore();
  }
  if(st.help)drawHelp();
  if(DEMO)drawFinger(ai.px,ai.py,ai.phase===2||ai.tap>0);
  if(st.flash>0){ctx.globalAlpha=1;ctx.fillStyle=`rgba(255,238,248,${st.flash*0.55})`;ctx.fillRect(-500,-500,W+1000,H+1000);}
}

// ---------- loop ----------
function perf(gap){                               // sustained slow frames -> lower resolution + fewer effects
  upT+=gap;if(upT<2||gap>0.25||Q===0)return;
  perfEma+=(gap-perfEma)*0.05;
  if(perfEma>0.022){perfBad+=gap;if(perfBad>1.5){Q--;perfBad=0;perfEma=1/60;resize();}}
  else perfBad=Math.max(0,perfBad-gap);
}
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  try{
    const gap=Math.max(0,(now-last)/1000);last=now;
    if(gap>3)awardAway(gap);                     // tab was in the background: fireflies kept working
    perf(gap);
    update(Math.min(0.05,gap));render();
  }catch(e){showErr(e);}
}
newGame(false);
requestAnimationFrame(frame);
})();
