<script>
// Sample prototype shipped with Mythic Forge: tap to release the orbiting gumball,
// catch the next donut. Shows the contract every forged game follows (touch+mouse,
// instant restart, ?demo=1 self-play for GIF recording).
(() => {
  const DEMO = new URLSearchParams(location.search).has('demo');
  // Demo recordings: flag exciting moments (1 = nice .. 3 = big) for the clip recorder.
  const moment = lv => DEMO && window.forgeMoment && window.forgeMoment(lv);
  const cv = document.getElementById('c'), cx = cv.getContext('2d', { alpha: false }); // the sky covers every pixel
  let W = 0, H = 0, dpr = 1, vign = null, vigCol = '25,5,45';
  // Performance: shadowBlur runs a blur pass per shape per frame (it was the main source of lag), so the
  // steady glows are baked once into small offscreen sprites (at most `sprites` cached) and stamped with
  // drawImage; only the pulsing target ring and the ball still blur live. If frames keep averaging over
  // `slowMs`, the pixel ratio steps down by 0.5 (from `maxDpr`, never below 1).
  const PERF = { maxDpr: 2, slowMs: 22, sprites: 48 };
  let dprCap = PERF.maxDpr, frameMs = 16.7;
  const sprites = new Map();
  function makeVign() {
    vign = cx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.8);
    vign.addColorStop(0, 'rgba(' + vigCol + ',0)'); vign.addColorStop(1, 'rgba(' + vigCol + ',.5)');
  }
  function resize() {
    dpr = Math.min(dprCap, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    makeVign(); sprites.clear(); // glow sizes depend on dpr, the planet on the screen size
  }
  addEventListener('resize', resize); resize();
  // Offscreen sprite `key`: a (2 * half) px square painted once by paint(c) around its centre at `scale`
  // bitmap px per px, then cached (least recently used goes first). stamp() draws it centred on (x, y).
  function sprite(key, half, scale, paint) {
    let s = sprites.get(key);
    if (s) sprites.delete(key); // re-set below as the most recent
    else {
      if (sprites.size >= PERF.sprites) sprites.delete(sprites.keys().next().value);
      s = document.createElement('canvas'); s.width = s.height = Math.ceil(half * 2 * scale); s.half = s.width / scale / 2;
      const c = s.getContext('2d'); c.setTransform(scale, 0, 0, scale, s.width / 2, s.width / 2);
      paint(c);
    }
    sprites.set(key, s);
    return s;
  }
  const stamp = (s, x, y) => cx.drawImage(s, x - s.half, y - s.half, s.half * 2, s.half * 2);
  // Just the glow shape(c) casts with shadowBlur `blur` (bitmap px, like the live shadows): the shape is
  // drawn far off the sprite and only its shadow lands on it. Soft, so 1x resolution is plenty.
  function glowSprite(key, half, col, blur, shape) {
    return sprite(key + '|' + col + '|' + blur, half, 1, c => {
      c.shadowColor = col; c.shadowBlur = blur / dpr; c.shadowOffsetX = 1e4; c.translate(-1e4, 0); shape(c);
    });
  }

  const TAU = Math.PI * 2;
  const C = { ink: '#2A0F3A', dough: '#F4B96E', doughDk: '#C98640', gum: '#3FF0D5', gold: '#FFD23F', goldDk: '#C98A12',
    red: '#FF2A55', lic: '#3B0A2A', cookie: '#D9954F', chip: '#5A2E17', cream: '#FFF4E6', sloppy: '#FFA53A', pink: '#FF5FA8', pinkDk: '#B8307A',
    violet: '#8A7CFF', violetDk: '#5A4AC8', mint: '#2EC4B6', mintDk: '#178A80', text: '#4A2A5A' };
  const FROSTS = ['#FF5FA8', '#B77BFF', '#FF8FB1', '#6FCBFF'];
  const SPRINKLES = ['#FFFFFF', '#FFD23F', '#3FF0D5', '#8A7CFF', '#FF7A59', '#7CFF8A'];
  const LOGO = ['#FF5FA8', '#FFD23F', '#3FF0D5', '#B77BFF', '#FF7A59'];
  // Sky palettes (top -> bottom) that blend into each other as you climb.
  const SKY = [['#2B1B6B', '#7B3FA0', '#E0628F', '#FFB38A'], ['#141A52', '#3D2A8C', '#A24BB5', '#F07AAE'], ['#123B6B', '#2F7DB8', '#8FD3E0', '#FFD9B0']];
  const FONT = '"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",system-ui,sans-serif';
  // Cosmetic themes (bought in the shop with coins; every run pays its score in coins).
  // Each one re-skins the sky, the rings, the crumble ring, the particles and the words.
  const THEMES = [
    { id: 'sugar', name: 'Sugar Rush', price: 0, sky: SKY, vig: '25,5,45', frosts: FROSTS, sparks: SPRINKLES,
      crumb: [C.cookie, C.chip, '#F3C27E'], inner: [C.goldDk, C.gold], mine: '#6A1350',
      w: { ring: 'donut', spikes: 'licorice spikes', bomb: 'sour bombs', bombTag: 'SOUR BOMB', crumble: 'cookies', crumbleOne: 'COOKIE', arc: 'golden arc',
        stab: 'Stabbed by licorice!', boom: 'Hit a sour bomb!', crumbled: 'The cookie crumbled!', crash: 'SUGAR CRASH!', tag: '~ a sugar-rush orbit hopper ~' } },
    { id: 'neon', name: 'Neon Night', price: 150, vig: '10,0,25',
      sky: [['#0B0221', '#2A0845', '#6A0F6B', '#FF2E88'], ['#050316', '#1B0B4A', '#3E1A8C', '#00A3CC'], ['#12001F', '#3A0057', '#7A00A8', '#FF7A00']],
      frosts: ['#FF2E88', '#00F0FF', '#B04BFF', '#FFE700'], sparks: ['#FF2E88', '#00F0FF', '#FFE700', '#B04BFF', '#FFFFFF'],
      crumb: ['#FF7A00', '#FFE700', '#FF2E88'], inner: ['#008C99', '#00F0FF'], mine: '#1A0033',
      w: { ring: 'neon ring', spikes: 'laser spikes', bomb: 'virus mines', bombTag: 'VIRUS', crumble: 'glitch rings', crumbleOne: 'GLITCH', arc: 'cyan arc',
        stab: 'Zapped by lasers!', boom: 'Caught a virus!', crumbled: 'The ring glitched out!', crash: 'SYSTEM CRASH!', tag: '~ a synthwave orbit hopper ~' } },
    { id: 'ocean', name: 'Deep Sea', price: 250, vig: '0,15,35',
      sky: [['#0A2E5C', '#0F4C81', '#1C7CA8', '#3FB5C9'], ['#061A3A', '#0B3A6B', '#135E8C', '#2A8FB0'], ['#08304A', '#0E5A6E', '#1E8C8C', '#5CC8B8']],
      frosts: ['#FF4D4D', '#FF8A3D', '#FF5FA8', '#2F80FF'], sparks: ['#FFFFFF', '#9FF3FF', '#FFD23F', '#FF8A3D', '#7CFFD4'],
      crumb: ['#E9C98B', '#B8894A', '#F7E2B5'], inner: ['#8E9CB8', '#F4F1FF'], mine: '#D9A21E',
      w: { ring: 'life ring', spikes: 'urchin spikes', bomb: 'pufferfish', bombTag: 'PUFFER', crumble: 'sandcastles', crumbleOne: 'SANDCASTLE', arc: 'pearl arc',
        stab: 'Pricked by an urchin!', boom: 'Puffed by a pufferfish!', crumbled: 'The sandcastle washed away!', crash: 'WIPEOUT!', tag: '~ a deep-sea orbit hopper ~' } },
    { id: 'space', name: 'Cosmic Drift', price: 350, vig: '0,0,10',
      sky: [['#05010F', '#0D0A2E', '#1E1250', '#3B1F6E'], ['#020612', '#081A3A', '#12305E', '#2A1F5C'], ['#0A0214', '#1F0830', '#3D0F4A', '#5A1A4A']],
      frosts: ['#8AB4FF', '#C58CFF', '#7CFFD4', '#FFB86B'], sparks: ['#FFFFFF', '#8AB4FF', '#C58CFF', '#FFE27A', '#7CFFD4'],
      crumb: ['#8C84A8', '#4E4868', '#B9B2D6'], inner: ['#B8860B', '#FFE27A'], mine: '#2E2E48',
      w: { ring: 'orbit ring', spikes: 'plasma spikes', bomb: 'space mines', bombTag: 'SPACE MINE', crumble: 'asteroids', crumbleOne: 'ASTEROID', arc: 'gold arc',
        stab: 'Fried by plasma!', boom: 'Hit a space mine!', crumbled: 'The asteroid broke apart!', crash: 'LOST IN SPACE!', tag: '~ a cosmic orbit hopper ~' } },
  ];
  // Ball skins: `match` = the theme it was designed for (badge in the shop); trail 'rainbow' cycles hue.
  const SKINS = [
    { id: 'gum', name: 'Gumball', noun: 'gumball', price: 0, trail: '#3FF0D5', match: 'sugar' },
    { id: 'hole', name: 'Donut Hole', noun: 'donut hole', price: 40, trail: '#FF8FB1', match: 'sugar' },
    { id: 'beach', name: 'Beach Ball', noun: 'beach ball', price: 50, trail: '#FFD23F' },
    { id: 'eye', name: 'Eyeball', noun: 'eyeball', price: 70, trail: '#FFFFFF' },
    { id: 'neon', name: 'Neon Core', noun: 'neon core', price: 80, trail: '#00F0FF', match: 'neon' },
    { id: 'pearl', name: 'Pearl', noun: 'pearl', price: 80, trail: '#CFF6FF', match: 'ocean' },
    { id: 'saturn', name: 'Mini Saturn', noun: 'mini planet', price: 100, trail: '#FFB86B', match: 'space' },
    { id: 'fire', name: 'Fireball', noun: 'fireball', price: 120, trail: '#FF8A2A' },
    { id: 'prism', name: 'Prism', noun: 'prism ball', price: 180, trail: 'rainbow' },
  ];
  // Clean catch: spark enters r+6. Sloppy catch: spark only grazes the wider grab
  // zone (r+GRAB) -- it survives, but the streak and multiplier are broken.
  const CATCH = 6, GRAB = 30, STREAK_PER_MULT = 3, MAX_MULT = 8;
  // Called miss: once the spark moves away from the target outside r+GRAB, time drops to `slow`x for
  // `time` real seconds on a red gap showing how far it missed the grab zone by, then the crash. A gap
  // under `heartbreak` px is flagged as a demo highlight.
  const MISS = { slow: 0.25, time: 0.4, heartbreak: 10 };
  // Combo hype, all driven by mult(): the trail keeps `trail` + `trailPer` samples per step and glows
  // brighter, the camera zooms in `zoomPer` per step, and from x`beatMult` the next ring's glow pulses on a
  // beat (`bpm`, + `bpmPer` per step) with a soft kick. From x`fireMult` the ball wears its skin's on-fire
  // aura (`fireMin` .. 1 at MAX_MULT). A SLOPPY/GAP that ends a streak of `breakMin`+ hits a `breakFreeze`
  // hit-stop, drains the screen's color for `grayT` seconds and plays a record scratch.
  const HYPE = { trail: 14, trailPer: 5, zoomPer: 0.012, beatMult: 4, bpm: 120, bpmPer: 8, fireMult: 2, fireMin: 0.45,
    breakMin: 3, breakFreeze: 0.1, grayT: 0.9 };
  // Double ring: a segmented inner ring counter-rotates inside the outer one. A shot
  // whose line passes within the inner r+6 commits to it on crossing the outer ring:
  // hit a solid arc for a BULLSEYE (double points), hit a gap and the streak breaks.
  const SPEED = 520, SEGS = 3, SOLID = 0.55, SLOT = TAU / SEGS;
  // Spike ring: a red spiked shield orbits just outside the ring (r+SH) and blocks
  // the spark both ways -- in when landing, out when launching. Crumble ring: breaks
  // CRUMBLE_T seconds after you land (and shatters behind you). Mines slide on a track.
  const SH = 12, SPIKE_ARC = TAU * 0.3, SPIKE_PAD = 0.12, CRUMBLE_T = 2.4, MINE_R = 11, GRAV = 1400;
  // Near miss: skimming a spike shield or a mine by under NEAR px (and living) pops a white CLOSE!.
  // The demo AI keeps AI_PAD px clear of every hazard -- little enough to still skim some.
  const NEAR = 8, AI_PAD = 3;
  // Charge: hold instead of tapping and the spark grips the ring, then winds up along it --
  // a short pull-back against the spin, then a whip forward past where you pressed. Let go
  // at any point to fire from there. A quick tap (< TAP_T) still fires right where you
  // pressed; a full charge auto-fires after CHARGE_HOLD.
  const TAP_T = 0.12, CHARGE_T = 0.55, CHARGE_HOLD = 0.3, WIND = 0.7;
  const windShape = k => k - 0.9 * Math.sin(Math.PI * k); // 0 -> dips to ~-0.46 -> 1
  let WIND_BACK = 0; for (let k = 0; k <= 1; k += 0.01) WIND_BACK = Math.min(WIND_BACK, windShape(k));
  const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  const mix = (a, b, f) => { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * f)).join(',') + ')'; };
  const num = n => Math.round(n).toLocaleString('en-US'); // 10000 -> "10,000"
  const easeOutBack = t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2);
  // Keep the entries that pass `keep`, compacting the array in place (no fresh array every frame).
  const prune = (arr, keep) => { let n = 0; for (const x of arr) if (keep(x)) arr[n++] = x; arr.length = n; };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } }
  };

  // ---------- synthesized sound (WebAudio; unlocked by the first tap/key) ----------
  const sfx = (() => {
    let ac = null, out = null, crunch = null, noise = null, wh = null;
    function unlock() {
      try {
        if (!ac) {
          const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
          ac = new AC(); out = ac.createGain(); out.gain.value = 0.45; out.connect(ac.destination);
          // Bit-crush style waveshaper: drive the input hard, then quantize it for a crunchy edge.
          crunch = ac.createGain(); crunch.gain.value = 6;
          const ws = ac.createWaveShaper(), post = ac.createGain(), curve = new Float32Array(256);
          for (let i = 0; i < 256; i++) curve[i] = Math.round((i / 127.5 - 1) * 5) / 5;
          ws.curve = curve; post.gain.value = 0.12;
          crunch.connect(ws); ws.connect(post); post.connect(out);
          noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
          const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        }
        if (ac.state === 'suspended') ac.resume();
      } catch (e) { ac = null; }
    }
    const ok = () => ac && ac.state === 'running';
    // Enveloped oscillator gliding f0 -> f1 over `dur` seconds, starting `at` seconds from now.
    function tone(type, f0, f1, dur, vol, at, dest) {
      const t = ac.currentTime + (at || 0), o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(dest || out); o.start(t); o.stop(t + dur + 0.03);
    }
    // Filtered noise burst.
    function hiss(dur, vol, type, freq, q, at) {
      const t = ac.currentTime + (at || 0), s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = noise; f.type = type; f.frequency.value = freq; f.Q.value = q || 1;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(out); s.start(t, Math.random() * 0.8); s.stop(t + dur + 0.03);
    }
    return {
      unlock,
      // Candy pop: a quick upward blip, one semitone higher per streak step (capped at two octaves).
      // From x2 (`m`) a bass note lands under it, climbing a minor pentatonic and getting louder per step.
      pop(streak, m) {
        if (!ok()) return;
        const f = 480 * Math.pow(2, Math.min(streak, 24) / 12);
        tone('sine', f * 0.55, f * 1.6, 0.09, 0.55); tone('triangle', f * 2, f * 2.2, 0.05, 0.12);
        hiss(0.025, 0.25, 'highpass', 3500);
        if (m > 1) {
          const b = 110 * Math.pow(2, [0, 3, 5, 7, 10, 12, 15][Math.min(m - 2, 6)] / 12);
          tone('sine', b * 1.03, b, 0.32, 0.3 + 0.05 * m); tone('triangle', b * 2, b * 2, 0.2, 0.06 + 0.02 * m);
        }
      },
      // Soft heartbeat kick on the x4+ beat, a touch harder each multiplier step.
      beat(m) {
        if (!ok()) return;
        tone('sine', 150, 48, 0.16, 0.2 + 0.04 * m); tone('triangle', 320, 180, 0.05, 0.05);
      },
      // Record scratch for a lost streak: a noisy back-and-forth rub, then everything winds down in pitch.
      scratch() {
        if (!ok()) return;
        const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
        s.buffer = noise; f.type = 'bandpass'; f.Q.value = 3;
        f.frequency.setValueAtTime(1800, t); f.frequency.exponentialRampToValueAtTime(3400, t + 0.07);
        f.frequency.exponentialRampToValueAtTime(900, t + 0.15); f.frequency.exponentialRampToValueAtTime(2600, t + 0.21);
        f.frequency.exponentialRampToValueAtTime(220, t + 0.55);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.9, t + 0.02); g.gain.exponentialRampToValueAtTime(0.25, t + 0.15);
        g.gain.exponentialRampToValueAtTime(0.7, t + 0.19); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
        s.connect(f); f.connect(g); g.connect(out); s.start(t, Math.random() * 0.8); s.stop(t + 0.6);
        tone('sawtooth', 700, 1100, 0.07, 0.08, 0, crunch); tone('sawtooth', 1100, 80, 0.5, 0.08, 0.07, crunch);
        tone('sine', 196, 41, 0.6, 0.55);
      },
      // Crunchy chime: a crushed square-wave arpeggio plus a gritty sparkle.
      chime() {
        if (!ok()) return;
        [1047, 1319, 1568, 2093].forEach((f, i) => { tone('square', f, f, 0.4 - i * 0.05, 0.1, i * 0.045, crunch); tone('sine', f * 2, f * 2, 0.3, 0.05, i * 0.045); });
        hiss(0.12, 0.35, 'bandpass', 6000, 0.8);
      },
      // Flat thud: low, short, no sparkle.
      thud() {
        if (!ok()) return;
        tone('sine', 110, 60, 0.2, 0.8); tone('triangle', 75, 70, 0.1, 0.25);
        hiss(0.09, 0.5, 'lowpass', 350);
      },
      // Death: glass shatter (bright noise + tinkling shards) over a bass drop.
      crash() {
        if (!ok()) return;
        hiss(0.55, 0.6, 'highpass', 3500, 0.7); hiss(0.2, 0.4, 'bandpass', 2200, 2);
        for (let i = 0; i < 12; i++) { const f = 2400 + Math.random() * 4200; tone('sine', f, f * 0.96, 0.08 + Math.random() * 0.3, 0.07, Math.random() * 0.3); }
        tone('sine', 170, 28, 1.0, 0.9); tone('triangle', 85, 22, 1.0, 0.3, 0.02);
      },
      // Near-miss whoosh: a noise swell whose band sweeps up and back down (a fly-by), plus a bright glint.
      whoosh() {
        if (!ok()) return;
        const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
        s.buffer = noise; f.type = 'bandpass'; f.Q.value = 1.5;
        f.frequency.setValueAtTime(500, t); f.frequency.exponentialRampToValueAtTime(3600, t + 0.14); f.frequency.exponentialRampToValueAtTime(700, t + 0.38);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.9, t + 0.1); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
        s.connect(f); f.connect(g); g.connect(out); s.start(t, Math.random() * 0.8); s.stop(t + 0.45);
        tone('triangle', 1400, 2800, 0.14, 0.06, 0.08);
      },
      // Rising whine while the charge meter fills (k 0..1); k = 0 stops it.
      whine(k) {
        if (!ok()) return;
        const t = ac.currentTime;
        if (k <= 0) { if (wh) { wh.g.gain.setTargetAtTime(0, t, 0.02); wh.o.stop(t + 0.15); wh.o2.stop(t + 0.15); wh = null; } return; }
        if (!wh) {
          const o = ac.createOscillator(), o2 = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
          o.type = 'sawtooth'; o2.type = 'sine'; f.type = 'lowpass'; f.Q.value = 6; g.gain.value = 0;
          o.connect(f); o2.connect(f); f.connect(g); g.connect(out); o.start(t); o2.start(t);
          wh = { o, o2, f, g };
        }
        const hz = 200 + 700 * k * k;
        wh.o.frequency.setTargetAtTime(hz, t, 0.02); wh.o2.frequency.setTargetAtTime(hz * 2.01, t, 0.02);
        wh.f.frequency.setTargetAtTime(600 + 2600 * k, t, 0.03); wh.g.gain.setTargetAtTime(0.04 + 0.07 * k, t, 0.03);
      }
    };
  })();

  let rings, mines, cur, spark, score, state, shake, parts, hint, streak, best, pops, multFlash, why, charge;
  let trail, waves, flash, flashCol, freeze, shown, bump, deadT, newBest, banner;
  let zoom, beatPh, beatK, gray, ignite; // combo hype: camera zoom, x4+ beat phase + pulse, lost-streak desaturation, fire flare
  let clk = 0, tutT = 0, tutPage = 0, btns = [], hintDone = false;
  let camY = 0, last = performance.now(), demoT = 0;
  let hiScore = +store.get('orbitSnap.best') || 0, tutSeen = store.get('orbitSnap.tut') === '1';
  // ---------- shop: coins, owned cosmetics ('th:<id>' / 'sk:<id>'), equipped theme + skin ----------
  const Q = new URLSearchParams(location.search);
  let coins = +store.get('orbitSnap.coins') || 0, earned = 0, owned;
  try { owned = new Set(JSON.parse(store.get('orbitSnap.own') || '[]')); } catch (e) { owned = new Set(); }
  owned.add('th:sugar'); owned.add('sk:gum');
  if (Q.has('coins')) coins = Math.max(0, +Q.get('coins') || 0); // designer shortcut: ?coins=999
  const pick = (list, kind, id) => list.find(i => i.id === id && owned.has(kind + i.id)) || list[0];
  let T = pick(THEMES, 'th:', store.get('orbitSnap.theme')), S = pick(SKINS, 'sk:', store.get('orbitSnap.skin'));
  // ?theme=neon&skin=fire previews a look without owning it (handy for demo recordings).

  // The equipped ball (or `sk`), stretched along its velocity while flying. `fire` (fireK) puts the skin's

      cx.fillStyle = C.cream; cx.fillRect(lx - 6, ly - 2, 12, 9);
    }
    if (kind === 'sk' && it.match && it.match === T.id) { // designed for the current theme
      rrect(px + 4, py + 4, 46, 16, 8); cx.fillStyle = C.gold; cx.fill(); cx.lineWidth = 1.5; cx.strokeStyle = C.ink; cx.stroke();
      cx.textAlign = 'center'; cx.textBaseline = 'middle'; txt('MATCH', px + 27, py + 12.5, 10, C.ink); cx.textBaseline = 'alphabetic';
    }
    cx.textAlign = 'center';
    txt(it.name, x + w / 2, y + h - 26, 14, C.text, null, w - 12);
    if (eq) txt('EQUIPPED', x + w / 2, y + h - 9, 12, C.goldDk, null, w - 12);
    else if (own) txt('TAP TO EQUIP', x + w / 2, y + h - 9, 12, C.mintDk, null, w - 12);
    else {
      cx.font = font(14); const tw = cx.measureText(String(it.price)).width, cxm = x + w / 2 + 8;
      coinIcon(cxm - tw / 2 - 12, y + h - 14, 6.5);
      txt(String(it.price), cxm, y + h - 9, 14, afford ? C.pinkDk : '#A58BA0');
    }
    cx.restore();
    btns.push({ id: key, x, y, w, h });
  }
  function drawStore() {
    cx.fillStyle = 'rgba(30,8,50,.55)'; cx.fillRect(0, 0, W, H);
    cx.textAlign = 'center';
    txt('SWEET SHOP', W / 2, 50, 34, C.pink, C.ink, W - 40);
    coinPill(W / 2, 82);
    const th = storeTab === 'themes', tw = Math.min(140, (W - 40) / 2);
    button('tab:themes', 'THEMES', W / 2 - tw / 2 - 5, 124, tw, 36, th ? C.pink : C.violet, th ? C.pinkDk : C.violetDk);
    button('tab:balls', 'BALLS', W / 2 + tw / 2 + 5, 124, tw, 36, th ? C.violet : C.pink, th ? C.violetDk : C.pinkDk);
    const items = shopItems().filter(([k]) => k.startsWith(th ? 'th:' : 'sk:'));
    const cols = th ? 2 : 3, rows = Math.ceil(items.length / cols), gap = 10, top = 160, avail = H - top - 116;
    const gw = Math.min(W - 24, th ? 420 : 460), cw = (gw - gap * (cols - 1)) / cols;
    const ch = Math.max(84, Math.min(cw * (th ? 1.0 : 1.2), (avail - gap * (rows - 1)) / rows));
    const gx = (W - gw) / 2;
    items.forEach(([k, it], i) => shopCard(k, it, gx + (i % cols) * (cw + gap), top + Math.floor(i / cols) * (ch + gap), cw, ch));
    button('back', 'BACK', W / 2, H - 40, 150, 42, C.mint, C.mintDk);
    drawParts(uiParts);
    if (toast) {
      cx.globalAlpha = Math.min(1, toast.life * 3);
      cx.font = font(16); const w = Math.min(W - 24, cx.measureText(toast.text).width + 36), y = H - 92;
      rrect(W / 2 - w / 2, y - 17, w, 34, 17); cx.fillStyle = 'rgba(42,15,58,.9)'; cx.fill(); cx.lineWidth = 2.5; cx.strokeStyle = C.ink; cx.stroke();
      cx.textBaseline = 'middle'; txt(toast.text, W / 2, y + 1, 16, toast.col, null, w - 20); cx.textBaseline = 'alphabetic';
      cx.globalAlpha = 1;
    }
  }

  // Tutorial pages: each has an animated little scene (tutArt) that loops.
  // Descriptions are functions so they use the equipped theme's and ball's names.
  const cap = s => s[0].toUpperCase() + s.slice(1);
  const TUT = [
    { t: 'Tap to launch', d: () => 'Your ' + S.noun + ' orbits the ' + T.w.ring + '. Tap and it shoots straight out from the ring. When the aim dots turn GOLD, you are lined up for a clean snap on the next ' + T.w.ring + '!' },
    { t: 'Hold to wind up', d: () => 'Hold and the ' + S.noun + ' grips the ring: it pulls back, then whips forward past where you pressed. Let go at any moment to fire from there.' },
    { t: 'Snap clean = combo', d: () => 'Hit the ' + T.w.ring + ' itself: every 3 clean snaps raise your multiplier (up to x8) and set your ' + S.noun + ' on fire! Grazing the dashed zone saves you but breaks the streak - fly past outside it and it\'s a miss. Double ' + T.w.ring + '? Hit a ' + T.w.arc + ' for BULLSEYE x2 - a gap breaks the streak.' },
    { t: 'Watch out!', d: () => 'Red ' + T.w.spikes + ' block you going in AND out. ' + cap(T.w.bomb) + ' slide on their tracks. ' + cap(T.w.crumble) + ' crumble soon after you land - leave fast! RED aim dots = that shot hits spikes or ' + T.w.bomb + ': wait for a gap. Skim past alive for a CLOSE!' },
    { t: 'Coins & shop', d: () => 'Every point you score is a coin. Spend them in the SHOP on new worlds (Neon Night, Deep Sea, Cosmic Drift) and ball skins - tap one you own to wear it.' },
  ];
  const tA = ring(0, 0, 28), tB = ring(0, 0, 26), tW = ring(0, 0, 36), tD = ring(0, 0, 40, 'double'), tS = ring(0, 0, 22, 'spike'), tC = ring(0, 0, 24, 'crumble'), tK = ring(0, 0, 34);
  tA.spin = tB.spin = tW.spin = 2.2; tD.inSpin = -2;
  function tutArt(p, ax, ay, aw, ah) {
    cx.save(); rrect(ax, ay, aw, ah, 16);
    const g = cx.createLinearGradient(0, ay, 0, ay + ah); g.addColorStop(0, T.sky[0][0]); g.addColorStop(1, T.sky[0][2]);
    cx.fillStyle = g; cx.fill(); cx.clip();
    cx.translate(ax + aw / 2, ay + ah / 2); cx.textAlign = 'center';
    const t = tutT;
    if (p === 0) { // orbit, tap, fly, land
      tA.x = -aw * 0.22; tA.y = 30; tB.x = aw * 0.2; tB.y = -24;
      const la = Math.atan2(tB.y - tA.y, tB.x - tA.x), ux = Math.cos(la), uy = Math.sin(la), ph = t % 2.6;
      tA.rot = tB.rot = clk * 2.2; tB.pulse = ph > 1.6 ? Math.max(0, 1 - (ph - 1.6) * 2) : 0;
      drawRing(tA, { cur: ph < 1.2 }); drawRing(tB, { next: ph < 1.6, cur: ph >= 1.6 });
      let gx, gy;
      if (ph < 1.2) { const a = la - (1.2 - ph) * 2.2; gx = tA.x + Math.cos(a) * tA.r; gy = tA.y + Math.sin(a) * tA.r; drawAim(gx, gy, a, 34, cleanLine(gx, gy, a, tB) ? C.gold : '#FFFFFF'); }
      else if (ph < 1.6) {
        const f = (ph - 1.2) / 0.4, x0 = tA.x + ux * tA.r, y0 = tA.y + uy * tA.r, x1 = tB.x - ux * tB.r, y1 = tB.y - uy * tB.r;
        gx = x0 + (x1 - x0) * f; gy = y0 + (y1 - y0) * f;
      } else { const a = la + Math.PI + (ph - 1.6) * 2.2; gx = tB.x + Math.cos(a) * tB.r; gy = tB.y + Math.sin(a) * tB.r; }
      drawBall(gx, gy, 8);
      if (ph > 1.0 && ph < 1.7) txt('TAP!', tA.x, tA.y - tA.r - 20, 20, C.gold, C.ink);
    } else if (p === 1) { // hold: pull back, whip forward, let go
      tW.x = -aw * 0.12; tW.y = 22; tW.rot = clk * 0.6;
      const ph = t % 2.4, a0 = -Math.PI / 2 - 0.2;
      drawRing(tW, { cur: true });
      let a = null, k = 0;
      if (ph < 0.5) a = a0 - (0.5 - ph) * 1.8;
      else if (ph < 1.45) {
        k = (ph - 0.5) / 0.95; a = a0 + WIND * windShape(k);
        cx.strokeStyle = 'rgba(255,210,63,.45)'; cx.lineWidth = 10; cx.lineCap = 'round';
        cx.beginPath(); cx.arc(tW.x, tW.y, tW.r, a0 + WIND * WIND_BACK, a0 + WIND); cx.stroke(); cx.lineCap = 'butt';
        cx.fillStyle = 'rgba(255,255,255,.5)'; cx.beginPath(); cx.arc(tW.x + Math.cos(a0) * tW.r, tW.y + Math.sin(a0) * tW.r, 4, 0, TAU); cx.fill();
        txt('HOLD...', tW.x + tW.r + 64, tW.y + 30, 18, C.gold, C.ink);
      }
      if (a !== null) {
        const gx = tW.x + Math.cos(a) * tW.r, gy = tW.y + Math.sin(a) * tW.r;
        drawAim(gx, gy, a, 30 + k * 60, '#FFFFFF');
        if (k) { cx.strokeStyle = C.gold; cx.lineWidth = 3.5; cx.beginPath(); cx.arc(gx, gy, 15, -Math.PI / 2, -Math.PI / 2 + TAU * k); cx.stroke(); }
        drawBall(gx, gy, 8 + k * 1.5);
      } else if (ph < 2.0) {
        const fa = a0 + WIND, d = tW.r + (ph - 1.45) * 380;
        drawBall(tW.x + Math.cos(fa) * d, tW.y + Math.sin(fa) * d, 8, Math.cos(fa) * 500, Math.sin(fa) * 500);
        txt('LET GO!', tW.x + tW.r + 64, tW.y + 30, 18, C.gum, C.ink);
      }
    } else if (p === 2) { // dive into the caramel for a bullseye
      tD.x = -aw * 0.16; tD.y = 14; tD.rot = clk * tD.spin;
      const ph = t % 2.2, land = 1.0;
      tD.inA = Math.PI / 2 - SLOT * SOLID / 2 + tD.inSpin * (ph - land);
      tD.pulse = ph > land ? Math.max(0, 1 - (ph - land) * 2) : 0;
      cx.strokeStyle = 'rgba(255,255,255,.4)'; cx.lineWidth = 1.5; cx.setLineDash([5, 7]);
      cx.beginPath(); cx.arc(tD.x, tD.y, tD.r + GRAB, 0, TAU); cx.stroke(); cx.setLineDash([]);
      drawRing(tD, { next: ph < land, cur: ph >= land, inner: ph >= land });
      const rx = aw * 0.27, got = Math.min(3, Math.floor((t % 3.2) / 0.8)), fire = got === 3 ? HYPE.fireMin : 0; // x2 = ball on fire
      if (ph >= 0.4 && ph < land) { const f = (ph - 0.4) / (land - 0.4), y0 = ah / 2 + 12, y1 = tD.y + tD.rin; drawBall(tD.x, y0 + (y1 - y0) * f, 8, 0, -500, undefined, null, fire); }
      else if (ph >= land) { const a = Math.PI / 2 + tD.inSpin * (ph - land); drawBall(tD.x + Math.cos(a) * tD.rin, tD.y + Math.sin(a) * tD.rin, 8, 0, 0, undefined, null, fire); }
      if (ph >= land && ph < 1.9) {
        const s = 1 + Math.max(0, 1 - (ph - land) * 5) * 0.6;
        cx.save(); cx.translate(tD.x, tD.y - tD.r - 14); cx.scale(s, s); txt('BULLSEYE x2', 0, 0, 16, C.gold, C.ink); cx.restore();
      }
      rrect(rx - 30, -26, 60, 28, 14); cx.fillStyle = got === 3 ? C.gold : 'rgba(255,255,255,.2)'; cx.fill();
      cx.strokeStyle = C.ink; cx.lineWidth = 2.5; cx.stroke();
      cx.textBaseline = 'middle'; txt(got === 3 ? 'x2' : 'x1', rx, -11, 17, got === 3 ? C.ink : '#FFFFFF', got === 3 ? null : C.ink); cx.textBaseline = 'alphabetic';
      for (let i = 0; i < 3; i++) { cx.fillStyle = i < got && got < 3 ? C.gold : 'rgba(255,255,255,.3)'; cx.beginPath(); cx.arc(rx + (i - 1) * 16, 18, 4.5, 0, TAU); cx.fill(); }
      txt('3 clean = combo', rx, 46, 12, '#FFFFFF', C.ink, aw * 0.4);
    } else if (p === 3) { // hazards line-up
      const xs = [-aw / 3, 0, aw / 3];
      tS.x = xs[0]; tS.y = -8; tS.spA = clk * 0.9; tS.rot = clk * 2;
      drawRing(tS, {});
      { // a ball orbiting under the spikes: its aim dots turn RED while they point into the shield
        const ba = -clk * 1.6, bx = tS.x + Math.cos(ba) * tS.r, by = tS.y + Math.sin(ba) * tS.r, red = inShield(tS, ba, SPIKE_PAD);
        drawAim(bx, by, ba, 30, red ? C.red : '#FFFFFF', red); drawBall(bx, by, 7);
      }
      drawTrack(xs[1], -8, Math.min(34, aw / 7)); drawMine(xs[1] + Math.sin(clk * 2) * Math.min(34, aw / 7), -8, 1);
      const k = (t % 2.4) / 2.4; tC.x = xs[2]; tC.y = -8; tC.t = CRUMBLE_T * (1 - k); tC.rot = clk * 1.5;
      drawRing(tC, { cur: true, worn: k });
      [['SPIKES', C.red], [T.w.bombTag, '#FF7AA8'], [T.w.crumbleOne, '#FFD9A0']].forEach(([l, c], i) => txt(l, xs[i], 56, 13, c, C.ink, aw / 3 - 8));
    } else { // coins pour in, then the ball cycles through skins
      const ph = t % 3;
      for (let i = 0; i < 5; i++) {
        const f = Math.min(1, Math.max(0, (ph - i * 0.15) / 0.5)), x = -aw * 0.3 + i * 13, y = -40 + f * 60 - Math.sin(f * Math.PI) * 30;
        if (f > 0) coinIcon(x, y, 8);
      }
      txt('+' + Math.min(5, Math.floor(ph / 0.15)), -aw * 0.3 + 26, 48, 16, C.gold, C.ink);
      const sk = SKINS[Math.floor(tutT / 0.9) % SKINS.length], bx = aw * 0.18;
      tK.x = bx; tK.y = 0; tK.rot = clk;
      drawRing(tK, { cur: true });
      const a = clk * 2.2; drawBall(bx + Math.cos(a) * tK.r, Math.sin(a) * tK.r, 10, 0, 0, a, sk);
      txt(sk.name, bx, 56, 13, '#FFFFFF', C.ink, aw * 0.45);
    }
    cx.restore();
  }
  function drawTut() {
    cx.fillStyle = 'rgba(30,8,50,.55)'; cx.fillRect(0, 0, W, H);
    const P = TUT[tutPage], cw = Math.min(W - 28, 400), pad = 18, artH = 150;
    const lines = wrap(P.d(), cw - pad * 2, 15), ch = 64 + artH + 14 + lines.length * 21 + 78;
    const x0 = (W - cw) / 2, y0 = Math.max(60, (H - ch) / 2), k = 0.85 + 0.15 * easeOutBack(Math.min(1, tutT * 4));
    cx.save(); cx.translate(W / 2, y0 + ch / 2); cx.scale(k, k); cx.translate(-W / 2, -(y0 + ch / 2));
    rrect(x0, y0 + 8, cw, ch, 24); cx.fillStyle = 'rgba(20,0,30,.35)'; cx.fill();
    rrect(x0, y0, cw, ch, 24); cx.fillStyle = C.cream; cx.fill(); cx.lineWidth = 4; cx.strokeStyle = C.ink; cx.stroke();
    cx.textAlign = 'center';
    txt(P.t, W / 2, y0 + 44, 28, C.pink, C.ink, cw - 40);
    tutArt(tutPage, x0 + pad, y0 + 60, cw - pad * 2, artH);
    cx.textAlign = 'center'; cx.fillStyle = C.text; cx.font = font(15, '600');
    lines.forEach((l, i) => cx.fillText(l, W / 2, y0 + 60 + artH + 30 + i * 21));
    for (let i = 0; i < TUT.length; i++) {
      cx.fillStyle = i === tutPage ? C.pink : '#E3C9D9';
      cx.beginPath(); cx.arc(W / 2 + (i - (TUT.length - 1) / 2) * 16, y0 + ch - 64, i === tutPage ? 5.5 : 4.5, 0, TAU); cx.fill();
    }
    button('next', tutPage < TUT.length - 1 ? 'NEXT' : "LET'S GO!", W / 2, y0 + ch - 32, 170, 42, C.pink, C.pinkDk, true);
    cx.restore();
    button('skip', 'SKIP', W - 56, 32, 84, 34, C.violet, C.violetDk);
  }
  function drawDead() {
    const a = Math.min(1, deadT * 3), k = easeOutBack(Math.min(1, deadT * 2.6));
    cx.fillStyle = 'rgba(30,8,50,' + 0.5 * a + ')'; cx.fillRect(0, 0, W, H);
    const cw = Math.min(W - 40, 330), ch = 226, x0 = (W - cw) / 2, y0 = H * 0.4 - ch / 2;
    cx.save(); cx.translate(W / 2, y0 + ch / 2); cx.scale(k, k); cx.translate(-W / 2, -(y0 + ch / 2));
    rrect(x0, y0 + 8, cw, ch, 24); cx.fillStyle = 'rgba(20,0,30,.35)'; cx.fill();
    rrect(x0, y0, cw, ch, 24); cx.fillStyle = C.cream; cx.fill(); cx.lineWidth = 4; cx.strokeStyle = C.ink; cx.stroke();
    rrect(x0 + 24, y0 - 24, cw - 48, 48, 22); cx.fillStyle = C.red; cx.fill(); cx.lineWidth = 3.5; cx.stroke();
    cx.textAlign = 'center';
    txt(T.w.crash, W / 2, y0 + 10, 26, '#FFFFFF', C.ink, cw - 70);
    txt(why, W / 2, y0 + 52, 16, '#A0306A', null, cw - 30);
    txt(String(score), W / 2, y0 + 118, 60, C.pink, C.ink);
    txt('BEST ' + hiScore + '   ·   STREAK ' + best, W / 2, y0 + 162, 15, C.text, null, cw - 30);
    { // coins earned this run (every point = 1 coin)
      const s = '+' + num(earned) + ' coins   (' + num(coins) + ')';
      cx.font = font(16); const tw = cx.measureText(s).width;
      coinIcon(W / 2 - tw / 2 - 4, y0 + 196, 8);
      txt(s, W / 2 + 10, y0 + 202, 16, C.goldDk, null, cw - 50);
    }
    if (newBest) {
      cx.save(); cx.translate(x0 + cw - 18, y0 + 80); cx.rotate(0.3 + Math.sin(clk * 6) * 0.08);
      cx.fillStyle = C.gold; cx.strokeStyle = C.ink; cx.lineWidth = 3;
      cx.beginPath(); for (let i = 0; i < 20; i++) { const r = i % 2 ? 26 : 36, t = i * TAU / 20; i ? cx.lineTo(Math.cos(t) * r, Math.sin(t) * r) : cx.moveTo(r, 0); }
      cx.closePath(); cx.fill(); cx.stroke();
      txt('NEW', 0, -3, 13, C.ink); txt('BEST!', 0, 12, 13, C.ink);
      cx.restore();
    }
    cx.restore();
    if (deadT > 0.25) {
      button('retry', 'TAP TO RETRY', W / 2, y0 + ch + 48, 210, 50, C.mint, C.mintDk, true);
      shopButton(W / 2, y0 + ch + 106, 150, 40);
    }
  }

  function loop(t) {
    const ms = t - last, dt = Math.min(0.033, ms / 1000); last = t;
    if (ms < 250) { // adaptive resolution (see PERF); long gaps (a hidden tab) don't count
      frameMs += (ms - frameMs) * 0.05;
      if (frameMs > PERF.slowMs && dpr > 1) { dprCap = Math.max(1, dpr - 0.5); frameMs = 16.7; resize(); }
    }
    try {
      if (freeze > 0) { freeze -= dt; step(dt * 0.05); } else step(dt * (state === 'play' && spark.miss ? MISS.slow : 1));
      draw();
      sfx.whine(charge && state === 'play' ? windK() : 0);
    } catch (err) { cx.fillStyle = '#FF5A6E'; cx.font = '14px monospace'; cx.textAlign = 'left'; cx.fillText('Error: ' + err.message, 10, 20); return; }
    requestAnimationFrame(loop);
  }
  reset(); if (!DEMO) state = 'title';
  requestAnimationFrame(loop);
})();
