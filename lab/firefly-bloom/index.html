// ============================================ WFX: the waterfall effect (portable) ============================================

// a toroidal cell web (tiles both ways): a jittered-grid Voronoi with a smooth-min border distance (rounded cells, soft junction swell)
function cellWeb(NX,NY,GX,GY,seed,lw,glo,sk){const c=mk(NX,NY),x=c.getContext('2d'),img=x.createImageData(NX,NY),csx=NX/GX,csy=NY/GY,P=[],ds=[];
  for(let j=0;j<GY;j++)for(let i=0;i<GX;i++){const q=i*7+j*13+seed;P.push([(i+0.15+hash(q+700)*0.7)*csx,(j+0.15+hash(q+800)*0.7)*csy,hash(q+900)]);}
  for(let y=0;y<NY;y++){const cj=Math.floor(y/csy);for(let X=0;X<NX;X++){const ci=Math.floor(X/csx);let d1=1e9,b1=0,n=0;

    for(let oj=-1;oj<=1;oj++)for(let oi=-1;oi<=1;oi++){const bi=gi+oi,bj=gj+oj;if(bi<0||bj<0||bi>=G||bj>=G)continue;for(const p of B[bj*G+bi]){const d=Math.hypot(X-p[0],y-p[1]);ds[n++]=d;ds[n++]=p[2];if(d<d1){d1=d;b1=p[2];}}}

  T.WEB_OUT=discWeb(224,9,15,8,1.5,0.9,0.8,0.65);                          // the outer disc: small dim cells, zoomed slowly

  T.RIB_A=bake(TW,THA*2,x=>{
    for(let i=0;i<12;i++){const h=k=>hash(i*19+k+600);const cx=h(0)*TW,y0=h(1)*THA,len=50+h(2)*40,hw=3+h(3)*4,curve=0.2+h(4)*0.5,ph=h(5)*TAU;

    for(let i=0;i<12;i++){const h=k=>hash(i*11+k+900);const cx=h(0)*TW,y0=h(1)*THA,len=40+h(2)*40,hw=2+h(3)*3,curve=0.2+h(4)*0.6,ph=h(5)*TAU;

// baked as NF variants (noise offsets around a circle) with anti-aliased outlines and tone boundaries. Three tones, no pure white: the highlight

// its back fading into the dark bank, rounded front corners curving down into the sheet's edges; the squashed cells scroll inside it; ONE crest line along

    g=x.createLinearGradient(cxl-hb,0,cxl+hb,0);for(const [p,a] of [[0,0.08],[0.15,0.55],[0.35,0.78],[0.55,0.6],[0.8,0.3],[1,0.06]])g.addColorStop(p,C(228,248,255,a));
    x.strokeStyle=g;x.lineWidth=1.1;x.lineCap='round';x.beginPath();back(x,0,0.4);x.stroke();});                                  // THE crest line: the outer edge
  const UH=6,UNDER=bake(SW,UH,x=>{let g=x.createLinearGradient(0,0,0,UH);g.addColorStop(0,'rgba(12,36,88,0.18)');g.addColorStop(0.4,'rgba(12,36,88,0.06)');g.addColorStop(1,'rgba(12,36,88,0)');x.fillStyle=g;
    x.beginPath();x.moveTo(cxl-hf,0);for(let i=0;i<=n;i++){const u=i/n;x.lineTo(cxl-hf+2*hf*u,bow*0.5*Math.sin(Math.PI*u)*0.6);}x.lineTo(cxl+hf,UH);x.lineTo(cxl-hf,UH);x.closePath();x.fill();
    x.globalCompositeOperation='destination-in';g=x.createLinearGradient(cxl-hf,0,cxl+hf,0);for(const [p,a] of [[0,0.15],[0.1,1],[0.9,1],[1,0.15]])g.addColorStop(p,C(0,0,0,a));x.fillStyle=g;x.fillRect(0,0,SW,UH);});
  const RH=7,ROLL=bake(SW,RH,x=>{let g=x.createLinearGradient(0,0,0,RH);g.addColorStop(0,'rgba(120,210,240,0)');g.addColorStop(0.35,'rgba(200,242,255,0.75)');
    g.addColorStop(0.55,'rgba(236,250,255,0.9)');g.addColorStop(1,'rgba(90,190,235,0)');x.fillStyle=g;x.fillRect(cxl-hf,0,2*hf,RH);
    x.globalCompositeOperation='destination-in';g=x.createLinearGradient(cxl-hf,0,cxl+hf,0);for(const [p,a] of [[0,0.35],[0.08,0.8],[0.3,1],[0.7,0.85],[0.92,0.5],[1,0.2]])g.addColorStop(p,C(0,0,0,a));x.fillStyle=g;x.fillRect(0,0,SW,RH);});   // lit from the top-left
  return {LT,E,SW,UH,RH,hf,hb,TOPW,LIPF,UNDER,ROLL,face};}
function forWidth(w,Hs){const wq=Math.max(24,Math.round(w/3)*3),hq=Math.round(Hs/4)*4,key=wq+'|'+hq;let b=WB.get(key);
  if(!b){const FW=1.24*wq,HC=Math.min(0.09*FW,0.11*hq),HF=Math.min(0.08*FW,0.09*hq),t0=performance.now();b={wq,FW,HC,HF,clumps:CLUMPS.map(c=>bakeClump(FW,HC,HF,c)),lip:bakeLip(wq),ms:performance.now()-t0};WB.set(key,b);}return b;}

// ---------------- per-stream state ----------------
const st=i=>ST[i]||(ST[i]={spray:[],geo:null});
const FL=v=>0.04*v*v-0.007*Math.sin(v*Math.PI);                                                  // the silhouette: a slight waist then a 4% flare per side
const edges=(x0,w,v,t)=>{const s=Math.sin(t*1.7+v*2.4)*0.6*Math.min(1,v*3);return [x0-w*FL(v)+s,x0+w+w*FL(v)+s*0.7];};
const spikeN=w=>w>=70?4:3;
// spike j of a stream at time t: its own 0.25-0.4 s rise/collapse, re-seeded at zero height; rooted where the sheet enters the crown, leaning outward
function spike(g,j,t){const N=spikeN(g.w),h=k=>hash(j*7+k+31000+g.i*977);const per=0.25+h(1)*0.15,q=t/per+h(2),cyc=Math.floor(q),ph=q%1,pulse=Math.pow(Math.sin(ph*Math.PI),0.8);
  const hc=k=>hash(cyc*13+j*7+k+32000+g.i*977);const s=(j%2?1:-1)*(0.15+0.75*((j>>1)+0.5)/Math.ceil(N/2))+(hc(0)-0.5)*0.3,hh=g.hmax*(0.45+0.55*hc(1))*pulse,bw=(0.45+0.008*g.w)*(0.7+0.5*hc(2))*(0.6+0.4*pulse);
  const bx=g.cx+s*g.FW*0.2,by=g.cy-g.HC*(0.8-0.3*s*s),dir=s+(hc(3)-0.5)*0.5,lean=hh*dir*0.5;return {bx,by,bw,hh,dir,lean,tx:bx+lean,ty:by-hh,ph,hc};}
function launch(s,g,x,y,vx,vy,life){s.spray.push({x,y,vx,vy,age:0,life,sz:rnd(0.8,1.3)});}
// step: the shared clock, then every stream's spray: launched from the foam crown (and the spikes' tips near their peaks) in parabolic arcs biased
// sideways and forward, 30% low and long; killed when they land on the pool, stray, rise too high or would hover beside the wall
function step(dt){dt=dt>0?dt:0;clock+=dt;for(const s of ST){if(!s||!s.geo)continue;const g=s.geo,w=g.w;
  const rate=(22+0.26*w)*g.k*dt;for(let k=0;k<rate;k++)if(k+1<=rate||Math.random()<rate-k){const sg=Math.random()<0.5?-1:1,q=sg*(0.35+0.65*Math.random()),x=g.cx+q*g.FW*0.18,y=g.cy-g.HC*(0.95-0.35*q*q);
    if(Math.random()<0.3)launch(s,g,x,y,sg*(90+1.0*w)*rnd(0.8,1.25),-(25+0.3*w)*rnd(0.5,1.2),rnd(0.14,0.24));
    else launch(s,g,x,y,q*(90+1.1*w)+rnd(-14,14),-(80+0.85*w)-Math.random()*(0.55*w),rnd(0.17,0.28));}
  const N=spikeN(w);for(let j=0;j<N;j++){const p=spike(g,j,clock);if(p.ph>0.42&&p.ph<0.56&&p.hc(4)>0.3&&Math.random()<0.45)launch(s,g,p.tx,p.ty,p.dir*(40+0.5*w)+rnd(-10,10),-(30+0.4*w)-Math.random()*(20+0.3*w),rnd(0.14,0.22));}
  const ymin=g.cy-g.Hs*0.28,xmax=g.FW*0.78,xw=w/2+g.FW*0.28,yland=g.cy+g.HF+4,sp=s.spray;
  for(let i=sp.length-1;i>=0;i--){const d=sp[i];d.age+=dt;d.x+=d.vx*dt;d.vy+=1500*dt;d.y+=d.vy*dt;const ax=Math.abs(d.x-g.cx);if(d.age>d.life||d.y<ymin||ax>xmax||d.y>yland||(d.y<g.cy-3&&ax>xw))sp.splice(i,1);}}}

// ---------------- draw ----------------
const FA=0.8,F=u=>(u+FA*u*u)/(1+FA);                                                              // flow map: texture fraction -> sheet fraction (accelerating)
const RA=106,RRA=80,RB=156,RRB=80;                                                               // layer rates (texture rows / s) over the rows spanning the sheet
function sheetPath(g,x0,w,top,Hs,t){const b=top+Hs,NV=8;g.beginPath();
  for(let i=0;i<=NV;i++){const v=i/NV,e=edges(x0,w,v,t),y=top+Hs*v;i?g.lineTo(e[0],y):g.moveTo(e[0],y);}
  const e1=edges(x0,w,1,t);g.lineTo(e1[0],b-3);g.quadraticCurveTo((e1[0]+e1[1])/2,b+1,e1[1],b-3);
  for(let i=NV;i>=0;i--){const v=i/NV,e=edges(x0,w,v,t),y=top+Hs*v;g.lineTo(e[1],y);}g.closePath();}
// a flow layer: texture rows o..o+R mapped onto the sheet through F in NS slices sharing boundary rows; ramp scales the alpha over u0..u1; xfn gives a
// slice's x from its sheet fraction (the rims follow the edges); tsc widens the texture window for narrow falls
function flowLayer(g,TEX,TH,x0,w,rate,R,alpha,drift,seed,NS,xfn,u0,u1,ramp,oy,top,Hs,t,flare,tsc){
  const ws=w*(tsc||1),o=((-t*rate-seed*TH)%TH+TH)%TH,sx=(TEX.width/z-ws)/2+Math.sin(t*1.2+seed)*drift;let pu=u0,pv=F(u0),py=top+Hs*pv+oy,pr=o+u0*R;g.globalAlpha=alpha;
  for(let i=1;i<=NS;i++){const u=u0+(u1-u0)*i/NS,r=o+u*R,v=F(u),y=top+Hs*v+oy,vm=(v+pv)/2,ww=w*(1+flare*vm),xx=xfn?xfn(vm):x0-(ww-w)/2;
    if(ramp)g.globalAlpha=alpha*(ramp[0]+(ramp[1]-ramp[0])*((u+pu)/2-u0)/(u1-u0));g.drawImage(TEX,sx*z,pr*z,ws*z,(r-pr)*z,xx,py,ww,y-py);py=y;pr=r;pv=v;pu=u;}}
function drawSheet(g,gm,B,t){const {w,x0,top,Hs,k,i}=gm,ka=0.6+0.4*k,L=B.lip,ls=w/B.wq,tsc=Math.min(1.4,Math.max(1,Math.pow(70/w,0.4)));
  g.globalAlpha=0.95;g.drawImage(T.SHADOWB,x0-w*0.25,top-4,w*2.3,Hs+4);
  g.save();sheetPath(g,x0,w,top,Hs,t);g.clip();g.globalAlpha=1;
  g.drawImage(T.CORE,x0-w*0.08,top,w*1.16,Hs);
  flowLayer(g,T.RIB_A,THA,x0-w*0.1,w*1.2,RA,RRA,0.92*ka,2,0.3+i*0.37,5,null,0,1,[0.7,1],0,top,Hs,t,0,tsc);
  flowLayer(g,T.RIB_B,THB,x0-w*0.1,w*1.2,RB,RRB,0.95*ka,1.2,0.7+i*0.53,5,null,0,1,[0.6,1],0,top,Hs,t,0,tsc);
  flowLayer(g,T.RIM,THB,0,8,RB,RRB,1,0,0.5+i*0.2,3,v=>edges(x0,w,v,t)[0]-3,0,1,null,0,top,Hs,t,0);        // the lit left rim: streaks with gaps
  flowLayer(g,T.RIMR,THB,0,8,RB,RRB,0.5,0,0.9+i*0.2,3,v=>edges(x0,w,v,t)[1]-5,0,1,null,0,top,Hs,t,0);     // the cooler right rim
  // the aeration: WHT strands scrolled through the flow map over the lowest ~25%, faded in by the RAMP wedges (destination-in) in the scratch, then blitted
  const u0=0.79,wy0=top+Hs*F(u0),wh=top+Hs+1-wy0,ww=w*1.3,scr=T.scr;scr.setTransform(z,0,0,z,0,0);scr.globalCompositeOperation='source-over';scr.clearRect(0,0,ww+1,wh+1);
  flowLayer(scr,T.WHT,THB,0,ww,RB,RRB,1*ka,1,0.35+i*0.3,2,null,u0,1,null,-wy0,top,Hs,t,0,tsc);scr.globalAlpha=0.52*ka;scr.fillStyle='#e4f6ff';scr.fillRect(0,0,ww,wh);
  const nb=Math.max(2,Math.min(5,Math.round(w/17))),bwd=192/5*z;                                                           // narrow falls get fewer, wider wedges (never teeth)
  scr.globalCompositeOperation='destination-in';scr.globalAlpha=1;scr.drawImage(T.RAMP,(5-nb)/2*bwd,0,nb*bwd,96*z,0,0,ww,wh);
  g.globalAlpha=1;g.drawImage(T.SCR,0,0,ww*z,wh*z,x0-w*0.15,wy0,ww,wh);
  g.globalCompositeOperation='multiply';g.drawImage(L.UNDER,x0-L.E*ls,top-0.5,L.SW*ls,L.UH);g.globalCompositeOperation='source-over';   // the curl's dark underside over the first rows
  g.restore();g.globalAlpha=1;
  // the lip: the cap (with its crest line), then the squashed cells rushing toward the crest in two perspective slices clipped to the cap
  const {E,LT,SW,hf,hb}=L,ox=x0-E*ls,oy=top-LT,cxs=x0+w/2;
  g.drawImage(L.TOPW,ox,oy,SW*ls,LT+2);
  g.save();g.translate(ox,oy);g.scale(ls,1);L.face(g,0,0);g.restore();g.save();g.clip();g.globalAlpha=0.5*Math.min(1,w/56);
  const so=TBH-((t*16)%TBH),sh=[0,0.45,1],ht=[0,0.3,1];
  for(let q=0;q<2;q++){const y0=oy+LT*ht[q],y1=oy+LT*ht[q+1],ym=(ht[q]+ht[q+1])/2,wi=(2*hb+(2*hf-2*hb)*ym)*ls;g.drawImage(T.CHAN,(TW-B.wq-2)/2*z,(so+TBH*sh[q])*z,(B.wq+2)*z,TBH*(sh[q+1]-sh[q])*z,cxs-wi/2,y0,wi,y1-y0+1);}
  g.restore();g.globalAlpha=1;g.drawImage(L.LIPF,ox,oy,SW*ls,LT+2);
  g.globalAlpha=0.8+0.12*Math.sin(t*5.3+i);g.drawImage(L.ROLL,ox,top-L.RH*0.55,SW*ls,L.RH);g.globalAlpha=1;}   // the roll over the edge joins the cap to the fall
// the pool: the impact web (2 copies zooming fast, masked to the inner zone) over the outer web (3 copies zooming slowly, masked to the annulus), both in
// scratches, blitted 'lighter' over the half-disc glow: cells flow outward at ~1 px/frame under the impact, larger and brighter there than at the rim
function drawPool(g,gm,t){const {w,cx,cy,i}=gm,prx=1.15*w+8,s=prx/PRX,ph1=(PRY+6)*s,cyy=cy-3*s,pw=Math.ceil(prx*2*z),ph=Math.ceil(ph1*z),sq=PRY/PRX,scr=T.scr,sc2=T.scr2;
  const web=(X,TEX,r,a,dy)=>{const N=TEX.width;X.globalAlpha=a;X.drawImage(TEX,0,N/2-8,N,N/2+8,prx-r,3*s+dy-16*r/N*sq,2*r,(r+16*r/N)*sq);};
  sc2.setTransform(z,0,0,z,0,0);sc2.globalCompositeOperation='source-over';sc2.clearRect(0,0,prx*2+2,ph1+2);
  for(let k=0;k<3;k++){const u=(t/1.6+k/3+i*0.17)%1;web(sc2,T.WEB_OUT,prx*1.02*(1+0.55*u),Math.sin(u*Math.PI)*0.7,0);}
  sc2.globalCompositeOperation='destination-in';sc2.globalAlpha=1;sc2.drawImage(T.MASK_OUT,0,0,prx*2,ph1);
  scr.setTransform(z,0,0,z,0,0);scr.globalCompositeOperation='source-over';scr.globalAlpha=1;scr.clearRect(0,0,prx*2+2,ph1+2);
  for(let k=0;k<2;k++){const u=(t/0.85+k/2+i*0.29)%1;web(scr,T.WEB_IN,prx*0.5*(1+1.6*u),Math.sin(u*Math.PI)*0.85,0.16*prx*u);}   // the impact web zooms AND drifts forward: ~1 px/frame under the impact despite the view's squash
  scr.globalCompositeOperation='destination-in';scr.globalAlpha=1;scr.drawImage(T.MASK_IN,0,0,prx*2,ph1);
  scr.globalCompositeOperation='destination-over';scr.drawImage(T.SCR2,0,0,pw,ph,0,0,prx*2,ph1);
  g.globalAlpha=0.86+0.04*Math.sin(t*2.6);g.drawImage(T.POOL,cx-prx,cyy,prx*2,ph1);
  g.globalCompositeOperation='lighter';g.globalAlpha=0.42;g.drawImage(T.SCR,0,0,pw,ph,cx-prx,cyy,prx*2,ph1);
  g.globalCompositeOperation='source-over';g.globalAlpha=1;}
// rings: at most two, born at the foam's edge, expanding over 1.5 s while fading to nothing by ~0.8 of the pool radius; plus the bow wave hugging the foam
function drawRings(g,gm,t){const {w,cx,cy,FW,i}=gm,prx=1.15*w+8,NR=w>=48?2:1;for(let k=0;k<NR;k++){const u=(t/1.5+k/NR+i*0.41)%1,r=FW*0.44+u*(prx*0.82-FW*0.44),ry=r*0.44;
    g.globalAlpha=0.42*Math.pow(1-u,1.3)*sst(0,0.06,u);g.drawImage(T.ARC[k%2],cx-r-r*6/ARX,cy-5*ry/ARY,2*r+r*12/ARX,ry+14*ry/ARY);}g.globalAlpha=1;
  g.beginPath();for(let q=0;q<=18;q++){const a=Math.PI*(0.1+0.8*q/18),rr=FW*0.5*(1+0.04*Math.sin(a*7+t*2.5)+0.03*Math.sin(a*13-t*3.1));const X=cx+Math.cos(a)*rr,Y=cy+2+Math.sin(a)*rr*0.2;q?g.lineTo(X,Y):g.moveTo(X,Y);}
  g.strokeStyle='rgba(225,247,255,0.4)';g.lineWidth=1+w*0.012;g.lineCap='round';g.stroke();}
// the foam: variant n and n+1 crossfaded within each ~8 fps step (B in over the first half, A out over the second: the overlap is always opaque), each
// clump on its own step period, a smooth 1-2 px wobble and its own slow horizontal breathing (+-4%: 6-10 px at w=84) so the silhouette morphs, never pops
const FP=[0.13,0.118],BP=[1.7,1.3];
function drawClump(g,c,gm,t,B){const cl=B.clumps[c],q=t/FP[c]+gm.i*1.7+c*2.3,n=Math.floor(q),f=q%1,fs=gm.w/B.wq,na=((n%NF)+NF)%NF,nb=(na+1)%NF;
  const bs=1+0.04*Math.sin(t*TAU/BP[c]+c*2.1+gm.i),jx=1.1*Math.sin(t*8.3+c*2+gm.i*0.7)+0.6*Math.sin(t*13.1+c),jy=0.7*Math.sin(t*10.7+c*3+gm.i);
  const SW=cl.SW*fs*bs,SH=cl.SH,X=gm.cx+jx-cl.ex*fs*bs,Y=gm.cy+jy-cl.ey;
  g.globalAlpha=Math.min(1,2*(1-f));g.drawImage(cl.frames[na],X,Y,SW,SH);g.globalAlpha=Math.min(1,2*f);g.drawImage(cl.frames[nb],X,Y,SW,SH);g.globalAlpha=1;}
function drawSpikes(g,gm,t){const N=spikeN(gm.w);for(let j=0;j<N;j++){const p=spike(gm,j,t);if(p.hh<0.8)continue;
    g.save();g.translate(p.bx,p.by);g.transform(1,0,-p.lean/p.hh,1,0,0);g.drawImage(T.SPIKE,-p.bw,-p.hh,2*p.bw,p.hh);g.restore();}}
function drawFoot(g,gm,t,B,s){const {w,cx,cy,FW}=gm;
  drawSpikes(g,gm,t);drawClump(g,1,gm,t,B);                                                    // the tongues rise from inside the crown: their bases are hidden by it
  g.globalCompositeOperation='lighter';g.globalAlpha=0.1;g.drawImage(T.MIST,cx-FW*0.65,cy-FW*0.04,FW*1.3,FW*0.22);g.globalCompositeOperation='source-over';
  // spray: tapered drops with a thin tail, 3-5 px long, brightest young
  for(const [lo,hi,al] of [[0,0.5,0.95],[0.5,1.01,0.65]]){g.globalAlpha=al;g.fillStyle='#e8f8ff';g.beginPath();
    for(const d of s.spray){const f=d.age/d.life;if(f<lo||f>=hi)continue;const r=(0.85+w*0.006)*d.sz*(1-0.2*f),sp=Math.hypot(d.vx,d.vy)||1,ux=d.vx/sp,uy=d.vy/sp,Ln=r*(1.5+sp/320);
      const hx=d.x+ux*Ln*0.5,hy=d.y+uy*Ln*0.5,tx=d.x-ux*Ln,ty=d.y-uy*Ln,nx=-uy*r,ny=ux*r;
      g.moveTo(tx,ty);g.quadraticCurveTo(hx+nx*1.1,hy+ny*1.1,hx+ux*r*0.9,hy+uy*r*0.9);g.quadraticCurveTo(hx-nx*1.1,hy-ny*1.1,tx,ty);}
    g.fill();}
  g.globalAlpha=1;}
function draw(ctx,o){const i=o.i|0,k=o.k==null?1:c01(o.k),w=o.w*(0.5+0.5*k),x0=o.x-w/2,Hs=o.bottom+4-o.top,cy=o.bottom+2,B=forWidth(w,Hs),s=st(i),fs=w/B.wq;
  const gm=s.geo={i,w,x0,cx:o.x,cy,top:o.top,Hs,k,FW:B.FW*fs,HC:B.HC,HF:B.HF,hmax:Math.min(0.15*Hs,0.09*B.FW*fs,1.25*B.HC)};
  ctx.save();drawPool(ctx,gm,clock);drawRings(ctx,gm,clock);drawClump(ctx,0,gm,clock,B);drawSheet(ctx,gm,B,clock);drawFoot(ctx,gm,clock,B,s);ctx.restore();}
return {init,step,draw,prebake:(ws,Hs)=>ws.forEach(w=>forWidth(w,Hs)),_T:T,_WB:WB};
})();
</script>
<script>
(function(){

// ---------- layout ----------

const CRX=288,CRY=40;                         // chain readout, right of the glow counter

  x.setTransform(k,0,0,k,0,0);x.font=f;x.textAlign='left';x.textBaseline='middle';x.fillStyle='rgba(2,7,16,0.78)';

function sndUpdate(dt){

  if(up)auT.up=0.1;                               // (the levels are set ten times a second, each gliding to its new value)
  for(let i=0;i<STREAMS.length;i++){              // the rush: in as the water bursts over its lip (fading in over R.fade s), with its flow, gone when frozen
    const f=w.on[i]&&w.o[i]>=FALLS.pre?w.f[i]:0;let b=auBeds[i];
    if(!b){if(f<=0||th<=0)continue;b=auBeds[i]=bedMake(i);}
    if((b.lc-=dt)<=0){b.lc=rnd(R.lfo[1],R.lfo[2]);b.lt=1+rnd(-R.lfo[0],R.lfo[0]);b.st=1+rnd(-2,2)*R.lfo[0];}
    b.lf+=(b.lt-b.lf)*Math.min(1,dt*0.8);b.sf+=(b.st-b.sf)*Math.min(1,dt*1.5);
    const tv=f>0?R.vol*Math.sqrt(f)*th*b.lf:0;

      const s=STREAMS[i],ww=s.w*s.sg[0].w*Math.max(f,0.3),hz=lerp(R.lp[0],R.lp[1],clamp((ww-R.lpW[0])/(R.lpW[1]-R.lpW[0]),0,1))*R.det[i];   // (a wider landing: a deeper rush)
      b.g.gain.setTargetAtTime(gv,t,0.08);b.sg.gain.setTargetAtTime(gv*R.sp[2]*b.sf*(1+R.flare*w.ff[i]),t,0.08);
      if(Math.abs(hz-b.hz)>b.hz*0.01){b.hz=hz;b.lp.frequency.setTargetAtTime(hz,t,0.3);}

  if(fm.on&&!fm.swapped)return;                   // the night's small sounds, each on its clock (the Full Moon's build-up holds its breath)
  if(N.bug&&(auT.bug-=dt)<=0){auT.bug=rnd(0.3,1.7)/N.bug;sChirp(N);}
  if(N.frog&&(auT.frog-=dt)<=0){auT.frog=rnd(0.5,1.5)/N.frog;sFrogFar();}

function setFF(p){const n=Math.min(p.v,THRESH);if(p.ff.length>n)p.ff.length=n;while(p.ff.length<n)p.ff.push({a:rnd(0,6.28),b:rnd(0,6.28),s1:rnd(.6,1.6),s2:rnd(.6,1.6),f:rnd(0,6.28),cd:0,back:0});}
const FQ={x:0,y:0};                               // scratch: a firefly's resting place (no allocation per firefly per frame)
function perch(f,l,fx,fy,U){                      // where firefly f rests on a lily of level l (its foot at fx, fy; U: its flower unit): on the bud or along the petals, crawling slowly
  const P=LILY.perch[l],a=f.a+0.35*Math.sin(clock*f.s1*0.3+f.f),rho=0.4+0.6*frac(f.b*0.3183);
  FQ.x=fx+Math.cos(a)*rho*P[1]*U;FQ.y=fy+(P[0]+Math.sin(a)*rho*P[2])*U-(0.5+0.5*Math.sin(clock*f.s2*1.3+f.b))*1.2;return FQ;
}
function ffPos(p,f){return perch(f,Math.min(4,Math.round(Math.log2(p.v))),p.x,p.y-LILY.by*p.dr,p.dr*LILY.u);}   // (read it at once: FQ is shared)

const catchV=p=>Math.max(1,prod(p.v)/Math.min(p.v,THRESH)*2.5*mults()*netMult(st.lv[3]))*(p.gold?FALLS.goldCatch:1);   // tap income stays proportional to passive income (a golden pod's pays more)

// tb: how much the falls' churn rocks it (0..1: it bobs harder). Its lily: pr the baked notch turn, rot / rv a small live turn and its speed,

function makePod(v,x,y){const p={v,x,y,vx:0,vy:0,r:podR(v),dr:podR(v),born:0,pop:0,id:++pid,busy:false,dead:false,burstT:-1,ff:[],wv:rnd(0.5,4),gold:false,fl:0,kr:null,tb:0,
  pr:Math.floor(Math.random()*LILY.rots),rot:rnd(-0.25,0.25),rv:0,sq:0,sv:0,sa:0,bk:0,bl:0,bu:1,mg:0,qx:0,qy:0,qs:1,qa:0,ql:0};setFF(p);pods.push(p);return p;}
const livePods=()=>pods.reduce((n,p)=>n+(p.dead?0:1),0);
function freeSpot(r,near,m){                     // open water (below the waterfall's wall); with `near`, prefer a spot beside that pod; m: keep this far in from the bed's edges
  let bestS=null,bs=-1e9;m=m||0;
  for(let i=0;i<24;i++){
    const x=rnd(BX0+r+m,BX1-r-m),y=rnd(POD_Y0+r+m,BY1-r-m);let md=1e9;
    for(const p of pods){if(p.dead)continue;const d=Math.hypot(p.x-x,p.y-y)-p.r;if(d<md)md=d;}
    const s=near?Math.min(md,r+14)-0.35*Math.hypot(near.x-x,near.y-y):md;
    if(s>bs){bs=s;bestS={x,y};}
  }
  return bestS;
}

// The glow both cost buys KOI levels at today's price (the rest comes back as glow), and at least the one koi that swam
function koiFromOld(b,k){
  const O=KOI.old;let g=0,l=0;
  for(let i=0;i<b;i++)g+=O[0]*Math.pow(O[1],i);
  for(let i=1;i<k;i++)g+=O[2]*Math.pow(O[3],i-1);
  const u=UPS[KOI_I];
  for(let c=u.base;l<u.max&&g>=c;c=u.base*Math.pow(u.g,l)){g-=c;l++;}
  st.glow+=g;return Math.max(k>0?1:0,l);
}

// and lv[6] the old WATERFALL: the glow its levels cost comes back
function fallFromOld(l){const O=FALLS.old;for(let i=0,n=clamp(l,0,O[2]);i<n;i++)st.glow+=O[0]*Math.pow(O[1],i);}

const makeTask=k=>{const T=TASKS[k];return {k,n:T.n[Math.min(st.moons,T.n.length-1)],p:0,done:false,pay:taskPay()};};
function rollTasks(){
  const prev=st.mt.map(t=>t.k),pool=[];
  for(let i=0;i<TASKS.length;i++)if(st.moons>=(TASKS[i].from||0))pool.push(i);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)),t=pool[i];pool[i]=pool[j];pool[j]=t;}
  pool.sort((a,b)=>prev.includes(a)-prev.includes(b));
  st.mt=pool.slice(0,3).map(makeTask);st.mtFx=[0,0,0];
}
function loadTasks(a){                            // a saved task list, or a fresh roll when it is missing or broken
  const L=[];
  if(Array.isArray(a)&&a.length===3)for(const t of a){
    if(!Array.isArray(t))break;const k=t[0]|0;if(k<0||k>=TASKS.length||L.some(x=>x.k===k))break;
    L.push({k,n:Math.max(1,t[1]|0),p:Math.max(0,t[2]|0),done:!!t[3],pay:Math.max(1,t[4]|0)});
  }
  if(L.length===3){st.mt=L;st.mtFx=[0,0,0];}else rollTasks();
}
function taskHit(id,v){                           // an event moved a task: a running count (+v) or the best reached at once (v)
  if(dir.chill||dir.cur&&dir.cur.peak==='task'&&id!=='hand')return;   // demo director: only the staged task may finish during its scene (none in the CHILL scene)
  for(let i=0;i<st.mt.length;i++){
    const t=st.mt[i],T=TASKS[t.k];if(t.done||T.id!==id)continue;
    const p=T.best?Math.max(t.p,v):t.p+v;if(p===t.p)continue;
    t.p=Math.min(p,t.n);if(t.p>=t.n)taskDone(i);
  }
}
function taskDone(i){                             // bonus Moon Petals burst from the HUD moon, which pops
  const t=st.mt[i];t.done=true;st.mtFx[i]=1;st.petals+=t.pay;st.petalsAll+=t.pay;

  sTask();if(!hit('task'))moment(2);
  save();
}

    st.owlT=4;                                    // the night owl glides in soon after (demoKit: only in the unstaged demo; the owl scene calls it itself)
  }else{

      st.glow=Math.max(0,+d.g||0);st.total=Math.max(st.glow,+d.tot||0);st.blooms=Math.max(0,d.b|0);

      st.moonG=d.mg!=null?Math.max(0,+d.mg||0):st.total;   // saves from before the Full Moon count all their glow
      if(Array.isArray(d.pk))for(let i=0;i<PERKS.length;i++)st.pk[i]=clamp(d.pk[i]|0,0,PERKS[i].max);

// ---------- Full Moon cinematic: build-up, the rise, the burst, the reset (about 6 s; a tap skips it after the first second, never in the demo) ----------
// stage lengths (s); the moon rises out of the horizon line hz to my (radius mr); the title sits at ty; the wave of light covers the old garden
// in the first `cover` share of the reset (the garden swaps under it), then parts from the pond's centre; lists are caps per quality level
const FMC={build:1.5,rise:1.85,burst:1.35,reset:1.4,skipAfter:1,hz:352,my:212,mr:86,ty:338,cover:0.36,shake:3.2,
  fly:[60,110,170],part:[100,170,250],sparks:[36,64,96],petals:[14,24,34],rain:[10,18,26],dust:[260,420,620],refl:[5,9,13],glint:[6,10,14]};
const FM_T=(()=>{const a=FMC.build,b=a+FMC.rise,c=b+FMC.burst;return {rise:a,burst:b,reset:c,swap:c+FMC.reset*FMC.cover,end:c+FMC.reset};})();
const PCX=180,PCY=PY0+PH/2;                        // the pond's centre: the new garden blooms out from here
const fm={on:false,t:0,n:0,no:0,name:'',prep:0,rose:false,boom:false,wash:false,swapped:false,dis:false,cx:0,cy:0,trem:0,my:0,glow:0,cnt:0,rain:0};
let FM_MOON=null,FM_TTL=null,fmK=0,DUST1=null,DUST2=null;
// pools, allocated once: the fireflies pulled into the spiral, and the sparks, Moon Petals and glints (k 0 / 1 / 2)
const FMF={a:[],n:0},FMP={a:[],n:0},FM_LIL=[];
for(let i=0;i<FMC.fly[2];i++)FMF.a.push({x0:0,y0:0,x:0,y:0,tx:0,ty:0,d:0,th:0,r0:0,r1:0,w:0,ab:0,s:1,a:1,back:false});
for(let i=0;i<FMC.part[2];i++)FMP.a.push({k:0,x:0,y:0,vx:0,vy:0,t:0,life:1,s:1,rot:0,vr:0,ph:0,img:null});
for(let i=0;i<8;i++)FM_LIL.push({x:0,y:0,at:0,g:i%2,rot:0,on:false});   // the new moon's lilies, opening as the light parts
function fmSprites(){if(FM_MOON&&fmK===K)return;fmK=K;const k=Math.min(K,2.5);FM_MOON=moonSprite(FMC.mr,k);FM_TTL=titleSprite('FULL MOON',50,k);}
const fmPrep=()=>palPrep(fm.no%MOON_PAL.length,DEMO?Math.max(fallStart(st.pk[0]),RARE_LV):fallStart(st.pk[0]));   // (the level the falls restart at)
const FM_PREP=[                                   // heavier bakes, one per frame through the build-up: glitter fields, then the next moon's art (palPrep: its lilies + leaves, its pond floor,
  [0.25,()=>{if(!DUST1)DUST1=dustLayer(420,420,FMC.dust[Q],true);}],   // its waterfall wall, its shoreline, the owl's branch, the shop's floor, its streams' water) and its season's title
  [0.45,()=>{if(!DUST2)DUST2=dustLayer(W,H,FMC.dust[Q],false);}],
  [0.6,fmPrep],[0.72,fmPrep],[0.84,fmPrep],[0.96,fmPrep],[1.06,fmPrep],[1.14,fmPrep],[1.22,fmPrep],[1.3,fmPrep],[1.38,fmPrep],
  [1.46,()=>seasonTitle(fm.no%MOON_PAL.length)],
];
const fmCover=(x,y)=>{const vx=-ox/scale,vy=-oy/scale;return Math.hypot(Math.max(x-vx,W-vx-x),Math.max(y-vy,H-vy-y));};   // to the screen's far corner
const fmOpen=()=>fmCover(PCX,PCY)*1.1*easeIO(clamp((fm.t-FM_T.swap)/(FM_T.end-FM_T.swap),0,1));   // radius of the parting light
const fmReach=d=>{const v=Math.min(1,d/(fmCover(PCX,PCY)*1.1));return (v<0.5?Math.sqrt(v/2):1-Math.sqrt((1-v)/2))*(FM_T.end-FM_T.swap);};   // when it reaches distance d
const fmBump=x=>x>=0&&x<0.5?Math.sin(x/0.5*Math.PI):0;   // a half-second swell: the burst's pulse
function fmFly(x,y){                              // a firefly joins the spiral from where it is
  if(FMF.n>=FMC.fly[Q])return;const f=FMF.a[FMF.n++],dx=x-PCX;
  f.x0=f.x=f.tx=x;f.y0=f.y=f.ty=y;f.th=dx<0?Math.PI:0;f.r0=Math.max(8,Math.abs(dx));f.r1=FMC.mr*rnd(1.2,1.65);
  f.w=rnd(2.6,4.2);f.d=rnd(0,0.35);f.ab=FM_T.rise+rnd(0.95,1.5);f.s=rnd(0.8,1.25);f.a=1;f.back=false;
}
function fmPart(k,x,y,vx,vy,life,s,img){
  if(FMP.n>=FMC.part[Q])return;const p=FMP.a[FMP.n++];
  p.k=k;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.t=0;p.life=life;p.s=s;p.rot=rnd(0,6.28);p.vr=rnd(-4,4);p.ph=rnd(0,6.28);p.img=img;
}
function fmStart(n){                              // RISE: the pond darkens and every firefly on screen is pulled into a rising spiral
  fm.on=true;fm.t=0;fm.n=n;fm.no=st.moons+1;fm.name=MOON_PAL[fm.no%MOON_PAL.length].name;fm.prep=0;
  fm.rose=fm.boom=fm.wash=fm.swapped=fm.dis=false;fm.glow=fm.cnt=fm.rain=0;fm.my=FMC.hz+FMC.mr*1.1;palNext=null;
  st.moonCard=st.help=false;drag=null;press=null;pointerId=null;st.chain=st.chainT=0;
  for(const m of merges){m.a.busy=m.b.busy=false;m.a.mg=0;}merges.length=0;   // the garden holds still: nothing lands mid-cinematic
  for(const k of KOIS)koiDrop(k);                 // (the koi let go of their pods and swim on)
  fmSprites();
  FMF.n=0;let tot=0,k=0;for(const p of pods)if(!p.dead)tot+=ready(p);
  const step=Math.max(1,Math.ceil(tot/(FMC.fly[Q]*0.75)));      // a crowded bed sends every step-th firefly (the rest slip away unseen)
  for(const p of pods){if(p.dead)continue;p.ffOut=true;for(const f of p.ff){if(f.cd>0||k++%step)continue;const q=ffPos(p,f,p.dr);fmFly(q.x,q.y);}}
  for(let i=0,na=ambN(lvlSum());i<na;i++){const a=AMB[i];fmFly(a.x+Math.sin(clock*a.s1+a.a)*30,a.y+Math.cos(clock*a.s2+a.b)*22);}
  const w=st.wf;if(w.drop){const q=dropPos(w.drop);fmFly(q.x,q.y);w.drop=null;}   // a pod on its way down the waterfall turns to fireflies too,
  for(let i=0,n=mistN();i<n;i++){const q=mistFly(i);fmFly(q.x,q.y);}   // and so do the fireflies in its mist
  w.q.length=0;sMoonBuild();
}
function fmBurst(){                               // white-gold flash, a shockwave over the whole screen, sparks and Moon Petals flung from the moon
  fm.boom=true;fm.glow=1;const cx=PCX,cy=FMC.my,R=FMC.mr;
  for(let i=FMC.sparks[Q];i>0;i--){const a=rnd(0,6.28),sp=rnd(160,700);fmPart(0,cx+Math.cos(a)*R*0.5,cy+Math.sin(a)*R*0.5,Math.cos(a)*sp,Math.sin(a)*sp,rnd(0.8,1.7),rnd(5,15),i%3?GLOW:MGLOW);}
  for(let i=FMC.petals[Q];i>0;i--){const a=rnd(0,6.28),sp=rnd(120,420);fmPart(1,cx+Math.cos(a)*R*0.7,cy+Math.sin(a)*R*0.7,Math.cos(a)*sp,Math.sin(a)*sp-80,rnd(2.4,3.2),rnd(8,13),MPET);}
  for(const p of pods){if(p.dead)continue;const dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy)||1;p.vx+=dx/d*140;p.vy+=dy/d*140;p.pop=Math.max(p.pop,0.5);}   // the shockwave shoves pods and leaves outward
  for(const L of DRIFT){const dx=L.x-cx,dy=L.y-cy,d=Math.hypot(dx,dy)||1;L.vx+=dx/d*90;L.vy+=dy/d*90;L.va+=rnd(-2,2);}
  wave(cx,FMC.hz,20,260,0.8,1.6);wave(PCX,PCY,10,200,0.6,1.4);koiStartle(PCX,PCY,4);   // the koi scatter
  st.shake=Math.max(st.shake,12);sMoonBurst();
}
function fmSwap(){                                // under the full wave of light: the Full Moon itself, then the new garden waits to bloom from the centre
  fm.swapped=true;FMF.n=0;moonReset(fm.n);
  for(const p of pods)p.born=-4*fmReach(Math.hypot(p.x-PCX,p.y-PCY));   // each pod pops up as the parting light reaches it
  for(let i=0;i<FM_LIL.length;i++){               // a ring of the new moon's lilies opens on the water, clear of the pods
    const L=FM_LIL[i],a=i*Math.PI/4+0.4,r=i%2?128:74;L.x=PCX+Math.cos(a)*r;L.y=PCY+Math.sin(a)*r*1.05;L.rot=rnd(0,6.28);L.on=true;
    for(const p of pods)if(Math.hypot(p.x-L.x,p.y-L.y)<p.r+16)L.on=false;
    L.at=fmReach(Math.hypot(L.x-PCX,L.y-PCY));
  }
  sMoonBloom();seasonIn();                         // ...and the new season blooms in with it
}
function fmEnd(){fm.on=false;fm.cx=fm.cy=fm.trem=0;FMF.n=0;}
function fmSkip(){                                // a tap after the first second: straight to the new moon, with a soft fade
  fmHush();if(!fm.swapped)fmSwap();
  for(const p of pods)p.born=Math.max(p.born,0);
  fmEnd();FMP.n=0;st.flash=Math.max(st.flash,0.5);
}
function fmUpdate(dt){
  for(let i=0;i<FMP.n;){                          // sparks, petals and glints (they outlive the cinematic by a moment)
    const p=FMP.a[i];p.t+=dt;
    if(p.t>=p.life){FMP.a[i]=FMP.a[--FMP.n];FMP.a[FMP.n]=p;continue;}
    if(p.k===1){p.vx*=Math.exp(-1.6*dt);p.vy+=(95-p.vy)*Math.min(1,dt*1.3);p.x+=Math.sin(p.t*2.6+p.ph)*30*dt;p.rot+=p.vr*dt;}   // Moon Petals flutter down
    else{const d=Math.exp(-(p.k?1.2:2.2)*dt);p.vx*=d;p.vy*=d;if(!p.k)p.vy+=50*dt;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;i++;
  }
  if(!fm.on)return;
  fm.t+=dt;const t=fm.t,T=FM_T;
  if(fm.prep<FM_PREP.length&&t>=FM_PREP[fm.prep][0])FM_PREP[fm.prep++][1]();
  if(!fm.rose&&t>=T.rise){fm.rose=true;sMoonRise();wave(PCX,FMC.hz+14,10,170,0.6,1.8);if(!hit('moon'))moment(3);}   // the moon starts rising: the Short's peak
  if(!fm.boom&&t>=T.burst)fmBurst();
  if(!fm.wash&&t>=T.reset){fm.wash=true;sMoonWash();}
  if(!fm.swapped&&t>=T.swap)fmSwap();
  if(t>=T.end){fmEnd();return;}
  // the moon: out of the water on a long ease, then a slow bob
  const ku=clamp((t-T.rise)/(FMC.rise*0.85),0,1);
  fm.my=lerp(FMC.hz+FMC.mr*1.1,FMC.my,easeOut(ku))+(ku>=1?Math.sin((t-T.rise-FMC.rise*0.85)*1.6)*2:0);
  // a slow camera sway swells with the rise and settles after the burst; petals and leaves tremble through the build-up
  const rum=t<T.rise?0.35*clamp((t-0.6)/0.9,0,1):t<T.burst?lerp(0.35,1,(t-T.rise)/FMC.rise):Math.max(0,1-(t-T.burst)/1.1),A=FMC.shake*rum;
  fm.cx=(Math.sin(t*7.3)+0.4*Math.sin(t*12.9+1))*A;fm.cy=(0.8*Math.cos(t*6.1)+0.3*Math.sin(t*11.3))*A;
  fm.trem=t<T.rise?easeIO(t/T.rise):t<T.burst?1-0.6*(t-T.rise)/FMC.rise:0;
  if(t>T.burst)fm.glow=Math.max(0,fm.glow-dt*0.5);
  // the fireflies spiral up around the moon's resting place, circle it as it rises, then dive into it one by one
  for(let i=0;i<FMF.n;){
    const f=FMF.a[i],tt=t-f.d;
    if(tt<=0){i++;continue;}
    const u=Math.min(1,tt/1.35),e=easeIO(u),ang=f.th+f.w*(tt<0.7?tt*tt/1.4:tt-0.35);   // it spins up over 0.7 s, then circles at w
    let rad=lerp(f.r0,f.r1,e),cy=lerp(f.y0,FMC.my,e),back=true;
    if(t>=f.ab){
      const ka=Math.min(1,(t-f.ab)/0.3);
      if(ka>=1){fmPart(2,f.x,f.y,rnd(-25,25),rnd(-25,25),0.5,rnd(8,13),MGLOW);fm.glow=Math.min(1,fm.glow+0.025);sMoonSip();FMF.a[i]=FMF.a[--FMF.n];FMF.a[FMF.n]=f;continue;}
      rad=lerp(rad,FMC.mr*0.25,ka*ka);cy=lerp(cy,fm.my,ka);f.a=1-ka*ka;back=false;
    }
    const sn=Math.sin(ang);f.x=PCX+Math.cos(ang)*rad;f.y=cy+sn*rad*0.34;f.back=back&&sn<0;   // the far side of the ring passes behind the moon
    const kt=Math.min(1,dt*9);f.tx+=(f.x-f.tx)*kt;f.ty+=(f.y-f.ty)*kt;i++;
  }
  if(t>=T.burst+0.1&&t<T.reset){                  // Moon Petals keep raining from the top of the screen
    fm.rain+=dt*FMC.rain[Q];const vx=-ox/scale,vw=W+2*ox/scale;
    while(fm.rain>=1){fm.rain-=1;fmPart(1,vx+Math.random()*vw,-oy/scale-16,rnd(-20,20),rnd(60,130),rnd(2.6,3.4),rnd(8,13),MPET);}
  }
  const c=Math.round(fm.n*easeOut(clamp((t-T.burst-0.35)/0.8,0,1)));   // the petals earned count up under the title
  if(c!==fm.cnt){fm.cnt=c;sMoonCount(c/fm.n);}
  if(fm.swapped){                                 // glints and the new season's petals, sparkles, leaves or snow ride the parting light's rim; at the end the lilies melt into glints
    const rb=fmOpen();
    if(rb<420)for(let j=fxN(2);j>0;j--){const a=rnd(0,6.28);fmPart(2,PCX+Math.cos(a)*rb,PCY+Math.sin(a)*rb,Math.cos(a)*40,Math.sin(a)*40,rnd(0.4,0.7),rnd(7,12),PAL.lily[0][2]);}
    if(rb>20&&rb<400)for(let j=fxN(2);j>0;j--){const a=rnd(0,6.28),sp=rnd(50,120);seaSpawn(SEA.S.p,0,PCX+Math.cos(a)*rb,PCY+Math.sin(a)*rb,Math.cos(a)*sp,Math.sin(a)*sp-20);}
    if(!fm.dis&&t>=T.end-0.22){fm.dis=true;for(const L of FM_LIL)if(L.on)for(let j=fxN(6);j>0;j--)fmPart(2,L.x,L.y,rnd(-60,60),rnd(-60,60),rnd(0.5,0.8),rnd(8,13),PAL.lily[L.g][2]);}
  }
}

// ---------- critters: a pond frog, a luna moth and a wishing star (all need a tap at the right time) ----------
// the pond frog hops onto its own lily pad and snaps up fireflies with its tongue; as its meal fills it grows through four stages
// (FROG_ST, each a little extra glow) and at the last one glows up into the GOLDEN FROG: a tap then pops out everything it ate.
// f.x, f.y: where it sits (its pad's centre, or its path through a jump); s: eat / full (golden) / bye (just popped) / out (hopping off)
function frogSpot(){                              // near the pod with the most fireflies home (in open water, clear of the waterfall's wall and foam)
  let b=null,bs=0;for(const p of pods){if(p.dead||p.busy)continue;const s=ready(p)+Math.random();if(s>bs){bs=s;b=p;}}
  const a=rnd(0,6.28),d=rnd(55,85),x=b?b.x+Math.cos(a)*d:rnd(BX0+40,BX1-40),y=b?b.y+Math.sin(a)*d:rnd(POD_Y0+60,BY1-40);

}

  let bs=-1e9,A=null,B=null;                      // long; it swims to the one it can reach (the nearer first). only: just that value; reach: that pod must be this near

  for(const k of KOIS){
    if(!k.on||k.sc>0||k.enter||k.s==='seek'||k.s==='carry')continue;
    const dx=k.x-x,dy=k.y-y,r=KOI.startle*s;if(dx*dx+dy*dy>r*r)continue;

  const pick=play&&(st.tut<0||st.tut>1)&&!stage&&!(dir.cur&&dir.cur.calm);   // not while the tutorial teaches merging, a calm scene counts up, or the koi scene stages its own
  const again=Math.min(2.5,koiGap()),ch=dir.chill;   // no pair yet: it looks again this soon
  for(const k of KOIS){                           // (the CHILL scene: one carry for the whole school about every KOI.chill.gap s)

function seaUpdate(dt){                           // the season's bloom (SIN) and the MOON tab's row; what drifts and tumbles this season spawns and moves

        if(p.k!==1&&p.y>=WALL_Y+2){

          else{p.m=2;p.t=0;p.life=rnd(1.8,2.6);p.y=WALL_Y+3+rnd(0,5);p.vx=rnd(-5,5);p.vy=rnd(9,15);}   // a petal or a leaf rides the current out

  if(p.dead||p.busy)return false;drag={p,x,y,offx:p.x-x,offy:p.y-y,lift};p.vx=p.vy=0;p.sa=Math.PI/2;p.sv+=LILY.grab;wave(p.x,p.y,p.r,p.r+18,0.5,0.7);sPick();return true;
}
function moveDrag(x,y){if(drag){drag.x=x;drag.y=y;owlLook(x,y,0.6);}}   // (the owl's head follows the lily being dragged)
function releaseDrag(){
  if(!drag)return;const p=drag.p;drag=null;
  if(p.dead||p.busy)return;
  const t=findTarget(p,p.x,p.y,p.v,p.r);
  if(t)startMerge(p,t,0.1);else{splash(p.x,p.y,0.7,p.r);sDrop();p.sa=Math.PI/2;p.sv-=LILY.drop;}   // no twin: it drops back in with a splash (and a squash)
  p.vx=p.vy=0;
}

function toLocal(e){const b=cv.getBoundingClientRect();return {x:(e.clientX-b.left-ox)/scale,y:(e.clientY-b.top-oy)/scale};}
function btnAt(q){if(q.y<UY||q.y>UY+UH)return -1;for(let i=0;i<3;i++)if(q.x>=UX[i]-2&&q.x<=UX[i]+UW+2)return i;return -1;}
const pageAt=q=>q.y>=UY&&q.y<=UY+UH&&pages(st.tab)>1&&(q.x<UX[0]?-1:q.x>UX[2]+UW?1:0);   // -1 / 1: an arrow's margin beside the shop (44 units wide)
function podAt(q){let hit=null,hd=1e9;for(const p of pods){if(p.dead||p.busy)continue;const d=Math.hypot(p.x-q.x,p.y-q.y);if(d<p.r+8&&d/p.r<hd){hd=d/p.r;hit=p;}}return hit;}
cv.addEventListener('pointerdown',e=>{

    if(moonReady()&&q.x>=80&&q.x<=280&&q.y>=MOON_BY&&q.y<=MOON_BY+48)riseMoon();else sDrop();
    st.moonCard=false;return;
  }

  if(Math.hypot(q.x-HX,q.y-HY)<HIT_R){st.hbP=1;st.help=true;sPick();return;}
  if(Math.hypot(q.x-MX,q.y-MY)<28){st.moonCard=true;st.tf.card=true;sPick();return;}
  if(q.y>=TAB_T&&q.y<UY-1){                       // the tabs (their touch band runs from under the water down to the cards)
    const t=q.x<TX[1]-2?0:q.x<TX[2]-2?1:2;st.tabP[t]=1;if(t!==st.tab)st.tab=t;sPick();
    if(t===1)st.tf.tab=true;return;
  }
  const pa=pageAt(q);if(pa){flipPage(pa);return;}
  const bi=btnAt(q);
  if(bi>=0){const j=itemAt(st.tab,bi);if(j>=0){if(st.tab===2)buyPerk(j);else if(st.tab)buyCrit(j);else buy(j);}return;}   // (an empty slot on a short page does nothing)
  if(st.tut>=0&&q.x>=290&&q.x<=342&&q.y>=TUT_Y&&q.y<=TUT_Y+TUT_H){if(TUT[st.tut].k===null)nextTut();else skipTut();return;}   // the tutorial card's OK / SKIP
  if(critterTap(q))return;

  pointerId=e.pointerId;
  try{cv.setPointerCapture(e.pointerId);}catch(err){}

const dir={q:[],i:0,cur:null,t:0,t0:0,next:0,rt:0,j:-1,cardT:0,rdy:-1,shown:false,kn:0,chill:false,kt:0};
if(DEMO){
  const m=/[?&]scenes=([^&]*)/.exec(location.search);let ids=[];
  try{ids=m?decodeURIComponent(m[1]).split(','):[];}catch(e){}

  if(dir.q.length)dir.next=Math.max(dir.q[0].chill?0:0.3,SCENE_FIRST-dir.q[0].lead);   // (CHILL first: staged before the first frame shows)

function dirUpdate(dt){
  dir.t+=dt;
  if(fm.on){dir.next=Math.max(dir.next,dir.t+0.6);return;}   // nothing is staged over the Full Moon, and the new garden gets a breath first
  const nq=dir.q[dir.i];if(nq&&nq.sea!=null)palPrep(nq.sea,nq.chill?CHILL.lv[WF]:Math.max(st.lv[WF],LATE.lv[WF]));   // the next scene's season: its art baked ahead, a piece a frame (no stall as it starts)
  const c=dir.cur;
  if(c){
    if(c.goal&&st.glow>=c.goal){goalPeak(c);return;}
    if((dir.rt-=dt)<=0){dir.rt=0.5;c.rig();}
    if(dir.t-dir.t0>SCENE_GIVEUP){dir.cur=null;dir.next=dir.t;}   // it could not be staged: move on to the next one
  }else if(dir.i<dir.q.length&&dir.t>=dir.next){
    const s=dir.q[dir.i++];dir.cur=s;dir.t0=dir.t;dir.rt=0;
    if(dir.chill&&!s.chill){dir.chill=false;koiSync(false);}   // a scene after CHILL: the finger, the words and the KOI level's koi are back
    if(s.start)s.start();
  }
}
function hit(kind){                               // an event happened: if it is the staged scene's peak, mark it and schedule the next
  const c=dir.cur;if(!c||c.peak!==kind)return false;
  dir.cur=null;moment(3,c.id);
  const n=dir.q[dir.i];dir.next=dir.t+Math.max(c.hold||2,SCENE_GAP-(n?n.lead:0));   // `hold`: the peak plays out before anything else is staged
  return true;
}
function stagePods(v,n){                          // pods tumble down the falls until n pods of value v are on their way (merging pairs and bursting pods count)
  const w=st.wf;let c=w.drop&&w.drop.v===v?1:0;
  for(const p of pods){if(p.dead)continue;if(p.burstT>=0&&p.v===v*2)c+=2;else if(p.v===v&&!p.busy)c++;}
  for(const m of merges)if(m.b.v===v)c+=2;
  for(const q of w.q)if(q.v===v)c++;
  for(;c<n;c++)w.q.push({v});
}
function rigFrog(){                               // the frog hops in hungry for just three fireflies, so she fills up on camera
  st.cr[0]=Math.max(1,st.cr[0]);const f=st.frog;
  if(!f)frogIn();else if(f.s==='eat')f.need=Math.min(f.need,f.food+3);
}
function rigGolden(){st.cr[0]=Math.max(1,st.cr[0]);if(!st.frog)frogIn();}   // a hungry pond frog hops in and eats its way through every stage to gold
// the WATERFALL one level short of full flow (the streams it has not opened yet burst out one after another) with the glow for the last level:
// once they all run the finger buys it, the last stream opens, the moonbow shows and a golden pod tumbles down (the peak, as it lands)
function startFalls(){
  const m=UPS[WF].max;
  if(st.lv[WF]>=m){st.wf.force=true;st.wf.t=Math.max(st.wf.t,podI(m)-FALLS.goldIn);return;}   // already full: straight to its golden pod
  st.lv[WF]=m-1;rigFalls();
}
function rigFalls(){if(st.lv[WF]<UPS[WF].max)st.glow=Math.max(st.glow,cost(WF)*1.05);}
// the ogon noses a favourite pod across the pond: a far pair near it if the bed has one, else two come down the falls and float out (one to just
// ahead of it, its twin to about 180 units off); the peak fires as the koi's pair merges (the other koi leave it be meanwhile, the finger holds still). The favourite is
// made one the koi can carry (they never merge 8s)
function startKoi(){
  dir.kn=0;if(!st.lv[KOI_I]){st.lv[KOI_I]=1;koiSync(false);}
  const top=koiTop(st.lv[KOI_I]);if(!st.kf||st.kf>top){st.kfo=st.kf;st.kf=top;st.kfA=0;}
}
function rigKoi(){
  const k=KOIS[0];if(!k.on||k.enter||k.s==='seek'||k.s==='carry')return;
  if(koiTry(k,st.kf,110))return;
  if(st.wf.drop&&st.wf.drop.koi||st.wf.q.some(q=>q.koi))return;   // its pair is on the way
  if(dir.kn>=2){koiTry(k,0,0);return;}            // (it could not reach those: any far pair will do)
  const v=st.kf,m=KOI.reach+6,r=podR(v)+8;dir.kn++;
  let ax=k.x+Math.cos(k.a)*60,ay=k.y+Math.sin(k.a)*60,bx=PCX,by=PCY,bs=1e9;
  ax=clamp(ax,PX0+m,PX0+PW-m);ay=clamp(ay,WALL_Y+m,PY0+PH-m);   // (in open water, clear of the waterfall's wall)
  for(let i=0;i<24;i++){
    const x=rnd(BX0+r,BX1-r),y=rnd(POD_Y0+r,BY1-r);
    const s=Math.abs(Math.hypot(x-ax,y-ay)-180);if(s<bs){bs=s;bx=x;by=y;}
  }
  st.wf.q.push({v,to:{x:ax,y:ay},koi:true},{v,to:{x:bx,y:by},koi:true});
}
// the NIGHT OWL glides in over the moon to its branch (turning back if it was just leaving); once it watches, 8s fall for a chain of three blooms it
// boosts, the peak firing as the third one bursts with the owl's eyes flashing (the finger holds still until it has landed)
function startOwl(){st.cr[OWL_I]=Math.max(1,st.cr[OWL_I]);const o=st.owl;if(!o||o.s==='out')owlIn();else o.stay=Math.max(o.stay,15);}
function rigOwl(){
  st.cr[OWL_I]=Math.max(1,st.cr[OWL_I]);const o=st.owl;
  if(!o||o.s==='out'){owlIn();return;}
  o.stay=Math.max(o.stay,12);if(o.s==='perch')stagePods(8,2*Math.max(1,3-st.chain));

function startUnlock(){                           // a swarm streams to the counter with just enough glow for the next critter
  let j=-1;for(let i=0;i<3;i++)if(st.cr[i]<CRIT[i].max&&(j<0||st.cr[i]<st.cr[j]))j=i;
  dir.j=j;if(j<0)return;
  const g=(critCost(j)-st.glow)*1.05;if(g<=0)return;
  if(!pods.length){addGlow(g);return;}

const inFlight=()=>{let g=0;for(const b of bugs)g+=b.g;return g;};   // caught glow still on its way to the counter

  const L=LATE;
  st.moons=Math.max(st.moons,L.moons);st.petalsAll=Math.max(st.petalsAll,L.petalsAll);st.petals=Math.max(st.petals,L.petals);

  for(const k of KOIS)koiDrop(k);koiSync(false);  // all three koi are simply there
  pods=[];merges=[];drag=null;press=null;BLM.n=0;

function stageAct(){                              // the AI's next move toward the staged peak (false: hold still, null: play as usual)
  const k=dir.cur.peak;
  if(k==='task'&&!dir.shown){                     // first a look at the Moon Tasks on the card, then close it
    if(!st.moonCard)return {k:'moon'};

    return false;
  }
  if(k==='owl'&&!owlOn())return false;            // the owl lands first
  if(k==='bloom'||k==='chain'||k==='task'||k==='owl'){
    let pr=null,pd=1e9;
    for(let i=0;i<pods.length;i++){const a=pods[i];if(a.dead||a.busy||a.v!==8)continue;
      for(let j=i+1;j<pods.length;j++){const b=pods[j];if(b.dead||b.busy||b.v!==8)continue;const d=Math.hypot(a.x-b.x,a.y-b.y);if(d<pd){pd=d;pr=[a,b];}}}
    return pr?{k:'drag',p:pr[0],b:pr[1]}:false;
  }
  if(k==='swarm'||k==='goal'){   // goal: never spends the glow, and catches a few fireflies only while the income alone would arrive late
    if(k==='goal'&&dir.cur.goal-st.glow-inFlight()<=rate()*(dir.t0+LATE.goalSec-dir.t))return false;
    let b=null;for(const p of pods)if(!p.dead&&!p.busy&&(!b||ready(p)>ready(b)))b=p;
    return b&&ready(b)?{k:'tap',p:b,n:k==='goal'?Math.min(3,ready(b)):ready(b)}:k==='goal'?false:null;
  }
  if(k==='unlock'){const j=dir.j;if(j<0)return null;if(st.tab!==1)return {k:'tab',t:1};return st.glow>=critCost(j)?{k:'crit',i:j}:false;}
  if(k==='moon'||k==='season'){                   // the glow fills the moon, its hint shows, then the card, then RISE (season: the new one blooms in at its end)
    if(st.moonCard)return dir.t-dir.cardT>1.1?{k:'rise'}:false;
    if(!moonReady())return false;
    if(dir.rdy<0)dir.rdy=dir.t;
    return dir.t-dir.rdy>LATE.moonWait?{k:'moon'}:false;
  }
  if(k==='falls'){                                // UPGRADES, the WATERFALL's page, its last level once every stream runs; then hold still for the golden pod
    if(st.lv[WF]>=UPS[WF].max)return false;
    if(st.tab!==0)return {k:'tab',t:0};
    const pg=Math.floor(WF/3);if(st.pg[0]!==pg)return {k:'pg',d:pgDir(0,pg)};
    return fallsSettled()&&st.glow>=cost(WF)?{k:'buy',i:WF}:false;
  }
  if(k==='koi')return false;                      // the finger holds still while the koi carries its pod home
  return null;                                    // frog, moth and star: the AI's usual critter taps finish them
}

function aiUpdate(dt){

  ai.t+=dt;ai.lastBuy+=dt;ai.tap=Math.max(0,ai.tap-dt);
  if(ai.phase===0){
    if(ai.t<ai.wait)return;
    const sa=dir.cur?stageAct():null;
    if(sa===false){ai.t=0;ai.wait=0.1;return;}    // a staged moment is setting up: hold still
    let act=sa;
    if(!act&&st.frog&&st.frog.s==='full'&&st.frog.hop<0&&st.frog.gu>=FROG.gu)act={k:'frog'};   // pops the golden frog once its glow-up has played
    if(!act&&st.moth&&st.moth.x>50&&st.moth.x<310)act={k:'moth'};   // moth and star only visit the demo once a scene brought them

      if(bi>=0)act=st.tab?{k:'tab',t:0}:st.pg[0]?{k:'pg',d:pgDir(0,0)}:{k:'buy',i:bi};   // back on the UPGRADES tab (and its first page) first
    }
    const L=pods.filter(p=>!p.dead&&!p.busy&&!p.kr);   // (a pod a koi is after stays its own)
    if(!act&&!(dir.q.length&&!dir.i)&&(ai.first||Math.random()<(st.chain?0.8:0.5))){   // the AI hunts the biggest pair to trigger / feed blooms (not before the first staged scene)
      let pr=null,pd=-1e9;
      for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){if(L[i].v!==L[j].v)continue;const d=L[i].v*1000-Math.hypot(L[i].x-L[j].x,L[i].y-L[j].y);if(d>pd){pd=d;pr=[L[i],L[j]];}}
      if(pr)act={k:'drag',p:pr[0],b:pr[1]};
    }
    ai.first=false;
    if(!act&&L.length){L.sort((a,b)=>ready(b)-ready(a));if(ready(L[0])>0)act={k:'tap',p:L[Math.floor(Math.random()*Math.min(2,L.length))],n:3+Math.floor(Math.random()*3)};}
    if(!act){ai.t=0;ai.wait=0.3;return;}
    ai.act=act;ai.phase=1;ai.t=0;ai.sx=ai.px;ai.sy=ai.py;
  }else if(ai.phase===1){
    const a=ai.act;
    if(a.p&&(a.p.dead||a.p.busy)){ai.phase=0;ai.t=0;ai.wait=0.1;return;}
    let tx,ty;
    if(a.k==='buy'||a.k==='crit'){tx=UX[slotOf(a.k==='buy'?0:1,a.i)]+UW/2;ty=UY+UH/2;}
    else if(a.k==='tab'){tx=TX[a.t]+TW/2;ty=TAB_Y+TAB_H/2;}
    else if(a.k==='pg'){tx=PG_X[a.d>0?1:0];ty=UY+UH/2;}   // a page arrow beside the shop
    else if(a.k==='moon'){tx=MX;ty=MY;}

    else if(a.k==='frog'){const f=st.frog;if(!f||f.s!=='full'){ai.phase=0;ai.t=0;ai.wait=0.1;return;}tx=f.x;ty=f.y-14*f.sz;}
    else if(a.k==='moth'||a.k==='star'){const c=a.k==='moth'?st.moth:st.star;if(!c){ai.phase=0;ai.t=0;ai.wait=0.1;return;}tx=c.x;ty=c.y;}   // chases it as it flies
    else{tx=a.p.x;ty=a.p.y;}

      else if(a.k==='tab'){if(st.tab!==a.t){st.tab=a.t;sPick();}st.tabP[a.t]=1;ai.tap=0.15;ai.phase=0;ai.wait=0.35;}
      else if(a.k==='pg'){if(st.tab===0)flipPage(a.d);ai.tap=0.15;ai.phase=0;ai.wait=0.35;}
      else if(a.k==='moon'){st.moonCard=true;dir.cardT=dir.t;sPick();ai.tap=0.15;ai.phase=0;ai.wait=0.2;}
      else if(a.k==='rise'){riseMoon();st.moonCard=false;ai.tap=0.2;ai.phase=0;ai.wait=0.6;}   // the AI sits out the cinematic, then a breath more

      else if(a.k==='frog'){frogTap();ai.tap=0.2;ai.phase=0;ai.wait=0.5;}
      else if(a.k==='tap'){ai.phase=3;ai.t=1;}

      else{ai.phase=0;ai.wait=0.1;}

  }else if(ai.phase===2){
    const b=ai.act.b;

    const k=easeIO(Math.min(1,ai.t/0.45));ai.px=lerp(ai.sx,b.x,k);ai.py=lerp(ai.sy,b.y,k);moveDrag(ai.px,ai.py);

    ai.px=a.p.x;ai.py=a.p.y;
    if(ai.t>=0.14){ai.t=0;a.n--;if(!tapPod(a.p))a.n=0;ai.tap=0.1;}
  }
}

// ---------- update ----------
function physics(dt){
  const dp=drag&&drag.p,damp=Math.exp(-3*dt),dampF=Math.exp(-FALLS.drift*dt);
  for(const p of pods){
    if(p.dead)continue;
    if(p.busy||p===dp){p.tb=0;continue;}
    const k=clock*0.5+p.id*1.7,dm=p.fl>0?dampF:damp;   // a pod from the waterfall floats out on a gentler damping
    if(p.fl>0)p.fl-=dt;
    p.vx+=Math.sin(k)*8*dt;p.vy+=Math.cos(k*0.8+p.id)*8*dt;
    if(IMP_N){                                    // by the falls it bobs harder, and within their churn it drifts gently off (it stops at the churn's edge)
      p.tb+=(churnK(p.x,p.y,p.r+FOAM.bobR)-p.tb)*Math.min(1,dt*3);
      if(churnK(p.x,p.y,p.r*0.4)>0){p.vx+=CHP.x*FOAM.pod*dt;p.vy+=CHP.y*FOAM.pod*dt;}
    }else p.tb=Math.max(0,p.tb-dt);
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=dm;p.vy*=dm;
  }
  const push=Math.min(1,dt*10);
  for(let i=0;i<pods.length;i++){
    const a=pods[i];if(a.dead||a===dp)continue;
    for(let j=i+1;j<pods.length;j++){
      const b=pods[j];if(b.dead||b===dp||(a.busy&&b.busy))continue;
      let dx=b.x-a.x,dy=b.y-a.y;const mn=(a.r+b.r)*0.8;
      if(dx>mn||dx<-mn||dy>mn||dy<-mn)continue;   // cheap reject before the sqrt
      let d=Math.hypot(dx,dy);if(d>=mn)continue;
      if(d<0.01){dx=rnd(-1,1);dy=rnd(-1,1);d=Math.hypot(dx,dy)||1;}
      const m=(mn-d)*push,nx=dx/d,ny=dy/d;
      if(a.busy){b.x+=nx*m;b.y+=ny*m;}
      else if(b.busy){a.x-=nx*m;a.y-=ny*m;}
      else{
        a.x-=nx*m/2;a.y-=ny*m/2;b.x+=nx*m/2;b.y+=ny*m/2;
        const cv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;   // pads that really run into each other (a closing speed) both squash softly along the bump and turn a little
        if(cv<-LILY.bumpV&&a.bk<=0&&b.bk<=0){
          const kk=Math.min(1,-cv/90)*LILY.bump,tw=((b.vx-a.vx)*-ny+(b.vy-a.vy)*nx)*0.004;
          a.sa=b.sa=Math.atan2(ny,nx);a.sv-=kk;b.sv-=kk;a.rv+=tw;b.rv-=tw;a.bk=b.bk=0.35;
        }
      }
    }
  }
  for(const p of pods){if(p.dead||p.busy||p===dp)continue;p.x=clamp(p.x,BX0+p.r*0.8,BX1-p.r*0.8);p.y=clamp(p.y,POD_Y0+p.r*0.8,BY1-p.r*0.8);}   // (open water, below the waterfall's wall)
}
function driftIn(L){L.c=-1;L.x=rnd(BX0+10,BX1-10);L.y=POD_Y0+rnd(4,16);L.vx=L.vy=0;L.in=0;L.a=rnd(0,6.28);L.va=rnd(-0.3,0.3);}   // back in over the falls
function bubbleIn(L){                             // a bubble rises: over a koi's head now and then, else anywhere out in the open water
  const k=KOIS[Math.floor(Math.random()*KOIS.length)];
  if(k.on&&Math.random()<0.6&&k.x>PX0+30&&k.x<PX0+PW-30&&k.y>WALL_Y+30&&k.y<PY0+PH-30){L.x=k.x+Math.cos(k.a)*5;L.y=k.y+Math.sin(k.a)*5;}
  else{L.x=rnd(BX0+30,BX1-30);L.y=rnd(POD_Y0+40,BY1-30);}
  L.t=0;L.life=rnd(1.6,3.2);L.vx=L.vy=0;L.s=rnd(2,3.4);
}
function driftUpdate(dt){                         // the current's streaks, the floaters riding it (pods nudge them aside, ripples push them) and the water strider
  const lv=flowLive(),fl=st.wf.fl,damp=Math.exp(-1.2*dt),spin=Math.exp(-0.6*dt),end=CH_D[CH_D.length-1];
  CH_PH=(CH_PH+dt*FLOW.ch*lv)%16;
  for(const s of STK){s.u+=dt/SL_DT*lv;if(s.u-s.n>=SL[s.l].length/2-1){s.l=slPick();s.u=0;s.n=rnd(9,15);s.a=rnd(0.6,1);}}
  for(const L of DRIFT){
    if(L.k===5){                                  // a bubble: it waits, rises, rides the water a little and pops with a tiny ring
      if(L.t<0){if((L.t+=dt)>=0)bubbleIn(L);continue;}
      if(IMP_N&&churnK(L.x,L.y,2)>0){L.vx+=CHP.x*FOAM.leaf*dt;L.vy+=CHP.y*FOAM.leaf*dt;}
      if(WFR.n)frontKick(L,dt);
      const v=flowAt(L.x,L.y,fl);L.t+=dt;L.x+=(v.x*lv*0.4+L.vx)*dt;L.y+=(v.y*lv*0.4+L.vy)*dt;L.vx*=damp;L.vy*=damp;
      if(L.t>=L.life){if(waves.length<WAVE_CAP[Q]-8)wave(L.x,L.y,0.5,6,0.3,0.6);L.t=-rnd(1.5,5);}
      continue;
    }
    L.in=Math.min(1,L.in+dt*0.7);
    if(L.c>=0){                                   // out down the stream, bobbing across it, then back in over the falls
      L.c+=dt*FLOW.ch*lv*(L.k<4?0.8:1);const q=chAt(Math.min(L.c,end)),o=L.o+Math.sin(clock*2.3+L.ph)*2;
      L.x=q.x+q.nx*o;L.y=q.y+q.ny*o;L.a+=dt*(L.va+Math.sin(clock*1.7+L.ph)*0.6);
      if(L.c>=end){driftIn(L);if(waves.length<WAVE_CAP[Q]-8)wave(L.x,L.y,1,8,0.25,0.8);}
      continue;
    }
    if(IMP_N){const ck=churnK(L.x,L.y,L.s);if(ck>0){L.vx+=CHP.x*FOAM.leaf*dt;L.vy+=CHP.y*FOAM.leaf*dt;L.va+=(Math.random()-0.5)*ck*8*dt;}}   // the falls shove it off along their arcs,
    if(WFR.n)frontKick(L,dt);                     // a passing wave front carries it on, then the current takes it
    const v=flowAt(L.x,L.y,fl),rd=L.k<4?0.85:1;   // (a leaf drags a little in the water)
    for(const p of pods){
      if(p.dead)continue;const dx=L.x-p.x,dy=L.y-p.y,mn=p.dr+L.s*0.5;
      if(dx>mn||dx<-mn||dy>mn||dy<-mn)continue;
      const d=Math.hypot(dx,dy);if(d>=mn||d<0.01)continue;
      const f=(mn-d)*8*dt/d;L.vx+=dx*f;L.vy+=dy*f;
    }
    L.x+=(v.x*lv*rd+L.vx)*dt;L.y+=(v.y*lv*rd+L.vy)*dt;L.vx*=damp;L.vy*=damp;L.a+=L.va*dt;L.va*=spin;
    if(Math.hypot(L.x-OUT.x,L.y-OUT.y)<10){L.c=0;L.o=rnd(-5,5);continue;}   // it slips out between the stones
    if(L.x<BX0){L.x=BX0;L.vx=Math.abs(L.vx)*0.5;}else if(L.x>BX1){L.x=BX1;L.vx=-Math.abs(L.vx)*0.5;}
    if(L.y<POD_Y0+4){L.y=POD_Y0+4;L.vy=Math.abs(L.vy)*0.5;}else if(L.y>BY1){L.y=BY1;L.vy=-Math.abs(L.vy)*0.5;}
  }
  striderUpdate(dt);
}
// a water strider now and then: it skates out from under a bank stone, rows in quick strokes (tiny rings at its feet), glides, rests, then goes home.
// side: its bank (0 left, 1 right); n: strokes left; tx / ty: where it is heading; k: the last stroke's sweep (1 fading to 0)
const WS={on:false,x:0,y:0,a:0,v:0,k:0,n:0,rest:0,next:10,tx:0,ty:0,side:0};
function striderAim(s){s.tx=s.side?rnd(262,326):rnd(34,98);s.ty=rnd(WALL_Y+70,BY1-40);}   // calm water on its own side of the pond
function striderUpdate(dt){
  const s=WS;
  if(!s.on){
    if((s.next-=dt)<=0){s.on=true;s.side=Math.random()<0.5?1:0;s.x=s.side?W-2:2;s.y=rnd(WALL_Y+80,BY1-60);s.v=s.k=0;s.n=5+Math.floor(Math.random()*5);s.rest=0.3;striderAim(s);}
    return;
  }
  s.x+=Math.cos(s.a)*s.v*dt;s.y+=Math.sin(s.a)*s.v*dt;s.v*=Math.exp(-3.4*dt);s.k=Math.max(0,s.k-dt*4);
  if(s.x<-14||s.x>W+14||s.y<WALL_Y+20||s.y>BY1+10){s.on=false;s.next=rnd(14,30);return;}   // gone under the bank
  if(s.v>6||(s.rest-=dt)>0)return;
  if(s.n>0){s.n--;if(Math.hypot(s.tx-s.x,s.ty-s.y)<24)striderAim(s);}
  else{s.tx=s.side?W+30:-30;s.ty=s.y;}            // its strokes are done: back to its bank
  s.a=Math.atan2(s.ty-s.y,s.tx-s.x)+rnd(-0.45,0.45);s.v=rnd(55,85);s.k=1;s.rest=rnd(0.25,1.2);
  if(waves.length<WAVE_CAP[Q]-8){const c=Math.cos(s.a),n=Math.sin(s.a);wave(s.x-c*3-n*7,s.y-n*3+c*7,0.6,6,0.3,0.6);wave(s.x-c*3+n*7,s.y-n*3-c*7,0.6,6,0.3,0.6);}
}

function update(dt){
  clock+=dt;
  if(DEMO){dirUpdate(dt);aiUpdate(dt);}
  if(fm.on||FMP.n)fmUpdate(dt);
  const play=!fm.on;                              // the Full Moon cinematic holds the garden still: no income, pods down the falls, koi carries, critters or tutorial steps
  if(play)addGlow(rate()*dt);
  const bo=st.boost>0?BOOST_T:1;
  st.boost=Math.max(0,st.boost-dt);
  st.comboT-=dt;if(st.comboT<=0)st.combo=0;
  st.resetArm=Math.max(0,st.resetArm-dt);st.pulse=Math.max(0,st.pulse-dt*4);st.flowerT=Math.min(1,st.flowerT+dt*1.2);
  st.moonFx=Math.max(0,st.moonFx-dt*0.8);st.pgFx=Math.max(0,st.pgFx-dt*5);
  for(let i=0;i<3;i++)st.mtFx[i]=Math.max(0,st.mtFx[i]-dt*0.7);
  if(play&&!st.moonHint&&!dir.chill&&moonReady()){st.moonHint=true;banner('FULL MOON! Tap the moon for petals',C.white,3);ring(MX,MY,90,6,'244,247,255');sStar();}   // (the CHILL scene's moon just waxes)
  for(let i=0;i<3;i++){st.btnP[i]=Math.max(0,st.btnP[i]-dt*5);st.btnS[i]=Math.max(0,st.btnS[i]-dt*3);st.btnK[i]=Math.max(0,st.btnK[i]-dt*2.4);st.tabP[i]=Math.max(0,st.tabP[i]-dt*6);}
  st.pgP[0]=Math.max(0,st.pgP[0]-dt*6);st.pgP[1]=Math.max(0,st.pgP[1]-dt*6);st.rbP=Math.max(0,st.rbP-dt*6);st.hbP=Math.max(0,st.hbP-dt*6);
  if(st.welcome){st.welcome.t+=dt;if(st.welcome.t>4.2)st.welcome=null;}
  if(st.banner){st.banner.t+=dt;if(st.banner.t>st.banner.life)st.banner=null;}
  if(play&&st.tut>=0){st.tutT+=dt;const T=TUT[st.tut];if(T.k?(st.tf[T.k]&&st.tutT>0.5):st.tutT>6)nextTut();}
  // burst chain countdown: ticks speed up the last 2 seconds, pink embers rise while it runs
  if(st.chain){
    const prev=st.chainT;st.chainT-=dt;
    if(st.chainT<2&&st.chainT>0&&Math.floor(prev*4)!==Math.floor(st.chainT*4))sTick(Math.round((2-st.chainT)*6));
    if(st.chainT<=0)endChain();
    else if(parts.length<PART_CAP[Q]&&Math.random()<dt*(5+st.chain*3)*FX[Q])
      parts.push({k:2,x:rnd(BX0,BX1),y:BY1+6,vx:rnd(-12,12),vy:rnd(-150,-80),life:rnd(1.2,2),t:0,s:rnd(6,11)});
  }
  st.chainPop=Math.max(0,st.chainPop-dt*3);st.chainEnd=Math.max(0,st.chainEnd-dt);
  if(play)critUpdate(dt);
  koiUpdate(dt,play);                             // the koi keep swimming through the Full Moon (they just carry nothing)
  owlUpdate(dt,play);                             // the owl flies, perches and watches (its visits wait out the Full Moon, which it watches rise)
  st.tint+=((st.chain?Math.min(1,0.4+0.2*st.chain):0)-st.tint)*Math.min(1,dt*4);
  // every pod comes down the waterfall (the koi do the merging: koiUpdate)
  const live=livePods();
  fallsUpdate(dt,play,live,bo);WFX.step(dt*SEA.S.falls.pace);   // (the season sets how fast the falls' water runs)
  seaUpdate(dt);                                  // what drifts over the garden and down the falls this season
  sndUpdate(dt);                                  // the pond's sound: each stream's rush follows its flow, the season's night around it
  // ambient fireflies drifting up to the counter
  if(play)st.bugAcc+=dt*Math.min(4,0.4+live*0.15)*(st.boost>0?2:1)*FX[Q];
  while(st.bugAcc>=1){st.bugAcc-=1;if(pods.length){const p=pods[Math.floor(Math.random()*pods.length)];if(!p.dead)spawnBug(p);}}
  if(drag){
    const e=Math.exp(-12*dt),p=drag.p;drag.offx*=e;drag.offy=drag.lift+(drag.offy-drag.lift)*e;
    if(p.dead||p.busy)drag=null;
    else{p.x=clamp(drag.x+drag.offx,BX0-10,BX1+10);p.y=clamp(drag.y+drag.offy,POD_Y0-10,BY1+10);}
  }
  physics(dt);driftUpdate(dt);
  const dp=drag&&drag.p,calm=waves.length<WAVE_CAP[Q]-8,SP=LILY.spring,rd=Math.exp(-1.2*dt);
  for(const p of pods){
    if(p.dead)continue;
    p.born=Math.min(1,p.born+dt*4);p.pop=Math.max(0,p.pop-dt*3);p.dr+=(p.r-p.dr)*Math.min(1,dt*10);
    p.sv+=(-SP[0]*p.sq-SP[1]*p.sv)*dt;p.sq=clamp(p.sq+p.sv*dt,-0.3,0.3);   // squash and stretch settle on a spring;
    p.rv=(p.rv+(0.05*Math.sin(clock*0.31+p.id*1.7)-0.6*p.rot)*dt)*rd;p.rot+=p.rv*dt;   // the pad turns a little and eases back;
    p.bu=Math.min(1,p.bu+dt*3.2);p.bk=Math.max(0,p.bk-dt);   // a new bud stage grows in
    for(const f of p.ff)if(f.cd>0){f.cd-=dt;if(f.cd<=0)f.back=0.4;}else if(f.back>0)f.back-=dt;
    if(p.burstT>=0){if(play){p.burstT+=dt;if(p.burstT>=0.45)doBurst(p);}}
    else if(p!==dp&&(p.wv-=dt)<=0){p.wv=rnd(2.5,5);if(calm)wave(p.x,p.y,p.dr+1,p.dr+14,0.2,1.6);}   // floating pods bob: faint rings
  }
  // lists are compacted in place (no per-frame array allocations)
  let j=0;
  for(let i=0;i<merges.length;i++){
    const m=merges[i];m.t+=dt;const u=Math.min(1,m.t/m.dur),k=easeIO(u);
    m.a.x=lerp(m.ax,m.b.x,k);m.a.y=lerp(m.ay,m.b.y,k);
    m.a.sa=m.b.sa=m.an;m.a.sq=0.16*Math.sin(Math.PI*u);m.b.sq=-0.07*u*u;m.a.sv=m.b.sv=0;   // the glider stretches on its way, its twin braces for it
    if(m.t>=m.dur)finishMerge(m);else merges[j++]=m;
  }
  merges.length=j;j=0;
  for(let i=0;i<pods.length;i++)if(!pods[i].dead)pods[j++]=pods[i];
  pods.length=j;j=0;
  const dm=Math.exp(-2*dt);
  for(let i=0;i<parts.length;i++){
    const p=parts[i];p.t+=dt;
    if(p.t>=p.life){if(p.k===1&&Math.random()<0.35&&inPond(p.x,p.y))wave(p.x,p.y,1,10,0.35,0.7);continue;}   // petals settle on the water
    if(p.k!==2){p.vx*=dm;p.vy*=dm;}
    if(p.k===1){p.vy+=70*dt;p.rot+=p.vr*dt;}else if(p.k===3)p.vy+=420*dt;
    else if(p.k===5){p.vy+=22*dt;p.vx+=Math.sin(p.t*2.8+p.ph)*40*dt;p.rot=Math.sin(p.t*2.6+p.ph)*0.9;}   // down sways as it drifts
    p.x+=p.vx*dt;p.y+=p.vy*dt;parts[j++]=p;
  }
  parts.length=j;j=0;
  bloomUpdate(dt);
  for(let i=0;i<bugs.length;i++){
    const b=bugs[i];b.t+=dt;
    if(b.t<b.dur){bugs[j++]=b;continue;}
    st.pulse=Math.min(1,st.pulse+(b.g||b.f?0.5:0.2));
    if(b.g){addGlow(b.g);if(Math.random()<0.5)spark(hudX,38,rnd(40,90));if(thr('a',0.06))tone(1175,0.05,'sine',0.02,1.1);}
    else if(b.f){for(let k=0;k<3;k++)twinkle(hudX,38,rnd(30,80));tone(1568,0.12,'sine',0.025,1.05);}   // a buy's firefly lands: a glint and a tiny ting
  }
  bugs.length=j;j=0;
  for(let i=0;i<rings.length;i++){const r=rings[i];r.t+=dt;if(r.t<0.7)rings[j++]=r;}
  rings.length=j;j=0;
  for(let i=0;i<waves.length;i++){const w=waves[i];w.t+=dt;if(w.t<w.life)waves[j++]=w;}
  waves.length=j;j=0;
  for(let i=0;i<texts.length;i++){const t=texts[i];t.t+=dt;t.y-=28*dt;if(t.t<t.life)texts[j++]=t;else if(TXT_POOL.length<TEXT_CAP[2])TXT_POOL.push(t.spr.img);}
  texts.length=j;
  st.shake=Math.max(0,st.shake-dt*40);st.flash=Math.max(0,st.flash-dt*2);
  if(!DEMO){st.saveT+=dt;if(st.saveT>5){st.saveT=0;save();}}
}

function drawSeasonRow(){                         // the MOON tab shows the season, right of the pod timer: its glyph, its name, and three pips (early, mid, late: the one now lit)
  const a=SEA.row;if(a<0.01)return;
  const S=SEA.S,y=BAR_Y,tx=319,T=textArt(S.name,11.5,true,S.col,0),A=seaArt();
  ctx.globalAlpha=a;ctx.drawImage(A.icon[SEA.s],tx-T.w-21,y-10,20,20);
  ctx.textAlign='right';ctx.textBaseline='middle';label(S.name,tx,y+0.5,11.5,true,S.col);
  for(let j=0;j<3;j++){
    const px=327+j*8,on=j===SEA.j;
    if(on){ctx.globalAlpha=a*0.8;ctx.drawImage(S.glow,px-8,y-8,16,16);}
    ctx.globalAlpha=a*(on?1:j<SEA.j?0.6:0.4);circ(px,y,on?3.2:2.3);
    if(j<=SEA.j){ctx.fillStyle=S.col;ctx.fill();}else{ctx.strokeStyle=UI.ink;ctx.lineWidth=1;ctx.stroke();}
  }
  ctx.globalAlpha=1;
}
function drawSeasonIn(){                          // the new season blooming in over the pond (the Full Moon's last beat): its name in its colours, its twist under it
  const t=SIN.t-0.3;if(SIN.t<0||t<0)return;       // (once the parting light has opened past it)
  baseT();const S=SEA.S,T=seasonTitle(SEA.k),a=Math.min(1,t*5)*clamp((SIN_LIFE-SIN.t)/0.5,0,1),z=Math.max(0.01,easeOutBack(Math.min(1,t/0.45)))*(1+0.012*Math.sin(t*3)),y=SIN_Y-10*easeOut(Math.min(1,t/0.8));
  ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a*0.45;ctx.drawImage(S.glow,30,y-70,300,140);ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=a;ctx.drawImage(T.img,180-T.w*z/2,y-T.h*z/2,T.w*z,T.h*z);
  const a2=a*clamp((t-0.35)*4,0,1);if(a2>0.01){ctx.globalAlpha=a2;ctx.textAlign='center';ctx.textBaseline='middle';label(S.twist,180,y+34,15,true,S.col,300);}
  ctx.globalAlpha=1;
}
function render(){
  const ls=lvlSum(),grow=Math.min(1,(st.blooms*2+ls)/60),bo=st.boost>0,dex=drag?drag.p:null;
  const gk=Math.round(grow*20);if(gk!==bgKey||bgcF!==frontArt()){bgKey=gk;buildBgc(grow);}   // (a new front layer too: the shop's floor is in it)
  const np=Math.min(DPAD.length,3+ls);            // a lily pad more by the banks with every level bought
  if(np!==bedKey){if(bedKey>=0&&np>bedKey){padFrom=bedKey;padT0=clock;}bedKey=np;}
  const sh=dir.chill?0:st.shake,sx=(sh?rnd(-sh,sh)*0.6:0)+fm.cx,sy=(sh?rnd(-sh,sh)*0.6:0)+fm.cy;   // plus the Full Moon's slow camera sway (the CHILL scene: a still camera)
  BS=dpr*scale;BXo=dpr*(ox+sx*scale);BYo=dpr*(oy+sy*scale);
  // the one full-screen layer: the background composite (the bank, the pond floor, its deep middle, the screen's soft dark edges), on whole pixels
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.drawImage(BGC,Math.round(BS*sx)-BGC_M,Math.round(BS*sy)-BGC_M);baseT();
  // the pads' shadows on the floor, the moving caustics (they gather in the shallows), then everything in and on the water
  padShadows(np);drawCaustics();
  ctx.save();ctx.beginPath();ctx.rect(-1e3,-1e3,W+2e3,1e3+SHOP_OY);ctx.clip();drawWater(dex,grow,np);ctx.restore();baseT();   // (a big ripple stops at the shop's floor in the composite)
  drawFalls();                                    // the waterfall: its stone wall across the pond's top and the streams it runs
  drawFront();                                    // the stone shoreline round the rest, its beach and plants (the stones at the wall's feet stand in front of it) and the shop's floor
  drawReeds(grow);drawFrontCorner();              // (the shop's floor goes over the reeds' feet)
  drawFallsFront();                               // the waterfall's mist, moonbow and fireflies, and a pod on its way down
  drawBough();                                    // the owl's gnarled branch out of the wall's left end, under the HUD moon
  drawAmbient(ls);drawSwarms();                   // the sky's fireflies (they drift over the shop's floor too), summer's swarms
  // ripples
  for(const r of rings){const k=r.t/0.7;ctx.globalAlpha=(1-k)*0.8;ctx.strokeStyle=r.cs||(r.cs='rgb('+r.col+')');ctx.lineWidth=r.w*(1-k)+1;circ(r.x,r.y,r.max*easeIO(Math.min(1,k*1.2)));ctx.stroke();}
  ctx.globalAlpha=1;
  // lily pods, lower ones over higher ones (their lilies stand up in the 3/4 view) and a gliding one over its twin; then the blooms opening
  const hov=dex?findTarget(dex,dex.x,dex.y,dex.v,dex.r):null;
  PD.length=0;for(const p of pods)if(p!==dex)PD.push(p);
  for(let i=1;i<PD.length;i++){const p=PD[i],ky=p.y+p.mg*500;let j=i-1;while(j>=0&&PD[j].y+PD[j].mg*500>ky){PD[j+1]=PD[j];j--;}PD[j+1]=p;}   // (nearly sorted already: a few swaps)
  for(const p of PD)drawPod(p,dex&&!p.busy?(p.v===dex.v?(p===hov?3:2):1):0);
  drawBlooms();
  drawFrog();
  drawDragonflies();                              // (summer: zipping low over the water and the lilies)
  if(dex)drawPod(dex,4);
  drawTutWorld();
  // particles: glows first, the splash droplets in five brightness steps (a path each), then rotated petals (sprites, no paths)
  let nd=0;
  for(const p of parts){
    if(p.k===1||p.k===5)continue;const a=1-p.t/p.life;
    if(p.k===0){ctx.globalAlpha=a;ctx.drawImage(GLOW,p.x-p.s,p.y-p.s,p.s*2,p.s*2);}
    else if(p.k===3)nd++;
    else if(p.k===4){const z=p.s*Math.sin(Math.PI*p.t/p.life);ctx.globalAlpha=1;ctx.drawImage(TWK,p.x-z,p.y-z,z*2,z*2);}   // twinkles
    else{ctx.globalAlpha=a*Math.min(1,p.t*4)*0.8;ctx.drawImage(PGLOW,p.x-p.s,p.y-p.s,p.s*2,p.s*2);}
  }
  if(nd){ctx.fillStyle='#d6f5ff';for(let b=0;b<5;b++){
    let any=false;
    for(const p of parts){if(p.k!==3||Math.min(4,Math.floor((1-p.t/p.life)*5))!==b)continue;if(!any){any=true;ctx.beginPath();}const r=Math.max(0.1,p.s);ctx.moveTo(p.x+r,p.y);ctx.arc(p.x,p.y,r,0,Math.PI*2);}
    if(any){ctx.globalAlpha=0.9*(b+0.5)/5;ctx.fill();}
  }}
  for(const p of parts){                          // petals, and the owl's down drifting off
    if(p.k===1){ctx.globalAlpha=1-p.t/p.life;drawRot(PET,p.x,p.y,p.s*2,p.s,p.rot);}
    else if(p.k===5&&OWL_DOWN){ctx.globalAlpha=Math.min(1,(1-p.t/p.life)*3);drawRot(OWL_DOWN,p.x,p.y,p.s*2.4,p.s*1.2,p.rot);}
  }
  baseT();
  drawSeason();                                   // the season's petals, sparkles, leaves or snow drifting over the garden and down the falls
  drawBadges();                                   // every lily's number, over the petals and sparks
  drawMoth();drawStar();
  // fireflies flying glow up to the counter: glows + trails, then all wings in one path
  for(const b of bugs){
    const k=b.t/b.dur,q=bugPos(b,k);b.qx=q.x;b.qy=q.y;   // q is a shared scratch point: keep the copy
    if(b.f)continue;                              // (a buy's firefly flies over the shop: drawThanks)
    if(!b.g){ctx.globalAlpha=0.5;ctx.drawImage(GLOW,b.qx-6,b.qy-6,12,12);continue;}
    if(Q>=2)for(let i=2;i>=1;i--){const o=bugPos(b,k-i*0.06);ctx.globalAlpha=0.45-i*0.12;ctx.drawImage(GLOW,o.x-8+i*1.5,o.y-8+i*1.5,16-i*3,16-i*3);}
    ctx.globalAlpha=1;ctx.drawImage(FFS,b.qx-13,b.qy-13,26,26);
  }
  if(Q>=1&&bugs.length){
    ctx.globalAlpha=0.55;ctx.fillStyle='#fff';ctx.beginPath();
    for(const b of bugs){
      if(!b.g)continue;const w=Math.abs(Math.sin(clock*40+b.bend))*5+1,x=b.qx,y=b.qy;
      ctx.moveTo(x-3+4*Math.cos(-0.5),y-2+4*Math.sin(-0.5));ctx.ellipse(x-3,y-2,4,w,-0.5,0,Math.PI*2);
      ctx.moveTo(x+3+4*Math.cos(0.5),y-2+4*Math.sin(0.5));ctx.ellipse(x+3,y-2,4,w,0.5,0,Math.PI*2);
    }
    ctx.fill();
  }
  ctx.globalAlpha=1;
  // floating texts: pre-rendered sprites, popping in
  for(const t of texts){
    const k=t.t/t.life,z=t.t<0.15?Math.max(0.01,easeOutBack(t.t/0.15)):1,S=t.spr,w=S.w*z,h=S.h*z;
    ctx.globalAlpha=k>0.7?(1-k)/0.3:1;ctx.drawImage(S.img,t.x-w/2,t.y-h/2,w,h);
  }
  ctx.globalAlpha=1;
  // chain tint: a pulsing pink vignette (cached image) that deepens with every bloom in the chain
  if(st.tint>0.01){
    ctx.globalAlpha=st.tint*(0.8+0.2*Math.sin(clock*(4+st.chain*1.5)));
    const vx=-ox/scale-12,vy=-oy/scale-12;ctx.drawImage(VIG,vx,vy,W-2*vx,H-2*vy);ctx.globalAlpha=1;
  }
  // HUD: the moon, the glow counter and its rate as one group on a soft night haze, a fine gold thread between the counter and the rate;
  // the counter's firefly brightens as caught ones arrive
  const A=uiArt();ctx.globalAlpha=1;ctx.drawImage(A.hud,0,0,HUD_W,HUD_H);
  const r=rate(),txt=fmt(st.glow),sc=1+st.pulse*0.08;
  ctx.save();ctx.translate(180,38);ctx.scale(sc,sc);
  const tw=textSlot(HUD_TS,txt,32,true,'#fffaf0',0).w,ix=10-tw/2-20;   // (its sprite is baked again only when the number changes)
  hudX=180+ix*sc;
  const gs=15+st.pulse*12;ctx.globalAlpha=0.55+st.pulse*0.45;ctx.drawImage(GLOW,ix-gs,1-gs,gs*2,gs*2);ctx.globalAlpha=1;
  fireflyFig(ix,0,1.05,Math.abs(Math.sin(clock*18)));
  ctx.textAlign='center';ctx.textBaseline='middle';label(txt,10,1.5,32,true,'#fffaf0',0,null,HUD_TS);
  ctx.restore();
  const fz=st.frenzy>0,ch=dir.chill;ctx.textAlign='center';ctx.textBaseline='middle';   // (ch: the CHILL scene's HUD is just the moon and the counter)
  if(!ch){
    label('+'+fmt(r,1)+' /s'+(fz?'  FRENZY':'')+(bo?'  BOOST':''),190,71,16,true,fz?C.white:bo?C.petal:C.gold,196);
    if(bo&&fz){drawBar(126,87,58,st.boost/BOOST_MAX,C.petal,PGLOW);drawBar(196,87,58,st.frenzy/st.frenzyD,C.white,MGLOW);}   // thin glowing lines under the rate
    else if(bo)drawBar(130,87,120,st.boost/BOOST_MAX,C.petal,PGLOW);
    else if(fz)drawBar(130,87,120,st.frenzy/st.frenzyD,C.white,MGLOW);
    drawChain();
  }
  // the moon waxes toward the next Full Moon; once full it pulses and asks for a tap
  const mr=moonReady()&&!fm.on&&!ch,ms=1+0.5*st.moonFx*st.moonFx+(mr?0.06*Math.sin(clock*5):0);
  drawMoon(MX,MY,20*ms,0.08+0.92*Math.min(1,st.moonG/moonNeed(st.moons)));
  drawOwl();                                      // the night owl beside the moon (a silhouette crossing it as it flies in and off)
  if(mr){
    const k=(clock%1.2)/1.2;ctx.globalAlpha=1-k;ctx.strokeStyle=C.white;ctx.lineWidth=3;circ(MX,MY,24+k*18);ctx.stroke();ctx.globalAlpha=1;
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=font(14,true);ctx.lineWidth=4;ctx.lineJoin='round';ctx.strokeStyle='rgba(3,8,20,0.9)';
    ctx.strokeText('TAP!',MX,MY+34);ctx.fillStyle=C.white;ctx.fillText('TAP!',MX,MY+34);ctx.lineJoin='miter';
  }else if(!fm.on&&!ch)for(let i=0;i<st.mt.length;i++){   // Moon Tasks: a pip each under the moon, filled pink once done
    const x=MX-11+i*11,y=MY+27,f=st.mtFx[i];
    if(st.mt[i].done){
      if(f>0){ctx.globalAlpha=f;ctx.drawImage(PGLOW,x-12,y-12,24,24);ctx.globalAlpha=1;}
      ctx.fillStyle=C.petal;circ(x,y,3.5+f*2.5);ctx.fill();
    }else{ctx.strokeStyle='rgba(244,247,255,0.5)';ctx.lineWidth=1.5;circ(x,y,3);ctx.stroke();}
  }
  drawTutHud();
  if(!ch){                                        // (the CHILL scene: no buttons, pod timer or shop: the garden's dark floor shows under the pond)
    drawIconButtons();drawFallTimer();
    drawTabs();
    for(let i=0;i<3;i++)drawButton(i);
    drawPager();
    drawSeasonRow();                              // (the MOON tab: the season and its step)
    drawThanks();
  }
  drawTutCard();
  drawWelcome();
  drawBanner();
  if(st.resetArm>0){const R=A.rst;ctx.globalAlpha=Math.min(1,st.resetArm*4);ctx.drawImage(R.c,176-R.m,100-R.m,164+R.m*2,30+R.m*2);ctx.globalAlpha=1;}   // "Tap again to restart"
  if(st.help)drawHelp();
  if(st.moonCard)drawMoonCard();
  if(fm.on||FMP.n)drawFullMoon();
  drawSeasonIn();                                 // the new season's name blooming in as the Full Moon's light parts
  if(DEMO&&!fm.on&&!ch)drawFinger(ai.px,ai.py,ai.phase===2||ai.tap>0);
  if(DEMO_SND&&(!AC||AC.state!=='running')){ctx.globalAlpha=0.75;ctx.textAlign='center';ctx.textBaseline='middle';label('Tap for sound',180,633,12,false,UI.ink);ctx.globalAlpha=1;}
  if(st.flash>0&&!ch){ctx.globalAlpha=1;ctx.fillStyle=`rgba(255,238,248,${st.flash*0.55})`;ctx.fillRect(-500,-500,W+1000,H+1000);}
}

// ---------- loop ----------
function perf(gap){                               // sustained slow frames -> fewer effects first (resolution only down to 1.5x); fast again -> back up
  if(DEMO)return;                                 // a recording steps the clock itself: its frame gaps say nothing about the device, keep full quality
  upT+=gap;if(upT<2||gap>0.25)return;
  perfEma+=(gap-perfEma)*0.05;
  if(perfEma>0.022){perfGood=0;if(Q>0){perfBad+=gap;if(perfBad>1.5){Q--;perfBad=0;perfEma=1/60;resize();}}}
  else{perfBad=Math.max(0,perfBad-gap);if(Q<2&&perfEma<0.0145){perfGood+=gap;if(perfGood>4){Q++;perfGood=0;resize();}}else perfGood=0;}
}
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  try{
    const gap=Math.max(0,(now-last)/1000);last=now;
    if(gap>3&&!fm.on)awardAway(gap);             // tab was in the background: fireflies kept working (the Full Moon's garden is frozen)
    perf(gap);
    update(Math.min(0.05,gap));render();
  }catch(e){showErr(e);}
}
newGame(false);
shoreArt();BED0=bakeFloor(PAL);bed0Pal=palKey;   // the heavy bakes before the first frame (render keeps them fresh after a resize or a new moon)
try{fallArt();koiArt();owlArt();boughArt();frogArt();uiArt();fmSprites();bloomArt(true);ambArt();seaArt();drgArt();if(SEA.M.ice)iceArt();}catch(e){}   // (the rest of the per-density art too, so the first frames never stall on a bake)
if(DEMO_SND)initAudio();                          // demo with sound=1: try right away (a tap unlocks it if the browser says no)
requestAnimationFrame(frame);
})();
