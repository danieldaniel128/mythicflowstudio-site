<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Geode Gambit</title>
<style>
html,body{margin:0;height:100%;background:#141826;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block;touch-action:none}
#err{position:fixed;left:8px;right:8px;bottom:8px;display:none;z-index:9;padding:8px 10px;border-radius:8px;background:#b0203c;color:#fff;font:14px system-ui,sans-serif}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err"></div>
<script>
(function () {
'use strict';
const W = 360, H = 640;
const DEMO = /[?&]demo=1(&|$)/.test(location.search);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const errEl = document.getElementById('err');
function showErr(e) { errEl.style.display = 'block'; errEl.textContent = 'Error: ' + (e && e.message ? e.message : e); }
window.addEventListener('error', ev => showErr(ev.error || ev.message));

const C = { bg: '#141826', cyan: '#4ff0ff', pink: '#ff3f7a', gold: '#ffd23f', white: '#f4f6ff', dark: '#0b0d16' };
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';

// ---------- layout / scaling ----------
let dpr = 1, scale = 1, ox = 0, oy = 0, vw = 0, vh = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  vw = window.innerWidth; vh = window.innerHeight;
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
  scale = Math.min(vw / W, vh / H);
  ox = (vw - W * scale) / 2; oy = (vh - H * scale) / 2;
}
window.addEventListener('resize', resize);
resize();

// ---------- audio (only after a user gesture, never in demo) ----------
let AC = null, master = null, noiseBuf = null;
function initAudio() {
  if (DEMO) return;
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
  } catch (e) { AC = null; }
}
function tone(f, d, type, v, f2, delay) {
  if (!AC) return;
  const t = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v || 0.2, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.03);
}
function noise(d, v, fc) {
  if (!AC) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const a = noiseBuf.getChannelData(0);
    for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass';
  f.frequency.setValueAtTime(fc || 3000, t); f.frequency.exponentialRampToValueAtTime(150, t + d);
  g.gain.setValueAtTime(v || 0.3, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + d + 0.03);
}

// ---------- helpers ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
function easeOutBack(t) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function text(s, x, y, size, color, align, stroke) {
  ctx.font = '900 ' + size + 'px ' + FONT;
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  if (stroke !== false) { ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size * 0.18); ctx.strokeStyle = C.dark; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}

// ---------- world ----------
const GX = 180, GY = 340, RX = 112, RY = 90;          // geode (top face)
const BT = { x: 180, y: 430, hw: 172, hh: 86, th: 44 }; // isometric workbench
const ZONE = 0.65;       // pressure where a strike shatters
const TOL = 18;          // "on vein" distance
const CARVE_R = 13;      // chisel carve radius
const STEP = 7;          // vein sample spacing
const TIERS = [0.25, 0.45, ZONE, 0.8, 0.9]; // pressure levels where every crack snaps wider

let S = null, parts = [], floats = [];
let shakeAmt = 0, flashA = 0, flashC = '#fff', hitStop = 0;
let best = 0;
try { best = +localStorage.getItem('geodeGambitBest') || 0; } catch (e) { best = 0; }

function inEll(x, y, k) { const dx = (x - GX) / RX, dy = (y - GY) / RY; return dx * dx + dy * dy < k * k; }

function makeVeins() {
  const out = [], base = Math.random() * Math.PI * 2;
  for (let k = 0; k < 4; k++) {
    const a0 = base + k * Math.PI / 2 + rnd(-0.25, 0.25);
    const a1 = a0 + Math.PI * rnd(0.6, 0.95);
    let pts = [{ x: GX + Math.cos(a0) * RX * 0.84, y: GY + Math.sin(a0) * RY * 0.84 },
               { x: GX + Math.cos(a1) * RX * 0.84, y: GY + Math.sin(a1) * RY * 0.84 }];
    let amp = 26;
    for (let l = 0; l < 4; l++) {
      const np = [pts[0]];
      for (let i = 1; i < pts.length; i++) {
        const p = pts[i - 1], q = pts[i];
        const dx = q.x - p.x, dy = q.y - p.y, L = Math.hypot(dx, dy) || 1, o = rnd(-1, 1) * amp;
        let x = (p.x + q.x) / 2 - dy / L * o, y = (p.y + q.y) / 2 + dx / L * o;
        const ex = (x - GX) / RX, ey = (y - GY) / RY, e = Math.hypot(ex, ey);
        if (e > 0.86) { x = GX + ex / e * 0.86 * RX; y = GY + ey / e * 0.86 * RY; }
        np.push({ x, y }, q);
      }
      pts = np; amp *= 0.5;
    }
    // resample evenly so every point is one "cut"
    const rs = [{ x: pts[0].x, y: pts[0].y, c: false }];
    let prev = pts[0], need = STEP;
    for (let i = 1; i < pts.length; i++) {
      const q = pts[i]; let px = prev.x, py = prev.y, d = Math.hypot(q.x - px, q.y - py);
      while (d >= need) {
        const t = need / d; px += (q.x - px) * t; py += (q.y - py) * t;
        rs.push({ x: px, y: py, c: false }); d -= need; need = STEP;
      }
      need -= d; prev = q;
    }
    out.push(rs);
  }
  return out;
}

function makeCracks(poly) {
  const cr = [], N = poly.length;
  const K = 10, order = [];
  for (let k = 0; k < K; k++) order.push(k);
  for (let k = K - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); const t = order[k]; order[k] = order[j]; order[j] = t; }
  for (let k = 0; k < K; k++) {
    const p = poly[(Math.floor(order[k] * N / K) + Math.floor(Math.random() * 2)) % N];
    let x = p.x, y = p.y, ang = Math.atan2(GY - y, GX - x);
    const pts = [{ x, y }];
    for (let i = 0; i < 6; i++) { ang += rnd(-0.45, 0.45); x += Math.cos(ang) * 15; y += Math.sin(ang) * 12; pts.push({ x, y }); }
    cr.push({ pts, th: 0.1 + k * 0.085, n: 0, snap: 0 });
  }
  return cr;
}

function newGame(started) {
  const poly = [], N = 28, seed = Math.random() * 10;
  for (let i = 0; i < N; i++) {
    const a = i / N * Math.PI * 2;
    const r = 1 + 0.07 * Math.sin(a * 3 + seed) + 0.05 * Math.sin(a * 5 + seed * 2) + rnd(-0.02, 0.02);
    poly.push({ x: GX + Math.cos(a) * RX * r, y: GY + Math.sin(a) * RY * r });
  }
  const veins = makeVeins();
  let total = 0; veins.forEach(v => total += v.length);
  const speck = [];
  while (speck.length < 45) { const x = rnd(GX - RX, GX + RX), y = rnd(GY - RY, GY + RY); if (inEll(x, y, 0.92)) speck.push({ x, y, s: rnd(1.5, 3.5) }); }
  S = {
    state: 'play', t: 0, endT: 0, started: !!started, poly, veins, total, carved: 0, speck, seed,
    cracks: makeCracks(poly), dents: [], pressure: 0, score: 0, streak: 0, pop: 0, beat: 0, inZone: false,
    tier: 0, widen: 0, thump: 0, bulge: 0, snapCd: 0, wpoly: poly, zoneK: 0,
    carveSnd: 0, payout: 0, shown: 0, mult: 1, tick: 0, shards: [], ring: null, msg: '', sub: '', newBest: false
  };
  parts = []; floats = [];
  P.down = false; P.carving = false; P.tap = false;
}

// ---------- fx ----------
function shake(a) { shakeAmt = Math.max(shakeAmt, a); }
function flash(c, a) { flashC = c; flashA = Math.max(flashA, a); }
function addP(o) { if (parts.length < 520) parts.push(o); }
function float(x, y, s, col, size) { floats.push({ x, y, s, col, size, life: 0.9, max: 0.9 }); }
function sparks(x, y, n, col) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = rnd(60, 220);
    addP({ t: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: rnd(0.25, 0.5), max: 0.5, sz: 2, col, g: 300 });
  }
}
function chips(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = rnd(40, 200);
    addP({ t: 'chip', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 160, life: rnd(0.5, 0.9), max: 0.9, sz: rnd(2, 5), col: '#8a84a3', g: 900, rot: 0, vr: rnd(-10, 10) });
  }
}
function benchFloor(x) {
  const fy = BT.y - 20 + Math.random() * 90;
  return Math.abs(x - BT.x) / BT.hw + Math.abs(fy - BT.y) / BT.hh < 1 ? fy : 9999;
}

// ---------- rules ----------
function veinDist(x, y) {
  let m = 1e9;
  for (const v of S.veins) for (const p of v) { const d = (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y); if (d < m) m = d; }
  return Math.sqrt(m);
}
function carveAt(x, y) {
  let n = 0;
  for (const v of S.veins) for (const p of v) {
    if (!p.c && (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y) < CARVE_R * CARVE_R) { p.c = true; n++; }
  }
  if (!n) return;
  const before = Math.floor(S.streak / 10);
  S.carved += n; S.streak += n; S.score += n * 10;
  S.pressure += n * 0.38 / S.total;
  sparks(x, y, n * 2, C.cyan); chips(x, y, n);
  shake(1.5);
  S.carveSnd += n;
  if (S.carveSnd >= 2) { S.carveSnd = 0; tone(520 + Math.min(S.streak, 90) * 10, 0.05, 'triangle', 0.08); }
  const after = Math.floor(S.streak / 10);
  if (after > before) {
    S.pop = 1;
    float(x, y - 30, '×' + (1 + S.streak * 0.1).toFixed(1), C.cyan, 28);
    tone(880 + after * 90, 0.14, 'triangle', 0.14); tone(1320 + after * 90, 0.14, 'triangle', 0.08, null, 0.06);
  }
}
function slip(x, y) {
  P.carving = false;
  if (S.streak > 0) {
    float(x, y - 22, 'SLIP!', C.pink, 28);
    S.streak = 0; shake(6); flash(C.pink, 0.18);
    tone(150, 0.2, 'sawtooth', 0.12, 70);
  }
}
function strike(x, y) {
  if (S.pressure >= ZONE) { shatter(x, y); return; }
  float(x, y - 26, 'THUD! too solid', C.white, 24);
  if (S.streak > 0) float(x, y + 6, 'streak lost', C.pink, 20);
  S.streak = 0; S.pressure = Math.min(0.99, S.pressure + 0.06);
  S.dents.push({ x, y });
  shake(9); flash(C.white, 0.2); chips(x, y, 14);
  tone(90, 0.22, 'square', 0.2, 45); noise(0.14, 0.35, 1200);
}
function shatter(x, y) {
  S.mult = 1 + S.streak * 0.1;
  S.payout = Math.round(S.score * S.mult * (1 + (S.pressure - ZONE) * 1.5));
  S.state = 'shatter'; S.endT = 0; S.shown = 0;
  if (S.payout > best) { best = S.payout; S.newBest = S.payout > 0; try { localStorage.setItem('geodeGambitBest', best); } catch (e) {} }
  const N = S.poly.length, K = 9, cols = [C.cyan, C.cyan, C.pink, C.gold];
  for (let k = 0; k < K; k++) {
    const i0 = Math.floor(k * N / K), i1 = Math.floor((k + 1) * N / K);
    const pts = [{ x: x + rnd(-6, 6), y: y + rnd(-6, 6) }];
    for (let i = i0; i <= i1; i++) pts.push(S.wpoly[i % N]); // the bulged outline currently on screen
    let cx = 0, cy = 0; pts.forEach(p => { cx += p.x; cy += p.y; }); cx /= pts.length; cy /= pts.length;
    const a = Math.atan2(cy - y, cx - x), sp = rnd(220, 480);
    S.shards.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 280, r: 0, vr: rnd(-8, 8),
      pts: pts.map(p => ({ x: p.x - cx, y: p.y - cy })), col: cols[k % cols.length] });
  }
  for (let i = 0; i < 95; i++) {
    const a = Math.random() * Math.PI * 2, s = rnd(80, 420), gx = x + rnd(-40, 40), gy = y + rnd(-30, 30);
    addP({ t: 'gem', x: gx, y: gy, vx: Math.cos(a) * s, vy: Math.sin(a) * s * 0.6 - rnd(250, 600), life: 99, max: 99,
      sz: rnd(4, 10), col: cols[i % cols.length], g: 1100, rot: rnd(0, 6), vr: rnd(-12, 12), floor: benchFloor(gx) });
  }
  sparks(x, y, 40, C.white);
  S.ring = { x, y, t: 0 };
  shake(24); flash(C.white, 0.9); hitStop = 0.09;
  noise(0.7, 0.6, 6000); tone(90, 0.6, 'sine', 0.5, 30);
  for (let i = 0; i < 8; i++) tone(700 + i * 190, 0.28, 'triangle', 0.1, null, 0.08 + i * 0.05);
}
function crumble() {
  S.state = 'crumble'; S.endT = 0; S.msg = 'CRUMBLED'; S.sub = 'Waited too long. Smash in the red!';
  for (let i = 0; i < 150; i++) {
    let x, y; do { x = rnd(GX - RX, GX + RX); y = rnd(GY - RY, GY + RY); } while (!inEll(x, y, 1));
    addP({ t: 'dust', x, y, vx: rnd(-90, 90), vy: rnd(-160, 20), life: 99, max: 99, sz: rnd(2, 6),
      col: Math.random() < 0.15 ? C.cyan : (Math.random() < 0.5 ? '#5b5670' : '#7a7494'), g: 900, floor: benchFloor(x) });
  }
  shake(16); flash(C.pink, 0.45);
  noise(0.9, 0.45, 700); tone(140, 0.7, 'sawtooth', 0.15, 40);
}
function seal() {
  S.state = 'sealed'; S.endT = 0; S.msg = 'SEALED'; S.sub = 'Carved too clean. It held together!';
  shake(6); flash(C.cyan, 0.35);
  tone(620, 0.16, 'sine', 0.15, 320); tone(300, 0.45, 'sine', 0.15, 140, 0.15);
}
// a crack jumps one segment further: tiny pop at its tip
function crackSnap(x, y) {
  const w = warp(x, y), z = S.pressure >= ZONE;
  chips(w.x, w.y, 3); sparks(w.x, w.y, z ? 5 : 3, z ? C.pink : C.white);
  shake(z ? 3 : 1.8);
  if (S.snapCd <= 0) { S.snapCd = 0.07; noise(0.05, 0.16, 5000); tone(1700 + rnd(0, 700), 0.03, 'square', 0.03); }
}
// pressure crossed a tier: every crack snaps wider and the geode lurches
function tierSnap() {
  S.widen = 1; S.thump = 1;
  shake(4 + S.tier * 1.6); flash(C.pink, 0.06 + S.tier * 0.03);
  for (const c of S.cracks) if (c.n > 0) { c.snap = 1; const p = c.pts[c.n], w = warp(p.x, p.y); chips(w.x, w.y, 2); }
  noise(0.2, 0.4, 2600); tone(320 - S.tier * 35, 0.14, 'square', 0.1, 70);
}
// swell the geode outward from its center; rim moves most, interior barely
function warp(x, y) {
  const dx = x - GX, dy = y - GY;
  if (S.bulge <= 0) return { x, y };
  const nx = dx / RX, ny = dy / RY, e2 = nx * nx + ny * ny;
  const lobe = 0.65 + 0.35 * Math.sin(Math.atan2(ny, nx) * 3 + S.seed);
  const k = S.bulge * lobe * Math.min(1.3, e2);
  return { x: GX + dx * (1 + k), y: GY + dy * (1 + k * 0.75) };
}

// ---------- input ----------
const P = { down: false, x: 268, y: 478, lx: 0, ly: 0, sx: 0, sy: 0, t0: 0, carving: false, tap: false, vis: true };
function inputDown(x, y, t) {
  if (S.state !== 'play') { if (S.endT > 0.7) newGame(true); return; }
  S.started = true;
  P.down = true; P.x = P.lx = P.sx = x; P.y = P.ly = P.sy = y; P.t0 = t; P.vis = true;
  if (veinDist(x, y) < TOL) { P.carving = true; P.tap = false; carveAt(x, y); }
  else { P.carving = false; P.tap = true; }
}
function inputMove(x, y) {
  P.x = x; P.y = y;
  if (!P.down || S.state !== 'play') { P.lx = x; P.ly = y; return; }
  if (P.tap && Math.hypot(x - P.sx, y - P.sy) > 14) P.tap = false;
  const mdx = x - P.lx, mdy = y - P.ly, L = Math.hypot(mdx, mdy);
  const steps = Math.max(1, Math.ceil(L / 5));
  for (let i = 1; i <= steps; i++) {
    const ix = P.lx + mdx * i / steps, iy = P.ly + mdy * i / steps, d = veinDist(ix, iy);
    if (P.carving) { if (d > TOL * 1.5) { slip(ix, iy); break; } carveAt(ix, iy); }
    else if (!P.tap && d < TOL) { P.carving = true; carveAt(ix, iy); }
  }
  P.lx = x; P.ly = y;
}
function inputUp(x, y, t) {
  if (!P.down) return;
  P.down = false;
  if (S.state === 'play' && P.tap && t - P.t0 < 400 && inEll(x, y, 1.05)) strike(x, y);
  P.carving = false; P.tap = false;
}
function toGame(e) { return { x: (e.clientX - ox) / scale, y: (e.clientY - oy) / scale }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); if (DEMO) return;
  initAudio();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const p = toGame(e); inputDown(p.x, p.y, performance.now());
}, { passive: false });
cv.addEventListener('pointermove', e => { e.preventDefault(); if (DEMO) return; const p = toGame(e); inputMove(p.x, p.y); }, { passive: false });
cv.addEventListener('pointerup', e => { e.preventDefault(); if (DEMO) return; const p = toGame(e); inputUp(p.x, p.y, performance.now()); }, { passive: false });
cv.addEventListener('pointercancel', () => { P.down = false; P.carving = false; P.tap = false; });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

// ---------- demo AI ----------
const AI = { phase: 'toVein', vi: 0, idx: 0, x: 268, y: 478, tx: 0, ty: 0, wait: 0 };
function aiMove(x, y, dt, sp) {
  const dx = x - AI.x, dy = y - AI.y, d = Math.hypot(dx, dy);
  if (d < sp * dt) { AI.x = x; AI.y = y; return true; }
  AI.x += dx / d * sp * dt; AI.y += dy / d * sp * dt; return false;
}
function aiPickStrike() {
  let bx = GX, by = GY, bd = -1;
  for (let i = 0; i < 80; i++) {
    const x = rnd(GX - RX * 0.6, GX + RX * 0.6), y = rnd(GY - RY * 0.6, GY + RY * 0.6);
    if (!inEll(x, y, 0.6)) continue;
    const d = veinDist(x, y); if (d > bd) { bd = d; bx = x; by = y; }
  }
  AI.tx = bx; AI.ty = by; AI.wait = 0; AI.phase = 'toStrike';
}
function demoUpdate(dt, now) {
  if (S.state !== 'play') {
    if (S.endT > 2.6) { newGame(true); AI.phase = 'toVein'; AI.vi = 0; AI.idx = 0; }
    return;
  }
  if (AI.phase === 'toVein') {
    if (S.pressure >= 0.8 || AI.vi >= S.veins.length) { aiPickStrike(); }
    else {
      const v = S.veins[AI.vi];
      if (aiMove(v[0].x, v[0].y, dt, 520)) { inputDown(AI.x, AI.y, now); AI.phase = 'carve'; AI.idx = 0; }
    }

    const pr = Math.min(1, S.pressure);

      S.beat -= dt;

    S.bulge = (Math.pow(pr, 1.6) * 0.06 + th * (pr < ZONE ? 0.012 + pr * 0.035 : 0.05 + zk * 0.07) + S.widen * 0.03) * settle;

    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.vr) p.rot += p.vr * dt;
    if (p.floor && p.y > p.floor && p.vy > 0) {

}

  // background layer (bench + HUD) goes under the gambit-mode dim; the geode and its action stay vivid on top
  drawBench();
  drawHUD(time);
  if (S.zoneK > 0) drawZoneDim();
  if (S.state === 'play' || S.state === 'sealed') drawGeode(time);
  drawShards();
  drawParts();
  drawChisel();
  for (const f of floats) {
    ctx.globalAlpha = clamp(f.life / f.max * 1.5, 0, 1);
    text(f.s, f.x, f.y, f.size, f.col);
  }
  ctx.globalAlpha = 1;
  drawSmashPrompt(time);
  drawEnd(time);
  if (flashA > 0) {
    ctx.globalAlpha = Math.min(1, flashA); ctx.fillStyle = flashC;
    ctx.fillRect(-400, -400, W + 800, H + 800); ctx.globalAlpha = 1;
  }
}

// ---------- loop ----------
newGame(DEMO);
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  try {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    update(dt, now);
    draw(now / 1000);
  } catch (e) { showErr(e); }
}
requestAnimationFrame(frame);
})();
</script>
