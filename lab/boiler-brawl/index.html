<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8">

<style>
  html,body{margin:0;padding:0;height:100%;background:#140e0a;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  #err{display:none;position:fixed;left:8px;right:8px;bottom:8px;padding:8px 10px;background:#400;color:#fdd;
    font:14px monospace;border-radius:6px;z-index:9;white-space:pre-wrap}
</style>

<body>
<canvas id="c"></canvas>
<div id="err"></div>
<script>
(() => {
'use strict';
const DEMO = /[?&]demo=1(&|$)/.test(location.search);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const errEl = document.getElementById('err');
function showErr(e) { errEl.style.display = 'block'; errEl.textContent = 'Oops: ' + (e && e.message ? e.message : e); }
window.addEventListener('error', ev => showErr(ev.error || ev.message));

// ---- palette: dark iron, brass, copper (ram), cool blue (graze), steam ----
const C = { bg: '#1a120c', floor: '#2b1e14', brass: '#e8b04a', brassD: '#8a5a1e', copper: '#e5533a', copperD: '#6e2414', cool: '#5ec8f0', steam: '#eef4f2', ink: '#0b0705' };
const VW = 360, VH = 640;
let W = 0, H = 0, dpr = 1, scale = 1, ox = 0, oy = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  scale = Math.min(W / VW, H / VH);
  ox = (W - VW * scale) / 2; oy = (H - VH * scale) / 2;
}
window.addEventListener('resize', resize); resize();

const rand = (a, b) => a + Math.random() * (b - a);
const easeOutBack = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function lerpAng(a, b, k) { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return a + d * k; }

// ---- audio (only after a user gesture, never in demo) ----
let AC = null, noiseBuf = null;
function initAudio() {
  if (DEMO) return;
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const n = AC.sampleRate; noiseBuf = AC.createBuffer(1, n, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function tone(f, dur, type, vol, f2) {
  if (!AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq) {
  if (!AC) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(80, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + dur);
}
const sfx = {
  launch: p => { noise(0.25 + p * 0.2, 0.15 + p * 0.2, 2600); tone(180, 0.2, 'sawtooth', 0.05, 360 + p * 300); },
  crash: () => { tone(160, 0.2, 'square', 0.12, 50); noise(0.18, 0.3, 1800); },
  thud: () => tone(110, 0.12, 'triangle', 0.12, 60),
  wall: () => tone(260, 0.06, 'square', 0.05, 130),
  graze: () => tone(rand(800, 1100), 0.05, 'triangle', 0.035, rand(1300, 1600)),
  burst: () => { noise(0.9, 0.5, 1600); tone(90, 0.6, 'sawtooth', 0.14, 28); tone(1500, 0.35, 'square', 0.04, 2600); },
  fizzle: () => { noise(0.4, 0.15, 1200); tone(500, 0.3, 'triangle', 0.05, 150); },
  alarm: () => tone(1300, 0.06, 'square', 0.035),
  dangerIn: () => { tone(520, 0.55, 'sawtooth', 0.07, 130); noise(0.5, 0.12, 700); },
  dangerOut: () => tone(300, 0.3, 'triangle', 0.06, 900),
  cog: () => { tone(900, 0.08, 'triangle', 0.06, 1400); tone(1400, 0.12, 'triangle', 0.04, 2100); },
  round: () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.18, 'square', 0.05), i * 90)); },
  reserve: () => { noise(0.6, 0.35, 2400); tone(200, 0.5, 'sawtooth', 0.08, 700); },
  heal: () => { [660, 880, 1175].forEach((f, i) => setTimeout(() => tone(f, 0.12, 'triangle', 0.06, f * 1.25), i * 55)); noise(0.25, 0.1, 3000); },
  rebuild: () => { [392, 523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => tone(f, 0.2, 'triangle', 0.06), i * 70)); tone(120, 0.5, 'sawtooth', 0.06, 480); },
  crush: () => { tone(700, 0.08, 'square', 0.05, 180); noise(0.12, 0.12, 2000); },
  ventWarn: () => { tone(180, 0.35, 'sawtooth', 0.06, 420); noise(0.3, 0.08, 900); },
  tick: k => tone(650 + k * 900, 0.05, 'square', 0.03 + k * 0.02),
  vent: () => { noise(0.7, 0.45, 2400); tone(75, 0.5, 'sawtooth', 0.14, 30); },
  cap: () => { tone(300, 0.1, 'square', 0.08, 900); tone(1200, 0.18, 'triangle', 0.06, 1900); },
  over: () => { tone(420, 1.0, 'sawtooth', 0.1, 55); noise(1.0, 0.25, 900); },
  levelUp: () => { [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => tone(f, 0.16, 'square', 0.05, f * 1.02), i * 60)); noise(0.4, 0.12, 3000); },
  select: () => tone(1000, 0.06, 'square', 0.05, 1400),
  pick: () => { tone(784, 0.25, 'triangle', 0.07, 1568); tone(392, 0.3, 'square', 0.04, 784); },
  blast: () => { noise(0.5, 0.4, 3000); tone(140, 0.4, 'sawtooth', 0.12, 40); },
  hook: () => { tone(300, 0.3, 'sawtooth', 0.07, 1200); noise(0.3, 0.12, 2400); },
  shell: () => { tone(1200, 0.4, 'triangle', 0.07, 900); tone(600, 0.35, 'square', 0.04, 1200); },
  ready: () => tone(1400, 0.08, 'triangle', 0.05, 1900)
};

// ---- arena: a gear-toothed stadium ----
const AR = { x: 180, y1: 290, y2: 455, r: 155 };
const SEG = AR.y2 - AR.y1, PER = 2 * SEG + 2 * Math.PI * AR.r;
function perim(t) {
  t = ((t % PER) + PER) % PER;
  if (t < SEG) return [AR.x + AR.r, AR.y1 + t, 1, 0];
  t -= SEG; const hr = Math.PI * AR.r;
  if (t < hr) { const a = t / AR.r; return [AR.x + Math.cos(a) * AR.r, AR.y2 + Math.sin(a) * AR.r, Math.cos(a), Math.sin(a)]; }
  t -= hr;
  if (t < SEG) return [AR.x - AR.r, AR.y2 - t, -1, 0];
  t -= SEG; const a = Math.PI + t / AR.r;
  return [AR.x + Math.cos(a) * AR.r, AR.y1 + Math.sin(a) * AR.r, Math.cos(a), Math.sin(a)];
}
let wnx = 0, wny = 0;
function arenaClamp(o) { // returns impact speed into the wall, or -1 if no contact
  const cy = Math.max(AR.y1, Math.min(AR.y2, o.y));
  const dx = o.x - AR.x, dy = o.y - cy, d = Math.hypot(dx, dy) || 0.001, lim = AR.r - o.r;
  if (d <= lim) return -1;
  wnx = dx / d; wny = dy / d;
  o.x = AR.x + wnx * lim; o.y = cy + wny * lim;
  const vn = o.vx * wnx + o.vy * wny;
  if (vn > 0) { o.vx -= 1.7 * vn * wnx; o.vy -= 1.7 * vn * wny; return vn; }
  return 0;
}
const randArenaPt = () => [rand(AR.x - 110, AR.x + 110), rand(AR.y1 - 70, AR.y2 + 70)];

// ---- state ----
let state = 'play', player, rivals = [], parts = [], pops = [];
// floor rings: bursts and vents leave their exact reach on the floor for a moment (RING_LIFE, game time)
let rings = [];
const RING_LIFE = 0.55;
let score = 0, shownScore = 0, scorePulse = 0, gameT = 0, combo = 1, comboT = 0;
let shake = 0, flash = 0, flashCol = C.steam, hitstop = 0, ts = 1, overT = 0, T = 0;
let best = 0, newBest = false, launched = false, hintA = 1;
let grazeSnd = 0, grazeAcc = 0, grazePopT = 0, alarmT = 0;
// danger mode: boiler < 25 -> slow time, drained rival colours, vignette + alarm (exits at 30 to avoid flicker)
let inDanger = false, danger = 0;
const DANGER_IN = 25, DANGER_OUT = 30, DANGER_TS = 0.62;
// rounds: overfill N rivals to clear a round; clearing refills you and brings tougher rival types
let round = 1, roundLeft = 2, cogs = [], cogT = 4;
// healing: every burst flings a repair wrench into the wreck. Grab it before it cools or a rival crushes it:
// it patches your boiler, keeps your combo alive, and every 3 patches rebuild a lost spare boiler.
let wrenches = [], patches = 0, healFx = 0, wrenchTip = false;
const WRENCH_HEAL = 20, WRENCH_LIFE = 5.5, PATCHES_PER_BOILER = 3, MAX_LIVES = 4;
// tanker vents: every few seconds a tanker plants itself and winds up (r.fuse counts down) then blasts a
// shockwave that shoves and drains anyone inside VENT_R. Lingering nearby speeds up its timer; a hard ram
// during the windup caps the vent (and stuffs the steam back into its boiler).
const VENT_R = 100, VENT_FUSE = 1.2, VENT_CAP_SPD = 200;
// level ups: bursts, grazes, rams and caps earn XP. Each level freezes play and offers 3 cards:
// active SKILLS (tap a corner button, then recharge) or stacking PASSIVES. At least one skill is always offered.
let lv = 1, xp = 0, xpK = 0, lvPend = 0, lvFx = 0, perks = {}, skills = [];
const pick = { on: false, t: 0, opts: [], delay: 0, chosen: -1, ct: 0 };
const xpNeed = l => 35 + (l - 1) * 25;
const pk = k => perks[k] || 0;
const hullK = () => 1 - 0.3 * pk('hull');
const gMul = () => 1 + 0.25 * pk('siphon');
const SKILL_BTNS = [[40, 596], [320, 596]], SKILL_R = 30, CARD_Y = [250, 350, 450], ROM = ['', 'I', 'II', 'III', 'IV'];
const banner = { t: 0, max: 1, a: '', b: '' };
const roundGoal = n => Math.min(6, n + 1);
function showBanner(a, b, dur) { banner.a = a; banner.b = b; banner.t = banner.max = dur; }
try { best = +localStorage.getItem('boilerBrawlBest') || 0; } catch (e) { best = 0; }

const drag = { on: false, id: null, sx: 0, sy: 0, x: 0, y: 0 };
const bot = { t: 0.4, aim: 0, aimMax: 0.5, dx: 0, dy: 0, pow: 0 };
// tutorial: a guided sandbox shown on first launch (skippable, replayable from the game-over screen).
// Each step waits for the player to actually do the thing; no rival AI, no drain, no dying.
const tut = { on: false, step: 0, t: 0, age: 0, wait: 0, took: 0 };
const TUT = [
  { a: 'DRAG BACK & RELEASE', b: 'Pull away from where you want to fly' },
  { a: 'GRAZE THE BLUE TIP', b: 'Skim a steam tail to steal its pressure' },
  { a: 'RAM THE COPPER CORE', b: 'Pump steam in until the rival BURSTS' },
  { a: 'GRAB THE WRENCH', b: 'Every burst drops one: it repairs you' },
  { a: 'KEEP YOUR BOILER UP', b: 'Flings & bumps drain it. Empty = game over' }
];
const GRAZE_GOAL = 4, SKIP_BTN = [262, 58, 80, 32], HELP_BTN = [90, 546, 180, 48];
const inBtn = (p, b, pad) => p.x > b[0] - pad && p.x < b[0] + b[2] + pad && p.y > b[1] - pad && p.y < b[1] + b[3] + pad;
let seenTut = false;
try { seenTut = localStorage.getItem('boilerBrawlTut') === '1'; } catch (e) { seenTut = false; }

// rival kinds: rig = all-rounder, sprinter = small fast steam-thief, tanker = big slow boiler that vents shockwaves
const KINDS = {
  rig: { r: 14, tl: 1, spd: 1, aiT: 1, pts: 300, blast: 150, xp: 20 },
  sprinter: { r: 11, tl: 0.8, spd: 1.35, aiT: 0.6, pts: 400, blast: 130, xp: 24 },
  tanker: { r: 20, tl: 1.35, spd: 0.6, aiT: 1.4, pts: 600, blast: 200, xp: 32 }
};
function mkCar(x, y, isPlayer, kind) {
  const K = KINDS[kind || 'rig'];
  return { x, y, vx: 0, vy: 0, r: K.r, K, kind: kind || 'rig', ang: -Math.PI / 2, tAng: -Math.PI / 2, p: isPlayer ? 100 : rand(40, 70),
    player: isPlayer, alive: true, dead: false, sp: 1, ai: rand(1, 2.5), alert: false, hit: 0, grazed: 0,
    wob: rand(0, 9), puff: 0, resp: 0, fuse: 0, swell: 0, ventCD: rand(3, 5.5), tick: 0, lives: 3, inv: 0 };
}
const tailLen = c => (18 + Math.max(0, c.p) * 1.1) * c.K.tl;
const ramR = c => c.r + 16;
function tailSeg(c) {
  const dx = Math.cos(c.tAng), dy = Math.sin(c.tAng), a = c.r * 0.6, b = a + tailLen(c);
  return [c.x - dx * a, c.y - dy * a, c.x - dx * b, c.y - dy * b];
}
function segD(px, py, s) {
  const ax = s[0], ay = s[1], bx = s[2] - ax, by = s[3] - ay;
  let t = ((px - ax) * bx + (py - ay) * by) / (bx * bx + by * by || 1);
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const x = ax + bx * t, y = ay + by * t;
  return { d: Math.hypot(px - x, py - y), t, x, y };
}
// ram vs graze zones: within ramR(c) of a rival's centre your car body makes contact (ram);
// further out along the tail you only skim its steam (graze).
const grazeW = (r, t) => (14 + t * 9) * (0.5 + r.r / 28);
// TAIL_COLS[desat level 0..4][copper->blue step 0..16]; danger mode drains rival tails toward grey
const TAIL_COLS = (() => {
  const a = [0xe5, 0x53, 0x3a], b = [0x5e, 0xc8, 0xf0], out = [];
  for (let l = 0; l <= 4; l++) {
    const row = [], ds = l / 4 * 0.55;
    for (let i = 0; i <= 16; i++) {
      const k = i / 16, c = a.map((v, j) => v + (b[j] - v) * k), g = c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11;
      row.push('rgb(' + c.map(v => Math.round((v + (g - v) * ds) * (1 - ds * 0.15))).join(',') + ')');
    }
    out.push(row);
  }
  return out;
})();
function tailCool(d, R) { const u = Math.max(0, Math.min(1, (d - R) / 28)); return u * u * (3 - 2 * u); } // 0 copper .. 1 blue
let zoneR = null; // rival whose ram zone zoneAt() last hit
function zoneAt(x, y) { // 2 = ram zone, 1 = graze zone, 0 = open floor
  let z = 0; zoneR = null;
  for (const r of rivals) {
    if (!r.alive || r.sp < 1) continue;
    if (Math.hypot(x - r.x, y - r.y) < ramR(r)) { zoneR = r; return 2; }
    const q = segD(x, y, tailSeg(r)); if (q.d < grazeW(r, q.t) * gMul()) z = 1;
  }
  return z;
}
// knife-edge: half-angle (around the tail's back direction) of the stretch of ram ring that borders the
// graze band, i.e. where ramR(c) meets grazeW. Bisects along the ring using the same test as zoneAt().
function seamHalf(c) {
  const s = tailSeg(c), R = ramR(c), bx = -Math.cos(c.tAng), by = -Math.sin(c.tAng), g = gMul();
  const inG = th => {
    const cs = Math.cos(th), sn = Math.sin(th), q = segD(c.x + (bx * cs - by * sn) * R, c.y + (by * cs + bx * sn) * R, s);
    return q.d < grazeW(c, q.t) * g;
  };
  if (!inG(0)) return 0;
  if (inG(Math.PI)) return Math.PI;
  let lo = 0, hi = Math.PI;
  for (let i = 0; i < 9; i++) { const m = (lo + hi) / 2; if (inG(m)) lo = m; else hi = m; }
  return lo;
}

function part(x, y, vx, vy, life, size, col, type, grow) {
  if (parts.length > 520) parts.shift();
  parts.push({ x, y, vx, vy, life, max: life, size, col, type, grow: grow || 0 });
}
function sparks(x, y, n, col, spd) {
  for (let i = 0; i < n; i++) { const a = rand(0, 6.283), s = rand(0.3, 1) * spd; part(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.2, 0.45), rand(1.5, 3), col, 1); }
}
// pad: vent reach counts the car's radius (edge touch), burst reach is centre distance
function floorRing(src, R, col, pad) { rings.push({ x: src.x, y: src.y, R, col, pad, src, life: RING_LIFE }); }
function pop(x, y, text, col, size) { pops.push({ x, y, text, col, size, life: 1, max: 1 }); }
function addScore(n) { if (state !== 'play') return; score += n; if (n >= 5) scorePulse = 1; }

function spawnRival(init) {
  let x = 180, y = 300, ok = false;
  for (let k = 0; k < 25 && !ok; k++) {
    [x, y] = randArenaPt();
    ok = Math.hypot(x - player.x, y - player.y) > 120 && rivals.every(r => !r.alive || Math.hypot(r.x - x, r.y - y) > 45);
  }
  let kind = 'rig';
  const roll = Math.random(), tanks = rivals.filter(r => r.alive && r.kind === 'tanker').length;
  if (round >= 2 && roll < 0.3 && tanks < Math.min(3, Math.floor(round / 2))) kind = 'tanker';
  else if (round >= 3 && roll < 0.3 + Math.min(0.3, round * 0.06)) kind = 'sprinter';
  const c = mkCar(x, y, false, kind);
  c.p = kind === 'tanker' ? rand(55, 75) : kind === 'sprinter' ? rand(30, 50) : rand(35, 65) + Math.min(10, round * 2);
  c.ang = c.tAng = rand(0, 6.283);
  if (!init) { c.sp = 0; for (let i = 0; i < 12; i++) part(x, y, rand(-80, 80), rand(-80, 80), 0.6, rand(5, 10), C.steam, 0, 12); }
  return c;
}

function restart() {
  state = 'play'; score = 0; shownScore = 0; gameT = 0; combo = 1; comboT = 0; newBest = false;
  shake = 0; flash = 0; hitstop = 0; overT = 0; parts = []; pops = []; rings = []; grazeAcc = 0;
  inDanger = false; danger = 0; alarmT = 0;
  round = 1; roundLeft = roundGoal(1); cogs = []; cogT = 4; banner.t = 0;
  wrenches = []; patches = 0; healFx = 0; wrenchTip = false;
  lv = 1; xp = 0; xpK = 0; lvPend = 0; lvFx = 0; perks = {}; skills = [];
  pick.on = false; pick.chosen = -1; pick.delay = 0;
  drag.on = false; tut.on = false;
  player = mkCar(180, 470, true);
  if (DEMO) player.p = 62; // start a bit worn so the wrench heal reads on camera
  rivals = [];
  if (!DEMO) showBanner('ROUND 1', 'OVERFILL ' + roundLeft + ' RIVALS', 2.4);
  if (DEMO) {
    // staged opener: two nearly-full boilers side by side -> chain burst
    const a = mkCar(180, 335, false); a.p = 90; a.ang = a.tAng = 0; a.ai = 2.6;
    const b = mkCar(238, 300, false); b.p = 88; b.ang = b.tAng = Math.PI * 0.8; b.ai = 2.9;
    const c = mkCar(100, 215, false); c.p = 55; c.ai = 1.4;
    const d = mkCar(95, 430, false, 'tanker'); d.p = 66; d.ang = d.tAng = -Math.PI / 2; d.ai = 1.2; d.ventCD = 2.6;
    rivals.push(a, b, c, d);
    bot.t = 0.35; bot.aim = 0;
  } else {
    for (let i = 0; i < 3; i++) rivals.push(spawnRival(true));
  }
}

// ---- events ----
function burst(r) {
  r.alive = false; r.resp = 1.4;
  const m = combo, pts = r.K.pts * m, B = r.K.blast, gain = (r.kind === 'tanker' ? 32 : 22) + 12 * pk('scrap');
  addScore(pts); combo = Math.min(combo + 1, 9); comboT = 4;
  pop(r.x, r.y - 12, (m > 1 ? 'x' + m + ' ' : '') + 'BURST +' + pts, C.brass, 26);
  if (state === 'play') {
    player.p = Math.min(100, player.p + gain); pop(player.x, player.y - 28, '+' + gain + ' STEAM', C.steam, 16);
    dropWrench(r.x, r.y);
    gainXP(r.K.xp);
    roundLeft--;
    if (roundLeft <= 0) nextRound();
    if (tut.on && tut.step === 2) tutDone();
  }
  for (let i = 0; i < 40; i++) { const a = rand(0, 6.283), s = rand(40, 280); part(r.x, r.y, Math.cos(a) * s, Math.sin(a) * s, rand(0.6, 1.3), rand(6, 14), C.steam, 0, 20); }
  for (let i = 0; i < 18; i++) { const a = rand(0, 6.283), s = rand(150, 420); part(r.x, r.y, Math.cos(a) * s, Math.sin(a) * s, rand(0.4, 0.8), rand(3, 5), C.copper, 1); }
  sparks(r.x, r.y, 20, C.brass, 380);
  part(r.x, r.y, 0, 0, 0.5, 12, C.steam, 2, B * 2.2);
  floorRing(r, B, C.steam); // cars whose centre is inside B got shoved + pumped
  shake = Math.max(shake, 14); flash = 0.55; flashCol = C.steam; hitstop = 0.09;
  sfx.burst();

  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - c * 15 - s * 9, y2 - s * 15 + c * 9); ctx.lineTo(x2 - c * 15 + s * 9, y2 - s * 15 - c * 9); ctx.closePath(); ctx.fill();
}
function coach(x, y, rad, col, label) { // dashed target ring + bobbing arrow + label (flips below near the top)
  const b = 0.5 + 0.5 * Math.sin(T * 6), up = y - rad < 230, dir = up ? 1 : -1;
  ctx.globalAlpha = 0.9; ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.setLineDash([8, 6]); ctx.lineDashOffset = -T * 30;
  ctx.beginPath(); ctx.arc(x, y, rad + 3 * b, 0, 6.283); ctx.stroke(); ctx.setLineDash([]);
  const tip = y + dir * (rad + 10 + 6 * b);
  arrowTo(x, tip + dir * 28, x, tip, col, 5);
  txt(label, x, tip + dir * 46, 19, col);
  ctx.globalAlpha = 1;
}
function drawTutWorld() {
  if (!tut.on || tut.wait > 0) return;
  const r = rivals[0];
  if (tut.step === 0 && !drag.on) { // ghost finger: pull back from the car, then let go
    let ux = player.x - AR.x, uy = player.y - (AR.y1 + AR.y2) / 2;
    const L = Math.hypot(ux, uy); if (L < 30) { ux = 0; uy = 1; } else { ux /= L; uy /= L; }
    const c = tut.t % 2.2, k = Math.min(1, Math.max(0, (c - 0.3) / 0.8)), e = 1 - Math.pow(1 - k, 3);
    if (c < 1.3) {
      const fx = player.x + ux * (22 + 72 * e), fy = player.y + uy * (22 + 72 * e);
      ctx.globalAlpha = 0.85; ctx.strokeStyle = C.brass; ctx.lineWidth = 4; ctx.setLineDash([6, 6]);
      ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(fx, fy); ctx.stroke(); ctx.setLineDash([]);
      if (e > 0.15) arrowTo(player.x - ux * 30, player.y - uy * 30, player.x - ux * (40 + 90 * e), player.y - uy * (40 + 90 * e), C.steam, 5);
      ctx.globalAlpha = Math.min(1, c * 4) * 0.95; ctx.fillStyle = C.steam;
      ctx.beginPath(); ctx.arc(fx, fy, 14, 0, 6.283); ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.stroke();
      txt('PULL', fx + 34 * (ux >= 0 ? 1 : -1) + (Math.abs(ux) < 0.3 ? 16 : 0), fy, 17, C.brass);
    } else {
      const q = (c - 1.3) / 0.9;
      ctx.globalAlpha = 1 - q; ctx.strokeStyle = C.steam; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(player.x, player.y, 22 + q * 44, 0, 6.283); ctx.stroke();
      txt('LET GO!', player.x, player.y + uy * 56 + (Math.abs(uy) < 0.3 ? 40 : 0), 19, C.steam);
    }
    ctx.globalAlpha = 1;
  } else if (tut.step === 1 && r && r.alive && r.sp >= 1) {
    const s = tailSeg(r), t = 0.72;
    coach(s[0] + (s[2] - s[0]) * t, s[1] + (s[3] - s[1]) * t, grazeW(r, t) + 6, C.cool, 'SKIM HERE');
  } else if (tut.step === 2 && r && r.alive) {
    coach(r.x, r.y, ramR(r) + 8, C.copper, 'RAM IT!');
  } else if (tut.step === 3 && wrenches.length && wrenches[0].t > 0.3) {
    coach(wrenches[0].x, wrenches[0].y, 28, C.cool, 'GRAB!');
  }
}
function drawTut(vx0, vy0, vw, vh) {
  const last = tut.step === TUT.length - 1, S = TUT[tut.step], done = tut.wait > 0;
  if (last) { // "ready" screen: dim the arena, spotlight the boiler bar, big start button
    const a = Math.min(1, tut.t * 3);
    ctx.globalAlpha = a * 0.6; ctx.fillStyle = C.ink; ctx.fillRect(vx0, 146, vw, vh);
    ctx.globalAlpha = a * (0.6 + 0.4 * Math.sin(T * 8)); ctx.strokeStyle = C.brass; ctx.lineWidth = 4;
    rr(11, 7, 338, 50, 15); ctx.stroke();
    ctx.globalAlpha = a;
    const s = Math.max(0.01, easeOutBack(Math.min(1, tut.t * 2.5))) * (1 + 0.04 * Math.sin(T * 5));
    ctx.save(); ctx.translate(180, 370); ctx.scale(s, s);
    ctx.fillStyle = C.brass; rr(-124, -36, 248, 72, 36); ctx.fill();
    ctx.strokeStyle = C.brassD; ctx.lineWidth = 4; ctx.stroke();
    txt('START BRAWL', 0, 2, 32, C.steam, 'center', 220);
    ctx.restore();
    txt('BURST RIVALS · LEVEL UP · PICK SKILLS', 180, 442, 17, C.steam, 'center', 320);
    ctx.globalAlpha = a * (0.55 + 0.45 * Math.sin(T * 6));
    txt('TAP ANYWHERE', 180, 476, 17, C.brass);
    ctx.globalAlpha = 1;
  }
  // instruction card (pops in on every step / success)
  const e = Math.max(0.01, easeOutBack(Math.min(1, tut.age * 3.5)));
  ctx.save(); ctx.translate(180, 97); ctx.scale(e, e); ctx.translate(-180, -97);
  ctx.globalAlpha = 0.93; ctx.fillStyle = C.ink; rr(10, 54, 340, 86, 16); ctx.fill(); ctx.globalAlpha = 1;
  ctx.strokeStyle = done ? C.cool : C.brass; ctx.lineWidth = 3; ctx.stroke();
  for (let i = 0; i < TUT.length; i++) {
    const cur = i === tut.step, on = i < tut.step || (cur && done);
    ctx.beginPath(); ctx.arc(28 + i * 18, 73, cur ? 6.5 : 5, 0, 6.283);
    ctx.fillStyle = on ? C.brass : cur ? C.steam : C.ink; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = C.brass; ctx.stroke();
  }
  txt(last ? 'READY?' : 'HOW TO PLAY', 28 + TUT.length * 18, 74, 14, C.brass, 'left');
  txt(done ? 'NICE!' : S.a, 24, 103, 23, done ? C.cool : C.steam, 'left', 312);
  txt(S.b, 24, 126, 15, C.brass, 'left', 312);
  if (tut.step === 1 && !done) { // graze progress
    const k = Math.min(1, tut.took / GRAZE_GOAL);
    ctx.fillStyle = C.brassD; ctx.fillRect(24, 134, 312, 3);
    ctx.fillStyle = C.cool; ctx.fillRect(24, 134, 312 * k, 3);
  }
  if (!last) {
    const [bx, by, bw, bh] = SKIP_BTN;
    ctx.fillStyle = C.brassD; rr(bx, by, bw, bh, bh / 2); ctx.fill();
    ctx.strokeStyle = C.brass; ctx.lineWidth = 2; ctx.stroke();
    txt('SKIP »', bx + bw / 2, by + bh / 2 + 1, 16, C.steam);
  }
  ctx.restore();
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, cv.width, cv.height);
  const k = dpr * scale, sx = (Math.random() * 2 - 1) * shake, sy = (Math.random() * 2 - 1) * shake;
  ctx.setTransform(k, 0, 0, k, dpr * ox + sx * k, dpr * oy + sy * k);
  // decor gears
  gear(-5, 640, 70, 12, T * 0.2, C.brass, 0.07);
  gear(372, 612, 48, 9, -T * 0.3, C.brass, 0.07);
  gear(355, 150, 34, 8, T * 0.4, C.brass, 0.06);
  // arena
  const nT = Math.round(PER / 22);
  ctx.fillStyle = C.brassD;
  for (let i = 0; i < nT; i++) {
    const p = perim(i * PER / nT + T * 10);
    ctx.save(); ctx.translate(p[0], p[1]); ctx.rotate(Math.atan2(p[3], p[2])); ctx.fillRect(0, -5, 12, 10); ctx.restore();
  }
  arenaPath(AR.r + 3); ctx.fillStyle = C.floor; ctx.fill();
  ctx.strokeStyle = C.brass; ctx.lineWidth = 6; ctx.stroke();
  arenaPath(AR.r - 6); ctx.strokeStyle = C.brassD; ctx.lineWidth = 2; ctx.stroke();
  gear(AR.x, (AR.y1 + AR.y2) / 2, 118, 16, T * 0.15, C.brass, 0.06);
  gear(AR.x, (AR.y1 + AR.y2) / 2, 40, 8, -T * 0.45, C.brass, 0.07);
  // world
  for (const r of rivals) if (r.alive) drawTail(r);
  drawTail(player);
  drawRings();
  for (const r of rivals) if (r.alive && r.fuse > 0) drawVentZone(r);
  for (const g of cogs) {
    const s = Math.max(0.01, easeOutBack(Math.min(1, g.t * 3))), bob = Math.sin(T * 5 + g.x) * 2;
    ctx.globalAlpha = 0.25 + 0.15 * Math.sin(T * 6); ctx.fillStyle = C.brass;
    ctx.beginPath(); ctx.arc(g.x, g.y + bob, 17 * s, 0, 6.283); ctx.fill();
    gear(g.x, g.y + bob, 11 * s, 8, T * 3, C.brass, 1);
  }
  for (const w of wrenches) drawWrench(w);
  drawParts(true);
  for (const r of rivals) if (r.alive) drawCar(r);
  drawCar(player);
  drawParts(false);
  for (const r of rivals) if (r.alive && r.fuse > 0) drawVentLabel(r);
  drawTutWorld();
  drawAim();
  for (const p of pops) {
    const a = Math.min(1, p.life / p.max * 2.5), age = p.max - p.life, s = age < 0.18 ? Math.max(0.01, easeOutBack(age / 0.18)) : 1;
    ctx.globalAlpha = a; ctx.save(); ctx.translate(p.x, p.y); ctx.scale(s, s); txt(p.text, 0, 0, p.size, p.col, 'center', 300); ctx.restore();
  }
  ctx.globalAlpha = 1;
  // screen-space layers (no shake)
  ctx.setTransform(k, 0, 0, k, dpr * ox, dpr * oy);
  const vx0 = -ox / scale, vy0 = -oy / scale, vw = W / scale, vh = H / scale;
  if (danger > 0.01) {
    const g = ctx.createRadialGradient(180, 320, 180, 180, 320, 420);
    g.addColorStop(0, 'rgba(229,83,58,0)'); g.addColorStop(1, 'rgba(229,83,58,' + (danger * (0.25 + 0.2 * Math.sin(T * 8))).toFixed(3) + ')');
    ctx.fillStyle = g; ctx.fillRect(vx0, vy0, vw, vh);
    if (inDanger && state === 'play') { ctx.globalAlpha = danger * (0.7 + 0.3 * Math.sin(T * 8)); txt('SLOW-MO', 180, 124, 18, C.copper); ctx.globalAlpha = 1; }
  }
  drawHUD();
  if (tut.on) drawTut(vx0, vy0, vw, vh);
  if (!DEMO && !tut.on && hintA > 0 && state === 'play') {
    ctx.globalAlpha = hintA * (0.85 + 0.15 * Math.sin(T * 5));
    ctx.fillStyle = C.ink; rr(18, 540, 324, 44, 22); ctx.fill();
    txt('DRAG & FLING · GRAZE THE BLUE', 180, 562, 17, C.steam, 'center', 300);
    ctx.globalAlpha = 1;
  }
  if (banner.t > 0 && state === 'play') {
    const age = banner.max - banner.t, s = Math.max(0.01, easeOutBack(Math.min(1, age * 3)));
    ctx.globalAlpha = Math.min(1, banner.t * 2.5);
    ctx.save(); ctx.translate(180, 215); ctx.scale(s, s);
    ctx.fillStyle = C.ink; ctx.globalAlpha *= 0.8; rr(-150, -40, 300, 80, 18); ctx.fill();
    ctx.globalAlpha = Math.min(1, banner.t * 2.5);
    ctx.strokeStyle = C.brass; ctx.lineWidth = 3; ctx.stroke();
    txt(banner.a, 0, -12, 34, C.brass, 'center', 280);
    txt(banner.b, 0, 22, 17, C.steam, 'center', 280);
    ctx.restore(); ctx.globalAlpha = 1;
  }
  if (pick.on) drawPick(vx0, vy0, vw, vh);
  if (state === 'over') {
    const a = Math.min(1, overT * 3);
    ctx.globalAlpha = a * 0.7; ctx.fillStyle = C.ink; ctx.fillRect(vx0, vy0, vw, vh); ctx.globalAlpha = a;
    const s = easeOutBack(Math.min(1, overT * 2.5));
    ctx.save(); ctx.translate(180, 250); ctx.scale(s, s); txt('BOILER DRY', 0, 0, 48, C.copper, 'center', 330); ctx.restore();
    txt('SCORE', 180, 320, 20, C.brass);
    txt(String(Math.floor(score)), 180, 362, 58, C.steam);
    txt(newBest ? 'NEW BEST!' : 'BEST ' + best, 180, 414, 22, newBest ? C.copper : C.brass);
    txt('REACHED ROUND ' + round + ' · LV ' + lv, 180, 450, 18, C.steam);
    if (overT > 0.5 && !DEMO) {
      ctx.globalAlpha = a * (0.6 + 0.4 * Math.sin(T * 6)); txt('TAP TO RETRY', 180, 500, 28, C.steam);
      const [bx, by, bw, bh] = HELP_BTN;
      ctx.globalAlpha = a; ctx.fillStyle = C.ink; rr(bx, by, bw, bh, bh / 2); ctx.fill();
      ctx.strokeStyle = C.brass; ctx.lineWidth = 3; ctx.stroke();
      txt('HOW TO PLAY', bx + bw / 2, by + bh / 2 + 1, 18, C.brass);
    }
    ctx.globalAlpha = 1;
  }
  if (flash > 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = flash * 0.6; ctx.fillStyle = flashCol; ctx.fillRect(0, 0, cv.width, cv.height); ctx.globalAlpha = 1; }
}

// ---- loop (guarded) ----
if (!DEMO && !seenTut) startTut(); else restart();
let last = performance.now(), crashed = false;
function frame(now) {
  requestAnimationFrame(frame);
  if (crashed) return;
  const rdt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  try { step(rdt); draw(); }
  catch (e) { crashed = true; showErr(e); }
}
requestAnimationFrame(frame);
})();
</script>
