<script>
(function(){

// ---------- layout ----------

const UNITS=['K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];

// ---------- pre-rendered sprites (one drawImage instead of gradients/paths/text every frame) ----------
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}
function makeGlow(c0,c1,size){                    // soft radial light: c0 at the core, fading out through c1

// gold light fades out through amber, so over the blue water it stays warm instead of turning olive
const GLOW=makeGlow([255,215,94],[255,160,90],64),PGLOW=makeGlow([255,143,184],[255,143,184],64),
  MGLOW=makeGlow([190,210,255],[190,210,255],64),AGLOW=makeGlow([127,216,246],[127,216,246],64);

// pods: cool indigo bodies with periwinkle rims at 1, warming through violet and plum to a gold rim at 16
const RIM=['#9fc4ff','#b9b0ff','#e2a8f2','#ffb38e','#ffd75e'];
const POD_IN=[[70,84,152],[142,68,116]],POD_OUT=[[22,27,62],[50,20,50]];

const PET=(()=>{const c=mk(32,16),x=c.getContext('2d');x.fillStyle=C.petal;x.beginPath();x.ellipse(16,8,15.5,7.5,0,0,Math.PI*2);x.fill();return c;})();
const VIG=(()=>{const c=mk(180,320),x=c.getContext('2d'),g=x.createRadialGradient(90,150,55,90,150,215);
  g.addColorStop(0,'rgba(255,143,184,0.04)');g.addColorStop(1,'rgba(255,143,184,0.42)');x.fillStyle=g;x.fillRect(0,0,180,320);return c;})();
function flowerSprite(col,heart,glow){            // a water lily: two rings of pointed petals around a gold heart
  const S=128,c=mk(S,S),x=c.getContext('2d'),u=S/4.4;x.translate(S/2,S/2);
  x.globalAlpha=0.5;x.drawImage(glow,-S/2,-S/2,S,S);x.globalAlpha=1;
  const petal=(a,len,w)=>{const ca=Math.cos(a),sa=Math.sin(a);x.beginPath();x.moveTo(0,0);
    x.quadraticCurveTo(ca*len*0.55-sa*w,sa*len*0.55+ca*w,ca*len,sa*len);x.quadraticCurveTo(ca*len*0.55+sa*w,sa*len*0.55-ca*w,0,0);x.fill();};
  x.fillStyle=col;for(let i=0;i<8;i++)petal(i*Math.PI/4,u*1.12,u*0.36);
  x.fillStyle=heart;for(let i=0;i<6;i++)petal(i*Math.PI/3+0.3,u*0.78,u*0.28);
  x.fillStyle=C.gold;x.beginPath();x.arc(0,0,u*0.24,0,Math.PI*2);x.fill();
  x.fillStyle='#fff4c0';x.beginPath();x.arc(-u*0.06,-u*0.06,u*0.1,0,Math.PI*2);x.fill();return c;
}
// one palette per Full Moon (cycling): lilies [petals, heart, glow]; floating leaves [base, lit side, veins], a lily pad first
const MOON_PAL=[
  {name:'HARVEST MOON',lily:[[C.petal,'#ffd3e4',PGLOW],['#ffe6b0','#fff8ea',GLOW]],

  {name:'EMBER MOON',lily:[['#ff7a6b','#ffd0c4',PGLOW],['#ffb14e','#ffe8b8',GLOW]],

];

  const k=moons%MOON_PAL.length;if(k===palKey)return;

}
function leafSprite(k){                           // points along +x (a lily pad's notch faces +x)

const lvlSum=()=>{let s=0;for(const l of st.lv)s+=l;for(const l of st.cr)s+=l;return s;};
const bloomMult=()=>1+0.2*Math.sqrt(st.blooms);   // diminishing: early blooms matter, late ones don't run away

const chainMult=()=>1+CHAIN_STEP*st.chain;       // applies to merges and blooms while a chain runs
const chainPlus=()=>st.pk[2]*MOON.chainS*Math.pow(MOON.chainFade,Math.max(0,st.chain-1)),chainWin=()=>CHAIN_WIN+chainPlus();   // LONG CHAIN fades each link
const moonReady=()=>st.moonG>=moonNeed(st.moons);

function canBuy(t,j){

function baseRate(){let s=0;for(const p of pods)if(!p.dead)s+=prod(p.v);return s*mults();}
const rate=()=>baseRate()*(st.boost>0?BOOST_R:1);
function addGlow(g){st.glow+=g;st.total+=g;st.moonG+=g;}

// every pod visibly holds exactly v fireflies; tapping catches one, which flies to the counter and later returns
function setFF(p){const n=Math.min(p.v,THRESH);if(p.ff.length>n)p.ff.length=n;while(p.ff.length<n)p.ff.push({a:rnd(0,6.28),b:rnd(0,6.28),s1:rnd(.6,1.6),s2:rnd(.6,1.6),f:rnd(0,6.28),cd:0,back:0});}
function ffPos(p,f,r){return {x:p.x+Math.sin(clock*f.s1+f.a)*r*.6,y:p.y+Math.cos(clock*f.s2+f.b)*r*.6};}
const ready=p=>{let n=0;for(const f of p.ff)if(f.cd<=0)n++;return n;};
const catchV=p=>Math.max(1,prod(p.v)/Math.min(p.v,THRESH)*2.5*mults()*netMult(st.lv[3]));   // tap income stays proportional to passive income
function makePod(v,x,y){const p={v,x,y,vx:0,vy:0,r:podR(v),dr:podR(v),born:0,pop:0,id:++pid,busy:false,dead:false,burstT:-1,ff:[],wv:rnd(0.5,4)};setFF(p);pods.push(p);return p;}
const livePods=()=>pods.reduce((n,p)=>n+(p.dead?0:1),0);
function freeSpot(r,near){                       // open ground; with `near`, prefer a spot beside that pod
  let bestS=null,bs=-1e9;
  for(let i=0;i<24;i++){
    const x=rnd(BX0+r,BX1-r),y=rnd(BY0+r,BY1-r);let md=1e9;
    for(const p of pods){if(p.dead)continue;const d=Math.hypot(p.x-x,p.y-y)-p.r;if(d<md)md=d;}
    const s=near?Math.min(md,r+14)-0.35*Math.hypot(near.x-x,near.y-y):md;
    if(s>bs){bs=s;bestS={x,y};}
  }
  return bestS;
}

function newGame(fresh){
  pods=[];parts=[];rings=[];waves=[];texts=[];seeds=[];merges=[];bugs=[];drag=null;press=null;
  st=blankState();
  if(DEMO){
    st.lv[0]=3;st.lv[1]=RARE_LV;st.lv[2]=4;st.blooms=6;st.glow=40;st.total=st.moonG=400;
    st.cr=[5,0,0];st.frogT=1.2;                   // the golden frog hops in, eats her fill, and the AI pops her
    // four 8s: the AI drags them together for two blooms that start a chain, then the 4s and 2s feed it higher
    const L=[[8,110,290],[8,200,290],[8,280,400],[8,80,400],[4,90,180],[4,260,180],[4,180,390],[2,55,320],[2,300,300],[2,175,440],[1,180,160],[1,310,250],[1,40,240]];
    for(const a of L)makePod(a[0],a[1],a[2]).born=1;
  }else{
    const d=fresh?null:load();
    if(d){
      st.glow=Math.max(0,+d.g||0);st.total=Math.max(st.glow,+d.tot||0);st.blooms=Math.max(0,d.b|0);
      if(Array.isArray(d.lv))for(let i=0;i<UPS.length;i++)st.lv[i]=clamp(d.lv[i]|0,0,UPS[i].max);
      if(Array.isArray(d.c))for(let i=0;i<3;i++)st.cr[i]=clamp(d.c[i]|0,0,CRIT[i].max);
      st.moons=Math.max(0,d.m|0);st.petals=Math.max(0,d.pe|0);st.petalsAll=Math.max(st.petals,d.pa|0);
      st.moonG=d.mg!=null?Math.max(0,+d.mg||0):st.total;   // saves from before the Full Moon count all their glow
      if(Array.isArray(d.pk))for(let i=0;i<PERKS.length;i++)st.pk[i]=clamp(d.pk[i]|0,0,PERKS[i].max);
      applyStarts();
      for(const a of d.p.slice(0,40)){
        if(!Array.isArray(a))continue;
        const v=Math.pow(2,clamp(Math.round(Math.log2(+a[0]||1)),0,4));
        const p=makePod(v,clamp(+a[1]||180,BX0+20,BX1-20),clamp(+a[2]||300,BY0+20,BY1-20));p.born=1;
        if(v>=THRESH){p.busy=true;p.burstT=0;}
      }
      if(d.t)awardAway((Date.now()-d.t)/1000);
    }
    if(!pods.length)starterPods();
    st.tut=tutSeen()?-1:0;
  }
  setPalette(st.moons);
  ai.phase=0;ai.t=0;ai.wait=0.5;ai.act=null;ai.lastBuy=0;ai.first=true;
}
function awardAway(sec){

}

// ---------- effects (all capped by the quality level) ----------
function spark(x,y,sp){if(parts.length>=PART_CAP[Q])return;const a=rnd(0,6.28);parts.push({k:0,x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(.4,.9),t:0,s:rnd(6,14)});}
function petal(x,y){if(parts.length>=PART_CAP[Q])return;const a=rnd(0,6.28),sp=rnd(80,300);parts.push({k:1,x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,life:rnd(.9,1.6),t:0,s:rnd(5,9),rot:rnd(0,6.28),vr:rnd(-8,8)});}
// floating texts are rendered once into pooled sprites: outlined text is too costly to redraw every frame
const TXT_POOL=[];
function textSprite(s,c,size){
  const img=TXT_POOL.pop()||document.createElement('canvas'),x=img.getContext('2d'),k=Math.min(K,3),f='bold '+size+'px sans-serif';
  x.font=f;const w=Math.ceil(x.measureText(s).width)+10,h=Math.ceil(size*1.3)+8;
  img.width=Math.ceil(w*k);img.height=Math.ceil(h*k);   // resizing clears it and resets the context
  x.setTransform(k,0,0,k,0,0);x.font=f;x.textAlign='center';x.textBaseline='middle';x.lineWidth=4;x.lineJoin='round';
  x.strokeStyle='rgba(3,8,20,0.9)';x.strokeText(s,w/2,h/2);x.fillStyle=c;x.fillText(s,w/2,h/2);
  return {img,w,h};
}
function addText(x,y,s,c,size,life){if(texts.length<TEXT_CAP[Q])texts.push({x,y,t:0,life:life||0.9,spr:textSprite(s,c,size||20)});}
function ring(x,y,max,w,col){if(rings.length<RING_CAP[Q])rings.push({x,y,t:0,max,w,col});}
// water: rings roll out across the surface, droplets hop up and fall back
function wave(x,y,r0,r1,a,life){if(waves.length<WAVE_CAP[Q])waves.push({x,y,r0,r1,a,t:0,life:life||1.2});}
function drop(x,y,r){
  if(parts.length>=PART_CAP[Q])return;const a=rnd(0,6.28),sp=rnd(15,55);
  parts.push({k:3,x:x+Math.cos(a)*r,y:y+Math.sin(a)*r*0.7,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*0.5-rnd(70,120),life:rnd(0.32,0.5),t:0,s:rnd(1.3,2.4)});
}
function splash(x,y,size,r0){                     // something meets the water: a ring or two and a few droplets
  r0=r0||2;wave(x,y,r0,r0+12+size*26,0.5+size*0.35,0.8+size*0.4);
  if(size>0.6)wave(x,y,r0*0.6,r0+6+size*12,0.4,0.6);
  for(let i=fxN(2+size*6);i>0;i--)drop(x,y,r0*0.8);
}
const inPond=(x,y)=>x>PX0&&x<PX0+PW&&y>PY0&&y<PY0+PH;
// seeds fly most of the way in a high arc, touch the water, then skip once to their spot
const SKIP=0.74;
function seedPos(s,k){
  const mx=lerp(s.x0,s.x1,0.84),my=lerp(s.y0,s.y1,0.84);
  if(k<SKIP){const u=k/SKIP;return {x:lerp(s.x0,mx,u),y:lerp(s.y0,my,u),h:Math.sin(Math.PI*u)*80};}
  const u=(k-SKIP)/(1-SKIP);return {x:lerp(mx,s.x1,u),y:lerp(my,s.y1,u),h:Math.sin(Math.PI*u)*14};
}
function moment(l){try{if(window.forgeMoment)window.forgeMoment(l);}catch(e){}}   // exciting moment (1-3) for the demo recorder
function banner(s,c,life){st.banner={s,c,t:0,life:life||1.8};}
function spawnBug(p){if(bugs.length<Math.min(20,BUG_CAP[Q]))bugs.push({x0:p.x+rnd(-8,8),y0:p.y+rnd(-8,8),t:0,dur:rnd(0.9,1.4),bend:rnd(-90,90),g:0});}
// caught fireflies carry their glow: it lands in the counter when they arrive (instantly if the sky is too busy)
function sendFly(x,y,g,dur,bend){if(bugs.length>=BUG_CAP[Q]){addGlow(g);st.pulse=Math.min(1,st.pulse+0.3);return;}bugs.push({x0:x,y0:y,t:0,dur,bend,g});}
const BQ={x:0,y:0};                               // scratch point: no allocation per firefly per frame
function bugPos(b,t){
  const u=Math.pow(clamp(t,0,1),1.6),v=1-u,tx=hudX,ty=38,cx=(b.x0+tx)/2+b.bend,cy=(b.y0+ty)/2-40;
  BQ.x=v*v*b.x0+2*v*u*cx+u*u*tx;BQ.y=v*v*b.y0+2*v*u*cy+u*u*ty;return BQ;
}
function ripple(b,v,soft){                       // the light pulse pulls pods in; its wave on the water pushes drifting leaves out
  if(!soft)ring(b.x,b.y,70+v*7,4,st.chain?'255,143,184':'255,215,94');
  wave(b.x,b.y,(b.r||4)+2,60+v*3,0.7,1.1);
  const R=150;
  for(const q of pods){
    if(q===b||q.dead||q.busy||(drag&&drag.p===q))continue;
    const dx=b.x-q.x,dy=b.y-q.y,d=Math.hypot(dx,dy)||1;
    if(d<R){const f=(1-d/R)*(60+v*4);q.vx+=dx/d*f;q.vy+=dy/d*f;q.pop=Math.max(q.pop,0.25*(1-d/R));}
  }
  for(const L of DRIFT){
    const dx=L.x-b.x,dy=L.y-b.y,d=Math.hypot(dx,dy)||1;
    if(d<R){const f=(1-d/R)*(30+v*2);L.vx+=dx/d*f;L.vy+=dy/d*f;L.va+=rnd(-1,1)*(1-d/R);}
  }
}

// ---------- core rules ----------
function findTarget(ex,x,y,v,r){
  let b=null,bd=1e9;
  for(const q of pods){if(q===ex||q.dead||q.busy||q.v!==v)continue;const d=Math.hypot(q.x-x,q.y-y);if(d<q.r+r*0.9&&d<bd){bd=d;b=q;}}
  return b;
}
function startMerge(a,b,dur){a.busy=b.busy=true;merges.push({a,b,t:0,dur,ax:a.x,ay:a.y,auto:dur>0.2});}
function finishMerge(m){
  const a=m.a,b=m.b;a.dead=true;b.busy=false;b.v*=2;b.r=podR(b.v);b.ff=b.ff.concat(a.ff);setFF(b);b.pop=1;
  const g=prod(b.v)*2*mults()*chainMult();addGlow(g);
  if(!m.auto)st.tf.merge=true;
  if(st.chain){                                   // mid-chain merges pay the multiplier; hand merges keep it alive
    st.chainG+=g;st.chainPop=Math.max(st.chainPop,0.5);
    if(!m.auto)st.chainT=Math.min(chainWin(),st.chainT+CHAIN_EXT);
    addText(b.x,b.y-b.r-8,'+'+fmt(g)+' x'+chainMult().toFixed(2),C.petal,20,0.9);
  }else addText(b.x,b.y-b.r-8,'+'+fmt(g),C.white,18,0.8);
  ripple(b,b.v);if(b.v>=8)moment(1);
  for(let i=fxN(6+b.v);i>0;i--)spark(b.x,b.y,rnd(40,140+b.v*6));
  if(thr('m',0.08)){if(st.chain)sChainMerge(b.v,st.chain);else sMerge(b.v);}
  st.shake=Math.max(st.shake,1+Math.log2(b.v)*0.8);
  if(b.v>=THRESH){b.busy=true;b.burstT=0;sCharge();}
}
function autoMerge(){                             // the breeze tidies the smallest pair; big merges and blooms are left to the player
  const dp=drag&&drag.p,pp=press&&press.p;
  const L=pods.filter(p=>!p.dead&&!p.busy&&p!==dp&&p!==pp);
  let best=null,bs=-1e9;
  for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){
    const a=L[i],b=L[j];if(a.v!==b.v)continue;
    const s=-a.v*1000-Math.hypot(a.x-b.x,a.y-b.y);if(s>bs){bs=s;best=[a,b];}
  }
  if(!best)return false;
  startMerge(best[0],best[1],0.4);
  ring(best[0].x,best[0].y,40,3,'244,247,255');
  return true;
}
function doBurst(p){
  p.dead=true;st.blooms++;st.tf.bloom=true;
  const cm=chainMult(),was=st.chain>0;           // a bloom inside a running chain pays the current multiplier
  const g=Math.max(20*bloomMult(),baseRate()*bloomSec(st.lv[5]))*cm;
  // the whole swarm breaks free and streams up to the counter, each firefly carrying a share of the bloom
  const n=p.ff.length||1;
  for(const f of p.ff){const q=ffPos(p,f,p.dr*1.4);sendFly(q.x,q.y,g/n,rnd(0.9,1.6),rnd(-170,170));}
  if(!p.ff.length)addGlow(g);
  if(!was)st.chainG=0;
  st.chain++;st.chainT=Math.max(3.5,CHAIN_WIN-0.7*(st.chain-1))+chainPlus();   // each link gives a shorter window
  st.chainG+=g;st.chainPop=1;st.chainEnd=0;
  addText(clamp(p.x,140,220),p.y-44,was?'CHAIN x'+cm.toFixed(2)+'!':n+' FIREFLIES FREE!',was?C.petal:C.gold,was?34:26,1.4);
  addText(p.x,p.y-8,'+'+fmt(g),C.white,24,1.3);
  banner(was?'Chain now x'+chainMult().toFixed(2):'Glow bonus x'+bloomMult().toFixed(2),C.petal,1.8);
  st.shake=Math.max(st.shake,Math.min(16,9+(was?st.chain*2:0)));st.flash=0.45;st.flowerT=0;
  ring(p.x,p.y,200,10,'255,143,184');
  if(was)ring(CRX,CRY,60,6,'255,143,184');
  wave(p.x,p.y,p.r,210,0.9,1.6);splash(p.x,p.y,1,p.r*0.8);
  for(let i=fxN(28);i>0;i--)petal(p.x,p.y);
  for(let i=fxN(18);i>0;i--)spark(p.x,p.y,rnd(100,320));
  ripple(p,32);sBurst(st.chain);moment(was?3:2);
  [1,1,2].forEach((sv,i)=>{const f=freeSpot(podR(sv));seeds.push({x0:p.x,y0:p.y,x1:f.x,y1:f.y,v:sv,t:-i*0.1,dur:0.72,pink:true});});
}
function endChain(){
  if(st.chain>=2)banner('CHAIN x'+chainMult().toFixed(2)+'  +'+fmt(st.chainG),C.petal,2);
  st.chainLast=chainMult();st.chain=0;st.chainT=0;st.chainEnd=0.4;sChainEnd();
}
// tier 2 seeds count every value on the bed (pods, merges about to land, seeds in flight) and plant the rarest one,
// preferring a value whose pod has no twin yet; ties go to the bigger value
function rareValue(){
  const cnt={},top=seedTop(st.lv[1]),add=v=>{if(v<=top)cnt[v]=(cnt[v]||0)+1;};
  for(const p of pods)if(!p.dead&&!p.busy)add(p.v);
  for(const m of merges)add(m.b.v*2);
  for(const s of seeds)add(s.v);
  let best=1,bk=1e9;
  for(const k in cnt){const v=+k,c=cnt[k],s=(c%2?0:1000)+c*10-Math.log2(v);if(s<bk){bk=s;best=v;}}
  return best;
}
function plantSeed(){
  const rare=st.lv[1]>=RARE_LV,v=rare?rareValue():1;
  let tw=null;
  if(rare)for(const p of pods)if(!p.dead&&!p.busy&&p.v===v&&(!tw||p.id<tw.id))tw=p;
  const f=freeSpot(podR(v),tw);
  seeds.push({x0:36,y0:BAR_Y,x1:f.x,y1:f.y,v,t:0,dur:0.66,pink:false,rare,tw});
}
function boostTap(){st.boost=Math.min(BOOST_MAX,st.boost+0.2);st.combo++;st.comboT=0.8;}
function tapPod(p){                               // catch one firefly: it flies to the counter carrying its glow
  if(p.dead)return false;
  const f=p.ff.find(f=>f.cd<=0);
  if(!f){
    p.pop=Math.max(p.pop,0.3);ring(p.x,p.y,p.r+14,2,'244,247,255');
    if(thr('e',0.3)){addText(p.x,p.y-p.r-6,'resting...',C.white,15,0.7);sDeny();}
    return false;
  }
  st.tf.catch=true;
  const g=catchV(p),q=ffPos(p,f,p.dr);f.cd=REGEN;
  sendFly(q.x,q.y,g,rnd(0.55,0.8),rnd(-60,60));boostTap();
  p.pop=1;addText(q.x,q.y-18,'+'+fmt(g),C.gold,20,0.8);
  for(let i=fxN(8);i>0;i--)spark(q.x,q.y,rnd(60,160));
  ring(q.x,q.y,34,3,'255,215,94');
  st.shake=Math.max(st.shake,1.5);sTap(st.combo);
  return true;
}

// ---------- critters: a golden frog, a luna moth and a wishing star (all need a tap at the right time) ----------
function frogSpot(){                              // near the pod with the most fireflies home
  let b=null,bs=0;for(const p of pods){if(p.dead||p.busy)continue;const s=ready(p)+Math.random();if(s>bs){bs=s;b=p;}}
  const a=rnd(0,6.28),d=rnd(55,85),x=b?b.x+Math.cos(a)*d:rnd(BX0+40,BX1-40),y=b?b.y+Math.sin(a)*d:rnd(BY0+60,BY1-40);
  return {x:clamp(x,BX0+26,BX1-26),y:clamp(y,BY0+44,BY1-22)};
}
function frogHop(x,y,d){const f=st.frog;f.x0=f.x;f.y0=f.y;f.x1=x;f.y1=y;f.hop=0;f.hd=d;f.face=x>=f.x?1:-1;tone(220,0.12,'sine',0.05,1.8);}
function frogIn(){
  const left=Math.random()<0.5,sp=frogSpot();
  st.frog={x:left?-30:W+30,y:sp.y,x0:0,y0:0,x1:0,y1:0,hop:-1,hd:0.5,s:'eat',food:0,need:FROG_NEED,bank:0,eatT:0.4,idle:0,fullT:0,tg:null,pop:0,gulp:0,face:1};
  frogHop(sp.x,sp.y,0.7);sCroak();
  addText(sp.x,sp.y-44,'GOLD FROG!',C.gold,20,1.2);
}
function frogStep(dt){
  const f=st.frog;f.pop=Math.max(0,f.pop-dt*3);f.gulp=Math.max(0,f.gulp-dt*3);
  if(f.hop>=0){
    f.hop+=dt/f.hd;const k=Math.min(1,f.hop);f.x=lerp(f.x0,f.x1,k);f.y=lerp(f.y0,f.y1,k);
    if(f.hop>=1){f.hop=-1;if(f.s==='out'){st.frog=null;st.frogT=frogI(st.cr[0]);return;}ring(f.x,f.y+10,40,3,'255,215,94');splash(f.x,f.y+10,0.8,12);}
    return;
  }
  if(f.s==='full'){                               // she waits for a tap... but not forever
    f.fullT-=dt;
    if(f.fullT<=0){f.s='out';frogHop(f.x<180?-40:W+40,f.y,0.6);banner('The frog hopped away...',C.white,2);sCroak();}
    return;
  }
  if(f.tg){                                       // tongue out: grab the firefly and reel it in
    const g=f.tg;g.t+=dt;
    if(!g.p.dead){const q=ffPos(g.p,g.f,g.p.dr);g.x=q.x;g.y=q.y;}
    if(g.t>=0.32){
      f.tg=null;f.food++;f.bank+=catchV(g.p)*3;f.gulp=1;f.eatT=frogEat(st.cr[0]);sGulp(f.food);
      for(let i=fxN(4);i>0;i--)spark(f.x,f.y,rnd(30,80));
      if(f.food>=f.need){
        f.s='full';f.fullT=FROG_FULL;sCharge();ring(f.x,f.y,90,6,'255,215,94');
        banner("She's FULL! TAP the frog to POP her!",C.gold,2.6);
      }
    }
    return;
  }
  f.eatT-=dt;f.idle+=dt;if(f.eatT>0)return;
  let bp=null,bd=150;
  for(const p of pods){if(p.dead||p.busy||!ready(p))continue;const d=Math.hypot(p.x-f.x,p.y-f.y);if(d<bd){bd=d;bp=p;}}
  if(!bp){f.eatT=0.25;if(f.idle>1){f.idle=0;const s=frogSpot();frogHop(s.x,s.y,0.5);}return;}
  f.idle=0;const ff=bp.ff.find(x=>x.cd<=0);ff.cd=REGEN+0.3;
  const q=ffPos(bp,ff,bp.dr);f.tg={p:bp,f:ff,t:0,x:q.x,y:q.y};f.face=bp.x>=f.x?1:-1;sLick();
}
function frogPop(){                               // the golden frog bursts: every firefly she ate streams to the counter
  const f=st.frog,l=st.cr[0],g=f.bank+baseRate()*frogSec(l),n=Math.min(22,f.food+10);
  for(let i=0;i<n;i++)sendFly(f.x+rnd(-14,14),f.y+rnd(-14,14),g/n,rnd(0.8,1.5),rnd(-170,170));
  addText(clamp(f.x,120,240),f.y-50,'FROG POP!',C.gold,36,1.5);
  addText(f.x,f.y-14,'+'+fmt(g),C.white,26,1.4);
  banner('Golden frog popped  +'+fmt(g),C.gold,2.2);
  st.shake=Math.max(st.shake,18);st.flash=0.55;
  ring(f.x,f.y,220,12,'255,215,94');ring(f.x,f.y,140,6,'255,143,184');
  for(let i=fxN(30);i>0;i--)spark(f.x,f.y,rnd(120,380));
  for(let i=fxN(18);i>0;i--)petal(f.x,f.y);
  ripple(f,24);sFrogPop();moment(3);
  [4,4].forEach((sv,i)=>{const s=freeSpot(podR(sv));seeds.push({x0:f.x,y0:f.y,x1:s.x,y1:s.y,v:sv,t:-i*0.12,dur:0.72,pink:true});});
  st.frog=null;st.frogT=frogI(l);
}
function frogTap(){
  const f=st.frog;if(!f)return;
  if(f.s==='full'){frogPop();return;}
  f.pop=1;sCroak();addText(f.x,f.y-40,f.food+'/'+f.need+' hungry',C.gold,17,0.8);
}

function catchMoth(){

function starIn(){const x=rnd(60,300);st.star={t:0,dur:6,x0:x,vx:(x<180?1:-1)*rnd(10,30),x,y:BY0-10};tone(1400,0.4,'sine',0.03,1.5);}
function catchStar(){                             // a wish: glow now plus twin 8s ready to merge into a bloom
  const s=st.star,l=st.cr[2],g=baseRate()*starSec(l);
  for(let i=0;i<12;i++)sendFly(s.x,s.y,g/12,rnd(0.7,1.3),rnd(-150,150));
  addText(clamp(s.x,110,250),s.y-30,'WISH! +'+fmt(g),C.white,28,1.4);

  seeds.push({x0:s.x,y0:s.y,x1:a.x,y1:a.y,v:8,t:0,dur:0.78,pink:true},{x0:s.x,y0:s.y,x1:b.x,y1:b.y,v:8,t:-0.12,dur:0.78,pink:true});
  for(let i=fxN(24);i>0;i--)spark(s.x,s.y,rnd(100,300));
  ring(s.x,s.y,180,8,'255,215,94');st.flash=0.4;st.shake=Math.max(st.shake,10);sStar();moment(2);

function critUpdate(dt){
  st.frenzy=Math.max(0,st.frenzy-dt);
  if(st.cr[0]>0){if(st.frog)frogStep(dt);else{st.frogT-=dt;if(st.frogT<=0)frogIn();}}
  if(st.cr[1]>0){
    const m=st.moth;
    if(m){
      m.t+=dt;const k=m.t/m.dur;
      m.x=(m.s>0?lerp(-30,W+30,k):lerp(W+30,-30,k))+Math.sin(m.t*1.3+m.ph)*30;
      m.y=m.y0+Math.sin(m.t*2.1+m.ph)*60+Math.sin(m.t*5)*8;
      if(m.t>=m.dur){st.moth=null;st.mothT=mothI(st.cr[1]);}
    }else{st.mothT-=dt;if(st.mothT<=0)mothIn();}
  }
  if(st.cr[2]>0){
    const s=st.star;
    if(s){
      s.t+=dt;s.x=clamp(s.x0+s.vx*s.t,24,W-24);s.y=BY0-10+s.t*58;
      if(parts.length<PART_CAP[Q]&&Math.random()<dt*20*FX[Q])parts.push({k:0,x:s.x,y:s.y,vx:rnd(-20,20),vy:rnd(-40,-10),life:rnd(.4,.8),t:0,s:rnd(5,9)});
      if(s.t>=s.dur){st.star=null;st.starT=starI(st.cr[2]);}
    }else{st.starT-=dt;if(st.starT<=0)starIn();}
  }
}
function critterTap(q){                           // moth and star always win; a full frog beats the pods under her
  const m=st.moth,s=st.star,f=st.frog;
  if(m&&Math.hypot(q.x-m.x,q.y-m.y)<38){catchMoth();return true;}
  if(s&&Math.hypot(q.x-s.x,q.y-s.y)<38){catchStar();return true;}
  if(f&&f.hop<0&&f.s!=='out'&&Math.hypot(q.x-f.x,q.y-f.y)<(f.s==='full'?44:30)){
    if(f.s==='full'||!podAt(q)){frogTap();return true;}
  }
  return false;
}

// ---------- tutorial: eight short steps, each advances when the player does the thing (k: its st.tf flag, or null for OK) ----------
const TUT=[
  {id:'catch',k:'catch',t:'TAP a glowing pod',s:()=>'Catch fireflies to earn glow'},
  {id:'merge',k:'merge',t:'DRAG a pod onto its twin',s:()=>'Same number merges: 1+1 = 2'},
  {id:'buy',k:'buy',t:'BUY an upgrade below',s:()=>{const c=cost(tutBtn());return st.glow>=c?'Tap the glowing button':'Save up: '+fmt(st.glow)+' / '+fmt(c)+' glow';}},
  {id:'page',k:'page',t:'TAP the arrow for more',s:()=>'Page 2: NET, LILY PADS, NECTAR'},
  {id:'bloom',k:'bloom',t:'Merge up to 16 to BLOOM',s:()=>'Biggest pod: '+bigV()+' / 16'},
  {id:'chain',k:null,t:'Bloom again = CHAIN!',s:()=>'Beat the pink timer for a bonus'},
  {id:'tab',k:'tab',t:'Open CRITTERS below',s:()=>'Unlock a golden frog: '+fmt(CRIT[0].unlock)+' glow'},
  {id:'moon',k:null,t:'Fill the MOON, then tap it',s:()=>'Full Moon at '+fmt(moonNeed(st.moons))+' glow: PETALS'},
];
const tutAt=id=>st.tut>=0&&TUT[st.tut].id===id;
function bigV(){let m=1;for(const p of pods)if(!p.dead&&p.v>m)m=p.v;return m;}
function tutBtn(){                                // cheapest upgrade on the page being shown
  const p0=st.pg[0]*3;let bi=p0,bc=Infinity;
  for(let i=p0;i<p0+3;i++){if(st.lv[i]>=UPS[i].max)continue;const c=cost(i);if(c<bc){bc=c;bi=i;}}
  return bi;
}
function tutPod(){                                // stick with one target pod while it still has fireflies home
  const p=st.tpod;if(p&&!p.dead&&!p.busy&&ready(p)>0)return p;
  let b=null,bs=-1;for(const q of pods){if(q.dead||q.busy)continue;const s=ready(q)*10+q.v;if(s>bs){bs=s;b=q;}}
  return st.tpod=b;
}
function tutPair(){
  const t=st.tp;if(t&&!t[0].dead&&!t[1].dead&&!t[0].busy&&!t[1].busy&&t[0].v===t[1].v)return t;
  let best=null,bd=1e9;
  for(let i=0;i<pods.length;i++)for(let j=i+1;j<pods.length;j++){
    const a=pods[i],b=pods[j];if(a.dead||b.dead||a.busy||b.busy||a.v!==b.v)continue;
    const d=Math.hypot(a.x-b.x,a.y-b.y);if(d<bd){bd=d;best=[a,b];}
  }
  return st.tp=best;
}
function nextTut(){
  st.tut++;st.tutT=0;
  if(st.tut>=TUT.length){st.tut=-1;tutSave();banner('You got it! Grow the garden',C.gold,2.4);}
  sStep();
}
function skipTut(){st.tut=-1;tutSave();sDrop();}

// ---------- drag (shared by player and demo AI) ----------
function grabPod(p,x,y,lift){                     // lifted off the water: a ring where it floated
  if(p.dead||p.busy)return false;drag={p,x,y,offx:p.x-x,offy:p.y-y,lift};p.vx=p.vy=0;wave(p.x,p.y,p.r,p.r+18,0.5,0.7);sPick();return true;
}
function moveDrag(x,y){if(drag){drag.x=x;drag.y=y;}}
function releaseDrag(){
  if(!drag)return;const p=drag.p;drag=null;
  if(p.dead||p.busy)return;
  const t=findTarget(p,p.x,p.y,p.v,p.r);
  if(t)startMerge(p,t,0.1);else{splash(p.x,p.y,0.7,p.r);sDrop();}   // no twin: it drops back in with a splash
  p.vx=p.vy=0;
}

function toLocal(e){const b=cv.getBoundingClientRect();return {x:(e.clientX-b.left-ox)/scale,y:(e.clientY-b.top-oy)/scale};}
function btnAt(q){if(q.y<UY||q.y>UY+UH)return -1;for(let i=0;i<3;i++)if(q.x>=UX[i]-3&&q.x<=UX[i]+UW+3)return i;return -1;}
const pageAt=q=>q.y>=UY&&q.y<=UY+UH&&pages(st.tab)>1&&(q.x<UX[0]-3?-1:q.x>UX[2]+UW+3?1:0);   // -1 / 1: an arrow beside the shop
function podAt(q){let hit=null,hd=1e9;for(const p of pods){if(p.dead||p.busy)continue;const d=Math.hypot(p.x-q.x,p.y-q.y);if(d<p.r+8&&d/p.r<hd){hd=d/p.r;hit=p;}}return hit;}

// ---------- demo AI: taps pods, drags merges, buys upgrades ----------
function aiUpdate(dt){
  ai.t+=dt;ai.lastBuy+=dt;ai.tap=Math.max(0,ai.tap-dt);
  if(ai.phase===0){
    if(ai.t<ai.wait)return;
    let act=null;
    if(st.frog&&st.frog.s==='full'&&st.frog.hop<0)act={k:'frog'};
    if(!act&&ai.lastBuy>2.5&&!ai.first){
      let bi=-1,bc=Infinity;
      for(let i=0;i<3;i++){if(st.lv[i]>=UPS[i].max)continue;const c=cost(i);if(c<=st.glow&&c<bc){bc=c;bi=i;}}
      if(bi>=0)act={k:'buy',i:bi};
    }
    const L=pods.filter(p=>!p.dead&&!p.busy);
    if(!act&&(ai.first||Math.random()<(st.chain?0.8:0.5))){   // the AI hunts the biggest pair to trigger / feed blooms
      let pr=null,pd=-1e9;
      for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){if(L[i].v!==L[j].v)continue;const d=L[i].v*1000-Math.hypot(L[i].x-L[j].x,L[i].y-L[j].y);if(d>pd){pd=d;pr=[L[i],L[j]];}}
      if(pr)act={k:'drag',p:pr[0],b:pr[1]};
    }
    ai.first=false;
    if(!act&&L.length){L.sort((a,b)=>ready(b)-ready(a));if(ready(L[0])>0)act={k:'tap',p:L[Math.floor(Math.random()*Math.min(2,L.length))],n:3+Math.floor(Math.random()*3)};}
    if(!act){ai.t=0;ai.wait=0.3;return;}
    ai.act=act;ai.phase=1;ai.t=0;ai.sx=ai.px;ai.sy=ai.py;
  }else if(ai.phase===1){
    const a=ai.act;
    if(a.p&&(a.p.dead||a.p.busy)){ai.phase=0;ai.t=0;ai.wait=0.1;return;}
    let tx,ty;
    if(a.k==='buy'){tx=UX[a.i]+UW/2;ty=UY+UH/2;}
    else if(a.k==='frog'){const f=st.frog;if(!f||f.s!=='full'){ai.phase=0;ai.t=0;ai.wait=0.1;return;}tx=f.x;ty=f.y;}
    else{tx=a.p.x;ty=a.p.y;}
    const k=easeIO(Math.min(1,ai.t/0.3));
    ai.px=lerp(ai.sx,tx,k);ai.py=lerp(ai.sy,ty,k);
    if(ai.t>=0.3){
      ai.t=0;
      if(a.k==='buy'){buy(a.i);ai.tap=0.15;ai.lastBuy=0;ai.phase=0;ai.wait=0.35;}
      else if(a.k==='frog'){frogTap();ai.tap=0.2;ai.phase=0;ai.wait=0.5;}
      else if(a.k==='tap'){ai.phase=3;ai.t=1;}
      else if(grabPod(a.p,ai.px,ai.py,0)){ai.phase=2;ai.sx=ai.px;ai.sy=ai.py;}
      else{ai.phase=0;ai.wait=0.1;}
    }
  }else if(ai.phase===2){
    const b=ai.act.b;
    if(!drag){ai.phase=0;ai.t=0;return;}
    if(b.dead||b.busy){releaseDrag();ai.phase=0;ai.t=0;ai.wait=0.2;return;}
    const k=easeIO(Math.min(1,ai.t/0.45));ai.px=lerp(ai.sx,b.x,k);ai.py=lerp(ai.sy,b.y,k);moveDrag(ai.px,ai.py);
    if(ai.t>=0.45){releaseDrag();ai.phase=0;ai.t=0;ai.wait=0.3;}
  }else{
    const a=ai.act;
    if(a.p.dead||a.p.busy||a.n<=0){ai.phase=0;ai.t=0;ai.wait=0.2;return;}
    ai.px=a.p.x;ai.py=a.p.y;
    if(ai.t>=0.14){ai.t=0;a.n--;if(!tapPod(a.p))a.n=0;ai.tap=0.1;}
  }
}

// ---------- update ----------
function physics(dt){
  const dp=drag&&drag.p,damp=Math.exp(-3*dt);
  for(const p of pods){
    if(p.dead||p.busy||p===dp)continue;
    const k=clock*0.5+p.id*1.7;
    p.vx+=Math.sin(k)*8*dt;p.vy+=Math.cos(k*0.8+p.id)*8*dt;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=damp;p.vy*=damp;
  }
  const push=Math.min(1,dt*10);
  for(let i=0;i<pods.length;i++){
    const a=pods[i];if(a.dead||a===dp)continue;
    for(let j=i+1;j<pods.length;j++){
      const b=pods[j];if(b.dead||b===dp||(a.busy&&b.busy))continue;
      let dx=b.x-a.x,dy=b.y-a.y;const mn=(a.r+b.r)*0.8;
      if(dx>mn||dx<-mn||dy>mn||dy<-mn)continue;   // cheap reject before the sqrt
      let d=Math.hypot(dx,dy);if(d>=mn)continue;
      if(d<0.01){dx=rnd(-1,1);dy=rnd(-1,1);d=Math.hypot(dx,dy)||1;}
      const m=(mn-d)*push,nx=dx/d,ny=dy/d;
      if(a.busy){b.x+=nx*m;b.y+=ny*m;}
      else if(b.busy){a.x-=nx*m;a.y-=ny*m;}
      else{a.x-=nx*m/2;a.y-=ny*m/2;b.x+=nx*m/2;b.y+=ny*m/2;}
    }
  }
  for(const p of pods){if(p.dead||p.busy||p===dp)continue;p.x=clamp(p.x,BX0+p.r*0.8,BX1-p.r*0.8);p.y=clamp(p.y,BY0+p.r*0.8,BY1-p.r*0.8);}
}
function driftUpdate(dt){                         // leaves adrift: a lazy current, nudged aside by pods, kept on the pond
  const damp=Math.exp(-1.2*dt),spin=Math.exp(-0.6*dt);
  for(const L of DRIFT){
    L.vx+=Math.sin(clock*0.15+L.ph)*4*dt;L.vy+=Math.cos(clock*0.12+L.ph*1.7)*4*dt;L.va+=Math.sin(clock*0.2+L.ph)*0.02*dt;
    for(const p of pods){
      if(p.dead)continue;const dx=L.x-p.x,dy=L.y-p.y,mn=p.dr+L.s*0.5;
      if(dx>mn||dx<-mn||dy>mn||dy<-mn)continue;
      const d=Math.hypot(dx,dy);if(d>=mn||d<0.01)continue;
      const f=(mn-d)*8*dt/d;L.vx+=dx*f;L.vy+=dy*f;
    }
    L.x+=L.vx*dt;L.y+=L.vy*dt;L.vx*=damp;L.vy*=damp;L.a+=L.va*dt;L.va*=spin;
    if(L.x<BX0){L.x=BX0;L.vx=Math.abs(L.vx)*0.5;}else if(L.x>BX1){L.x=BX1;L.vx=-Math.abs(L.vx)*0.5;}
    if(L.y<BY0){L.y=BY0;L.vy=Math.abs(L.vy)*0.5;}else if(L.y>BY1){L.y=BY1;L.vy=-Math.abs(L.vy)*0.5;}
  }
}

function update(dt){
  clock+=dt;
  if(DEMO)aiUpdate(dt);
  addGlow(rate()*dt);
  const bo=st.boost>0?BOOST_T:1;
  st.boost=Math.max(0,st.boost-dt);
  st.comboT-=dt;if(st.comboT<=0)st.combo=0;
  st.resetArm=Math.max(0,st.resetArm-dt);st.pulse=Math.max(0,st.pulse-dt*4);st.flowerT=Math.min(1,st.flowerT+dt*1.2);
  st.moonFx=Math.max(0,st.moonFx-dt*0.8);st.pgFx=Math.max(0,st.pgFx-dt*5);
  if(!st.moonHint&&moonReady()){st.moonHint=true;banner('FULL MOON! Tap the moon for petals',C.white,3);ring(MX,MY,90,6,'244,247,255');sStar();}
  for(let i=0;i<3;i++){st.btnP[i]=Math.max(0,st.btnP[i]-dt*5);st.btnS[i]=Math.max(0,st.btnS[i]-dt*3);}
  if(st.welcome){st.welcome.t+=dt;if(st.welcome.t>4.2)st.welcome=null;}
  if(st.banner){st.banner.t+=dt;if(st.banner.t>st.banner.life)st.banner=null;}
  if(st.tut>=0){st.tutT+=dt;const T=TUT[st.tut];if(T.k?(st.tf[T.k]&&st.tutT>0.5):st.tutT>6)nextTut();}
  // burst chain countdown: ticks speed up the last 2 seconds, pink embers rise while it runs
  if(st.chain){
    const prev=st.chainT;st.chainT-=dt;
    if(st.chainT<2&&st.chainT>0&&Math.floor(prev*4)!==Math.floor(st.chainT*4))sTick(Math.round((2-st.chainT)*6));
    if(st.chainT<=0)endChain();
    else if(parts.length<PART_CAP[Q]&&Math.random()<dt*(5+st.chain*3)*FX[Q])
      parts.push({k:2,x:rnd(BX0,BX1),y:BY1+6,vx:rnd(-12,12),vy:rnd(-150,-80),life:rnd(1.2,2),t:0,s:rnd(6,11)});
  }
  st.chainPop=Math.max(0,st.chainPop-dt*3);st.chainEnd=Math.max(0,st.chainEnd-dt);
  critUpdate(dt);
  st.tint+=((st.chain?Math.min(1,0.4+0.2*st.chain):0)-st.tint)*Math.min(1,dt*4);
  // seeds plant themselves, the breeze merges pairs (breeze waits while the tutorial teaches merging)
  const live=livePods();
  if(live+seeds.length<cap()){st.spawnT+=dt*bo;if(st.spawnT>=seedI(st.lv[1])){st.spawnT=0;plantSeed();}}
  if(st.tut<0||st.tut>1){const mi=mergeI(st.lv[2]);st.mergeT+=dt*bo;if(st.mergeT>=mi)st.mergeT=autoMerge()?0:mi;}
  // ambient fireflies drifting up to the counter
  st.bugAcc+=dt*Math.min(4,0.4+live*0.15)*(st.boost>0?2:1)*FX[Q];
  while(st.bugAcc>=1){st.bugAcc-=1;if(pods.length){const p=pods[Math.floor(Math.random()*pods.length)];if(!p.dead)spawnBug(p);}}
  if(drag){
    const e=Math.exp(-12*dt),p=drag.p;drag.offx*=e;drag.offy=drag.lift+(drag.offy-drag.lift)*e;
    if(p.dead||p.busy)drag=null;
    else{p.x=clamp(drag.x+drag.offx,BX0-10,BX1+10);p.y=clamp(drag.y+drag.offy,BY0-10,BY1+10);}
  }
  physics(dt);driftUpdate(dt);
  const dp=drag&&drag.p,calm=waves.length<WAVE_CAP[Q]-8;
  for(const p of pods){
    if(p.dead)continue;
    p.born=Math.min(1,p.born+dt*4);p.pop=Math.max(0,p.pop-dt*3);p.dr+=(p.r-p.dr)*Math.min(1,dt*10);
    for(const f of p.ff)if(f.cd>0){f.cd-=dt;if(f.cd<=0)f.back=0.4;}else if(f.back>0)f.back-=dt;
    if(p.burstT>=0){p.burstT+=dt;if(p.burstT>=0.45)doBurst(p);}
    else if(p!==dp&&(p.wv-=dt)<=0){p.wv=rnd(2.5,5);if(calm)wave(p.x,p.y,p.dr+1,p.dr+14,0.2,1.6);}   // floating pods bob: faint rings
  }
  // lists are compacted in place (no per-frame array allocations)
  let j=0;
  for(let i=0;i<merges.length;i++){
    const m=merges[i];m.t+=dt;const k=easeIO(Math.min(1,m.t/m.dur));
    m.a.x=lerp(m.ax,m.b.x,k);m.a.y=lerp(m.ay,m.b.y,k);
    if(m.t>=m.dur)finishMerge(m);else merges[j++]=m;
  }
  merges.length=j;j=0;
  for(let i=0;i<seeds.length;i++){
    const s=seeds[i];s.t+=dt;
    if(!s.sk&&s.t>=s.dur*SKIP){s.sk=true;const q=seedPos(s,SKIP);splash(q.x,q.y,0.25);sSkip();}   // first touch: a skip
    if(s.t<s.dur){seeds[j++]=s;continue;}
    const r=podR(s.v),p=makePod(s.v,clamp(s.x1,BX0+r*0.8,BX1-r*0.8),clamp(s.y1,BY0+r*0.8,BY1-r*0.8));p.born=0.3;
    splash(p.x,p.y,0.9,r*0.5);                    // ...then it plops in and floats up as a pod
    for(let k=fxN(3);k>0;k--)spark(p.x,p.y,rnd(30,90));
    if(s.rare&&s.v>1){                          // a rare seed flags the twin it was grown for
      ring(p.x,p.y,p.r+26,4,'255,215,94');
      if(s.tw&&!s.tw.dead&&s.tw.v===s.v){s.tw.pop=Math.max(s.tw.pop,0.6);ring(s.tw.x,s.tw.y,s.tw.r+26,4,'255,215,94');}
      if(thr('r',0.25))tone(semi(523,PENTA[Math.min(10,Math.log2(s.v)*2)]),0.14,'triangle',0.07,1.3);
    }else sPlant();
  }
  seeds.length=j;j=0;
  for(let i=0;i<pods.length;i++)if(!pods[i].dead)pods[j++]=pods[i];
  pods.length=j;j=0;
  const dm=Math.exp(-2*dt);
  for(let i=0;i<parts.length;i++){
    const p=parts[i];p.t+=dt;
    if(p.t>=p.life){if(p.k===1&&Math.random()<0.35&&inPond(p.x,p.y))wave(p.x,p.y,1,10,0.35,0.7);continue;}   // petals settle on the water
    if(p.k!==2){p.vx*=dm;p.vy*=dm;}
    if(p.k===1){p.vy+=70*dt;p.rot+=p.vr*dt;}else if(p.k===3)p.vy+=420*dt;
    p.x+=p.vx*dt;p.y+=p.vy*dt;parts[j++]=p;
  }
  parts.length=j;j=0;
  for(let i=0;i<bugs.length;i++){
    const b=bugs[i];b.t+=dt;
    if(b.t<b.dur){bugs[j++]=b;continue;}
    st.pulse=Math.min(1,st.pulse+(b.g?0.5:0.2));
    if(b.g){addGlow(b.g);if(Math.random()<0.5)spark(hudX,38,rnd(40,90));if(thr('a',0.06))tone(1568,0.05,'sine',0.035,1.1);}
  }
  bugs.length=j;j=0;
  for(let i=0;i<rings.length;i++){const r=rings[i];r.t+=dt;if(r.t<0.7)rings[j++]=r;}
  rings.length=j;j=0;
  for(let i=0;i<waves.length;i++){const w=waves[i];w.t+=dt;if(w.t<w.life)waves[j++]=w;}
  waves.length=j;j=0;
  for(let i=0;i<texts.length;i++){const t=texts[i];t.t+=dt;t.y-=28*dt;if(t.t<t.life)texts[j++]=t;else if(TXT_POOL.length<TEXT_CAP[2])TXT_POOL.push(t.spr.img);}
  texts.length=j;
  st.shake=Math.max(0,st.shake-dt*40);st.flash=Math.max(0,st.flash-dt*2);
  if(!DEMO){st.saveT+=dt;if(st.saveT>5){st.saveT=0;save();}}
}

// ---------- render ----------
let BS=1,BXo=0,BYo=0;                             // current base transform (scale + offset incl. shake)
function baseT(){ctx.setTransform(BS,0,0,BS,BXo,BYo);}
function drawRot(img,x,y,w,h,rot){const c=Math.cos(rot)*BS,s=Math.sin(rot)*BS;ctx.setTransform(c,s,-s,c,BXo+x*BS,BYo+y*BS);ctx.drawImage(img,-w/2,-h/2,w,h);}
function drawPod(p,mode){
  const lvl=Math.min(4,Math.round(Math.log2(p.v))),P=PODS[lvl],base=mode===1?0.4:1,bo=st.boost>0;
  let s=(p.born<1?Math.max(0.01,easeOutBack(p.born)):1)*(1+p.pop*0.22);
  if(p.burstT>=0)s*=1+p.burstT*0.7+Math.sin(p.burstT*60)*0.04;
  s*=mode===4?1.12:1+0.015*Math.sin(clock*1.8+p.id*1.3);   // lifted by the finger, or bobbing on the water
  const r=p.dr*s,x=p.x,y=p.y,n=p.ff.length,rf=n?ready(p)/n:0,e=P.E*r/P.r;

      if(!b.g)continue;const w=Math.abs(Math.sin(clock*40+b.bend))*5+1,x=b.qx,y=b.qy;
      ctx.moveTo(x-3+4*Math.cos(-0.5),y-2+4*Math.sin(-0.5));ctx.ellipse(x-3,y-2,4,w,-0.5,0,Math.PI*2);
      ctx.moveTo(x+3+4*Math.cos(0.5),y-2+4*Math.sin(0.5));ctx.ellipse(x+3,y-2,4,w,0.5,0,Math.PI*2);
    }
    ctx.fill();
  }
  ctx.globalAlpha=1;
  // floating texts: pre-rendered sprites, popping in
  for(const t of texts){
    const k=t.t/t.life,z=t.t<0.15?Math.max(0.01,easeOutBack(t.t/0.15)):1,S=t.spr,w=S.w*z,h=S.h*z;
    ctx.globalAlpha=k>0.7?(1-k)/0.3:1;ctx.drawImage(S.img,t.x-w/2,t.y-h/2,w,h);
  }
  ctx.globalAlpha=1;
  // chain tint: a pulsing pink vignette (cached image) that deepens with every bloom in the chain
  if(st.tint>0.01){
    ctx.globalAlpha=st.tint*(0.8+0.2*Math.sin(clock*(4+st.chain*1.5)));
    const vx=-ox/scale-12,vy=-oy/scale-12;ctx.drawImage(VIG,vx,vy,W-2*vx,H-2*vy);ctx.globalAlpha=1;
  }
  // HUD: glow counter + rate
  const r=rate(),txt=fmt(st.glow),sc=1+st.pulse*0.08;
  ctx.save();ctx.translate(180,38);ctx.scale(sc,sc);
  ctx.font='bold 34px sans-serif';const tw=ctx.measureText(txt).width,ix=10-tw/2-18;
  hudX=180+ix*sc;
  // counter icon: a firefly, glowing brighter as the caught ones arrive
  const gs=18+st.pulse*10,wf=Math.abs(Math.sin(clock*18))*4;
  ctx.globalAlpha=0.7+st.pulse*0.3;ctx.drawImage(GLOW,ix-gs,-gs,gs*2,gs*2);
  ctx.globalAlpha=0.6;ctx.fillStyle=C.white;ctx.beginPath();ctx.ellipse(ix-5,-6,6,wf+2,-0.6,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(ix+5,-6,6,wf+2,0.6,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;ctx.fillStyle='#2a3350';ctx.beginPath();ctx.ellipse(ix,-3,3,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff6c8';circ(ix,4,4.5);ctx.fill();
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=5;ctx.lineJoin='round';ctx.strokeStyle='rgba(3,8,20,0.8)';ctx.strokeText(txt,10,1);ctx.fillStyle='#fff';ctx.fillText(txt,10,1);
  ctx.restore();
  const fz=st.frenzy>0;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 19px sans-serif';ctx.fillStyle=fz?C.white:bo?C.petal:C.gold;
  ctx.fillText('+'+fmt(r,1)+' /s'+(fz?'  FRENZY':'')+(bo?'  BOOST':''),180,70,200);
  if(bo&&fz){drawBar(120,86,58,st.boost/BOOST_MAX,C.petal);drawBar(182,86,58,st.frenzy/st.frenzyD,C.white);}
  else if(bo)drawBar(120,86,120,st.boost/BOOST_MAX,C.petal);
  else if(fz)drawBar(120,86,120,st.frenzy/st.frenzyD,C.white);
  drawChain();
  // the moon waxes toward the next Full Moon; once full it pulses and asks for a tap
  const mr=moonReady(),ms=1+0.5*st.moonFx*st.moonFx+(mr?0.06*Math.sin(clock*5):0);
  drawMoon(MX,MY,20*ms,0.08+0.92*Math.min(1,st.moonG/moonNeed(st.moons)));
  if(mr){
    const k=(clock%1.2)/1.2;ctx.globalAlpha=1-k;ctx.strokeStyle=C.white;ctx.lineWidth=3;circ(MX,MY,24+k*18);ctx.stroke();ctx.globalAlpha=1;
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 14px sans-serif';ctx.lineWidth=4;ctx.lineJoin='round';ctx.strokeStyle='rgba(3,8,20,0.9)';
    ctx.strokeText('TAP!',MX,MY+34);ctx.fillStyle=C.white;ctx.fillText('TAP!',MX,MY+34);ctx.lineJoin='miter';
  }
  drawIconButtons();
  // timers row
  const full=livePods()+seeds.length>=cap(),paused=st.tut===0||st.tut===1;
  ctx.textAlign='left';ctx.font='bold 13px sans-serif';ctx.fillStyle=full?C.petal:st.lv[1]>=RARE_LV?C.gold:C.aqua;ctx.fillText(full?'FULL':st.lv[1]>=RARE_LV?'RARE':'SEED',16,BAR_Y+1);
  drawBar(58,BAR_Y,112,full?1:st.spawnT/seedI(st.lv[1]),full?'rgba(255,143,184,0.6)':C.aqua);
  ctx.fillStyle=paused?'rgba(244,247,255,0.4)':C.white;ctx.fillText('BREEZE',186,BAR_Y+1);
  drawBar(246,BAR_Y,98,st.mergeT/mergeI(st.lv[2]),C.white);
  drawTabs();
  for(let i=0;i<3;i++)drawButton(i);
  drawPager();
  drawTutCard();
  drawBanner();
  if(st.resetArm>0){rr(176,100,164,30,15);ctx.fillStyle='rgba(30,6,26,0.95)';ctx.fill();ctx.strokeStyle=C.petal;ctx.lineWidth=1.5;ctx.stroke();ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=C.petal;ctx.fillText('Tap again to restart',258,116);}
  // welcome back
  if(st.welcome){
    const w=st.welcome,a=Math.max(0,Math.min(1,w.t*4,(4.2-w.t)*3)),s=Math.max(0.01,easeOutBack(Math.min(1,w.t*3)));
    ctx.save();ctx.globalAlpha=a;ctx.translate(180,290);ctx.scale(s,s);
    rr(-145,-68,290,136,22);ctx.fillStyle='rgba(8,14,34,0.93)';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=C.gold;ctx.stroke();
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='bold 26px sans-serif';ctx.fillStyle=C.gold;ctx.fillText('WELCOME BACK',0,-36);
    ctx.font='bold 16px sans-serif';ctx.fillStyle='rgba(244,247,255,0.8)';ctx.fillText('Your fireflies kept glowing',0,-6);
    ctx.globalAlpha=a*0.8;for(let i=0;i<6;i++){const ang=clock*1.5+i*1.047;ctx.drawImage(GLOW,Math.cos(ang)*130-8,Math.sin(ang)*52-8,16,16);}
    ctx.globalAlpha=a;ctx.font='bold 32px sans-serif';ctx.fillStyle='#fff';ctx.fillText('+'+fmt(w.g),0,32);
    ctx.restore();
  }
  if(st.help)drawHelp();
  if(st.moonCard)drawMoonCard();
  if(DEMO)drawFinger(ai.px,ai.py,ai.phase===2||ai.tap>0);
  if(st.flash>0){ctx.globalAlpha=1;ctx.fillStyle=`rgba(255,238,248,${st.flash*0.55})`;ctx.fillRect(-500,-500,W+1000,H+1000);}
}

// ---------- loop ----------
function perf(gap){                               // sustained slow frames -> lower resolution + fewer effects
  upT+=gap;if(upT<2||gap>0.25||Q===0)return;
  perfEma+=(gap-perfEma)*0.05;
  if(perfEma>0.022){perfBad+=gap;if(perfBad>1.5){Q--;perfBad=0;perfEma=1/60;resize();}}
  else perfBad=Math.max(0,perfBad-gap);
}
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  try{
    const gap=Math.max(0,(now-last)/1000);last=now;
    if(gap>3)awardAway(gap);                     // tab was in the background: fireflies kept working
    perf(gap);
    update(Math.min(0.05,gap));render();
  }catch(e){showErr(e);}
}
newGame(false);
requestAnimationFrame(frame);
})();
</script>
